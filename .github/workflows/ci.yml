name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches-ignore: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DB_PATH: /tmp/1stfp-ci.db
          DEMO_MODE: on
      - name: Keyless boot smoke test
        run: |
          DB_PATH=/tmp/1stfp-ci-boot.db PORT=3900 DEMO_MODE=on node server/dist/app.js &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 3
          curl -sf localhost:3900/api/health
          curl -sf localhost:3900/api/integrations > /dev/null
