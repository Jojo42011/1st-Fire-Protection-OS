name: Deploy to Fly.io

# Pushes to main/master auto-deploy to the cloud. No local machine involved.
# Working branches (claude/*) do NOT auto-deploy: shipping is an explicit,
# reviewed merge to main, never a side effect of a branch push.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # keyless boot smoke test — must start on seeded data with no secrets
      - name: Boot smoke test
        run: |
          DB_PATH=/tmp/ci.db PORT=3900 node server/dist/app.js &
          PID=$!
          sleep 3
          curl -sf localhost:3900/api/health
          curl -sf localhost:3900/api/integrations > /dev/null
          kill $PID

  deploy:
    name: Deploy to Fly.io
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once (SQLite = one machine)
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (bootstraps app + volume on first run)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::No FLY_API_TOKEN secret set."
            echo "Add it in: repo -> Settings -> Secrets and variables -> Actions -> New repository secret (name: FLY_API_TOKEN)."
            exit 1
          fi

          # app name is the single source of truth in fly.toml
          APP=$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Target app: $APP"

          # create the app once (idempotent — no-op if it already exists)
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "Creating app $APP in org $FLY_ORG ..."
            flyctl apps create "$APP" --org "$FLY_ORG"
          else
            echo "App $APP already exists — deploying update."
          fi

          # Deploy. --ha=false keeps it to ONE machine (required for SQLite on one volume).
          # The [mounts] initial_size in fly.toml auto-creates the fp_data volume on first deploy.
          flyctl deploy --remote-only --ha=false

          echo "Deployed. URL: https://$APP.fly.dev"
