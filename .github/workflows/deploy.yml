name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # keyless boot smoke test — must start on seeded data with no secrets
      - name: Boot smoke test
        run: |
          DB_PATH=/tmp/ci.db PORT=3900 node server/dist/app.js &
          PID=$!
          sleep 3
          curl -sf localhost:3900/api/health
          curl -sf localhost:3900/api/integrations > /dev/null
          kill $PID

  deploy:
    name: Deploy to Fly.io
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once (SQLite = one machine)
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "No FLY_API_TOKEN secret set — skipping deploy (build passed)."
            echo "Add it in: repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 0
          fi
          # --ha=false keeps it to a single machine (required for SQLite on one volume)
          flyctl deploy --remote-only --ha=false
