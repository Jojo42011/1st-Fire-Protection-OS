<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Integrations · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" /><link rel="stylesheet" href="/signal.css" /><link rel="stylesheet" href="/os.css" />
<style>
  /* System-of-record cards: the kit has no connector card, so this small block only lays one out. */
  .ic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .ic{border:1px solid var(--border-card,var(--border));border-radius:14px;background:var(--panel);padding:17px 18px;box-shadow:var(--sh-rest);display:flex;flex-direction:column;gap:12px}
  .ic.off{border-style:dashed;border-color:var(--border-strong,#c9ccd6);background:var(--fill)}
  /* per-purpose mail sender editor */
  .ms-list{display:flex;flex-direction:column;gap:8px}
  .ms-row{display:flex;align-items:center;gap:8px}
  .ms-lab{flex:none;width:132px;font-weight:650;font-size:12px;color:var(--ink-2)}
  .ms-in{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--ink);padding:7px 9px;font:inherit;font-size:12.5px}
  .ms-in:focus{outline:none;border-color:var(--brand)}
  .ms-save{flex:none;font-weight:700;font-size:11.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 11px;cursor:pointer}
  .ms-save:hover{border-color:var(--border-strong,var(--border))}
  @media(max-width:520px){.ms-lab{width:96px}}
  .ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ic-nm{font-weight:800;font-size:16px;color:var(--ink)}
  .ic-role{font-weight:600;font-size:11.5px;color:var(--muted);margin-top:2px}
  .ic-rows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
  .ic-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12.5px}
  .ic-row .k{font-weight:600;color:var(--muted);white-space:nowrap}
  .ic-row .v{font-weight:700;color:var(--ink-2);text-align:right}
  .ic-row .v.bad{color:var(--os-bad)}.ic-row .v.warn{color:var(--os-warn)}.ic-row .v.good{color:var(--os-good)}
  .ic-unavail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .ic-unavail li{display:flex;gap:8px;font-weight:600;font-size:12.5px;color:var(--ink-3);line-height:1.4}
  .ic-unavail li::before{content:"·";color:var(--os-warn);font-weight:800}
  .ic-connect{align-self:flex-start;font-family:var(--sans);font-weight:700;font-size:12.5px;color:#fff;background:var(--os-accent);border:none;border-radius:10px;padding:9px 15px;cursor:pointer}
  .ic-connect:hover{filter:brightness(1.08)}
  /* sync-schedule controls, one block per connector */
  .ic-sched{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:9px}
  .ic-sched .sc-lab{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ic-sched .sc-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ic-sched select{flex:1;min-width:130px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink);
    border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--panel);cursor:pointer}
  .ic-sched select:focus{outline:none;border-color:var(--os-accent)}
  .sc-now{font-family:var(--sans);font-weight:700;font-size:12px;color:var(--ink);background:var(--panel);
    border:1px solid var(--border-strong,var(--border));border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap;transition:background .15s}
  .sc-now:hover{background:var(--fill)}
  .sc-now:disabled{opacity:.5;cursor:default}
  .sc-meta{font-weight:600;font-size:11.5px;color:var(--muted)}
  .sc-meta .bad{color:var(--os-bad)}.sc-meta .good{color:var(--os-good)}
</style>
</head><body>
  <div class="os-wrap">
    <div class="os-screen-head">
      <div>
        <h1>Integrations</h1>
        <div class="os-question">What is connected, and is it healthy?</div>
      </div>
    </div>

    <div class="ic-grid" id="grid"></div>
    <div class="os-foot" id="foot"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var ROLE={ servicetrade:'Field service · system of record', bamboo:'People · roster of record',
  microsoft:'Identity · sign-in &amp; access', intacct:'Finance · accounting of record' };

function statePill(s){
  if(!s.connected) return OS.pill('Not connected','warn');
  if(s.status==='stale') return OS.pill('Stale','warn');
  if(s.status==='no_sync') return OS.pill('Connected','neutral');
  return OS.pill('Connected','good');
}
function syncHealth(s){
  if(!s.connected) return {t:'not connected', cls:'warn'};
  if(s.status==='stale') return {t:'sync overdue', cls:'warn'};
  if(s.status==='no_sync') return {t:'no sync yet', cls:'neutral'};
  return {t:'no failures reported', cls:'good'};
}
function lastSync(s){ return s.lastSyncedAt?('Last sync '+OS.ago(s.lastSyncedAt)):(s.connected?'No sync yet':'not connected'); }

function row(k,v,cls){ return '<div class="ic-row"><span class="k">'+k+'</span><span class="v'+(cls?' '+cls:'')+'">'+v+'</span></div>'; }

var CADENCE=[
  {v:0,l:'Paused'},{v:5,l:'Every 5 minutes'},{v:15,l:'Every 15 minutes'},{v:30,l:'Every 30 minutes'},
  {v:60,l:'Hourly'},{v:180,l:'Every 3 hours'},{v:720,l:'Every 12 hours'},{v:1440,l:'Once a day'}
];
function cadenceLabel(sc){ if(!sc||!sc.enabled||sc.interval_minutes<=0) return 'Paused'; var m=CADENCE.filter(function(c){return c.v===sc.interval_minutes;})[0]; return m?m.l:('Every '+sc.interval_minutes+' min'); }
function schedBlock(key, sc){
  if(!sc) return '';
  // The select value is the interval in minutes; 0 means paused. It always includes the current
  // stored interval as an option even if it is not one of the presets.
  var cur=(!sc.enabled||sc.interval_minutes<=0)?0:sc.interval_minutes;
  var opts=CADENCE.slice();
  if(cur>0 && !opts.some(function(c){return c.v===cur;})) opts.push({v:cur,l:'Every '+cur+' min'});
  var sel='<select data-sched="'+key+'">'+opts.map(function(c){
    return '<option value="'+c.v+'"'+(c.v===cur?' selected':'')+'>'+c.l+'</option>';
  }).join('')+'</select>';
  var last=sc.last_run_at?('Last run '+OS.ago(sc.last_run_at)):'Not run yet';
  var stat=sc.last_status==='error'?' · <span class="bad">last run failed</span>':(sc.last_status==='ok'&&sc.last_detail?' · '+OS.esc(sc.last_detail):'');
  return '<div class="ic-sched">'+
    '<div class="sc-lab">Auto-sync</div>'+
    '<div class="sc-controls">'+sel+'<button class="sc-now" data-syncnow="'+key+'">Sync now</button></div>'+
    '<div class="sc-meta">'+OS.esc(last)+stat+'</div>'+
  '</div>';
}
function connectorCard(s, records, sc){
  var health=syncHealth(s);
  return '<div class="ic'+(s.connected?'':' off')+'">'+
    '<div class="ic-top"><div><div class="ic-nm">'+OS.esc(s.label)+'</div><div class="ic-role">'+(ROLE[s.key]||'')+'</div></div>'+statePill(s)+'</div>'+
    '<div class="ic-rows">'+
      row('Connection', s.connected?'Connected':'Not connected', s.connected?'good':'warn')+
      row('Last sync', OS.esc(lastSync(s)))+
      row('Records', records||'<span class="muted">not mirrored</span>')+
      row('Sync health', health.t, health.cls)+
    '</div>'+
    schedBlock(s.key, sc)+
  '</div>';
}

function mailCard(m){
  var creds=!!(m&&m.credsPresent);
  var senders=(m&&m.senders)||[];
  var list=senders.map(function(s){
    return '<div class="ms-row"><div class="ms-lab">'+OS.esc(s.label)+'</div>'+
      '<input class="ms-in" data-mail-key="'+OS.esc(s.key)+'" value="'+OS.esc(s.address||'')+'" placeholder="mailbox@1stfp.com" spellcheck="false" />'+
      '<button class="ms-save" data-mail-save="'+OS.esc(s.key)+'">Save</button></div>';
  }).join('');
  return '<div class="ic'+(creds?'':' off')+'">'+
    '<div class="ic-top"><div><div class="ic-nm">Email (Microsoft 365)</div><div class="ic-role">Outbound mail · Microsoft Graph Mail.Send</div></div>'+OS.pill(creds?'Connected':'Not connected',creds?'good':'warn')+'</div>'+
    '<div class="ic-rows">'+
      row('Permission', 'Mail.Send', 'good')+
      row('Senders', 'one mailbox per purpose (below)')+
    '</div>'+
    (senders.length?('<div class="ms-list">'+list+'</div>'):'')+
    (creds?'<div class="muted" style="font-size:11.5px;line-height:1.5;margin-top:2px">A blank address falls back to the default (MS_MAIL_FROM). Each mailbox must exist in your tenant.</div>'
          :'<div class="muted" style="font-size:12px;line-height:1.5">Connect Microsoft Graph (and grant <b>Mail.Send</b>) to enable outbound email.</div>')+
  '</div>';
}
function googleCard(g, sc){
  var connected=!!(g&&g.connected), configured=!!(g&&g.configured);
  var pill=connected?OS.pill('Connected','good'):(configured?OS.pill('Not connected','warn'):OS.pill('Not configured','neutral'));
  var action=connected
    ? '<div class="sc-controls" style="margin-top:10px"><button class="sc-now" data-google-disc>Disconnect</button></div>'
    : (configured
        ? '<a class="ic-connect" style="text-decoration:none;text-align:center;display:block" href="/api/google/auth">Connect Google</a>'
        : '<div class="muted" style="font-size:12px;line-height:1.5">Needs a Google Cloud OAuth client (GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET) and Google’s approval of the Business Profile API. Replies are drafted and held until then; nothing posts.</div>');
  return '<div class="ic'+(connected?'':' off')+'">'+
    '<div class="ic-top"><div><div class="ic-nm">Google Business Profile</div><div class="ic-role">Reviews · auto-reply 4-5 stars, hold the rest</div></div>'+pill+'</div>'+
    '<div class="ic-rows">'+
      row('Connection', connected?('Signed in as '+OS.esc(g.email||'owner')):'Not connected', connected?'good':'warn')+
      (connected&&g.account?row('Account', OS.esc(g.account)):'')+
      row('Policy', 'Auto-reply positives · hold negatives', 'good')+
    '</div>'+
    (connected?schedBlock('google_business', sc):'')+
    action+
  '</div>';
}
function intacctCard(s){
  var unavailable=[
    'True accounts receivable and cash collected (only operational invoice data exists today)',
    'Booked revenue, margin and operating income',
    'Office-level financials: AR stays company-wide until Intacct attributes it',
    'General-ledger truth to reconcile ServiceTrade against'
  ];
  return '<div class="ic off">'+
    '<div class="ic-top"><div><div class="ic-nm">'+OS.esc(s.label)+'</div><div class="ic-role">'+ROLE.intacct+'</div></div>'+OS.pill('Not connected','warn')+'</div>'+
    '<div class="ic-rows"><div style="font-weight:650;font-size:12px;color:var(--muted)">Unavailable until connected:</div>'+
      '<ul class="ic-unavail">'+unavailable.map(function(u){return '<li>'+OS.esc(u)+'</li>';}).join('')+'</ul></div>'+
    '<button class="ic-connect" id="ic-connect">Connect Sage Intacct</button></div>';
}

var SCH={};
function load(){
  document.getElementById('grid').innerHTML=OS.skeletonKpis(4);
  Promise.all([
    OS.sources(),
    fetch('/api/licenses').then(function(r){return r.json();}).catch(function(){return {};}),
    fetch('/api/sync-schedules').then(function(r){return r.json();}).catch(function(){return {};}),
    fetch('/api/onboarding/mail-status').then(function(r){return r.json();}).catch(function(){return {};}),
    fetch('/api/google/status').then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){
    var src=(res[0].sources||[]);
    var lic=res[1]||{}; var sum=lic.summary||{};
    var mail=res[3]||{};
    var gbiz=res[4]||{};
    SCH={}; ((res[2]&&res[2].schedules)||[]).forEach(function(s){ SCH[s.integration_key]=s; });
    var by={}; src.forEach(function(s){by[s.key]=s;});

    // Real record counts where a source exposes them; honest blanks where it does not.
    var stRecords=(by.servicetrade&&by.servicetrade.detail)?OS.esc(by.servicetrade.detail):null;
    var roster=(sum.activeEmployees||0)+(sum.terminatedEmployees||0);
    var bambooRecords=roster>0?('<b>'+OS.num(roster)+'</b> employees on roster'):null;

    var order=['servicetrade','bamboo','microsoft'];
    var cards=order.map(function(k){
      var s=by[k]; if(!s) return '';
      var records = k==='servicetrade'?stRecords : k==='bamboo'?bambooRecords : null;
      return connectorCard(s, records, SCH[k]);
    });
    cards.push(mailCard(mail));
    cards.push(googleCard(gbiz, SCH['google_business']));
    var intacct=by.intacct;
    cards.push(intacct?intacctCard(intacct):'');
    document.getElementById('grid').innerHTML=cards.filter(Boolean).join('');

    document.getElementById('foot').innerHTML=
      'These are the systems of record the OS reads from. Every figure above is reported by the source itself: '+
      'record counts and sync times are real, and where a source exposes no count (identity sign-in) the field is left blank rather than filled. '+
      'Sage Intacct is <b>not connected</b>, so financial truth (true AR, revenue, margin, office-level financials) is shown as unavailable and is never estimated in its place. '+
      'Connecting Intacct opens the setup here in the shell; nothing changes until it is configured.';
  }).catch(function(){document.getElementById('grid').innerHTML=OS.errorBox('Could not load integration health.');});
}

// Change a connector's auto-sync cadence. 0 = paused (enabled:false); any other value sets the
// interval and re-enables it.
document.addEventListener('change',function(e){
  var sel=e.target.closest('[data-sched]'); if(!sel) return;
  var key=sel.getAttribute('data-sched'); var v=Number(sel.value);
  var body=v>0?{enabled:true,interval_minutes:v}:{enabled:false};
  sel.disabled=true;
  fetch('/api/sync-schedules/'+key,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(d){
      sel.disabled=false;
      if(!d||!d.ok){ OS.toast('Could not update the sync schedule.','bad'); return; }
      SCH[key]=d.schedule;
      OS.toast((by(key)||key)+' auto-sync set to '+cadenceLabel(d.schedule).toLowerCase()+'.');
    }).catch(function(){ sel.disabled=false; OS.toast('Could not reach the schedule service.','bad'); });
});
function by(key){ return {servicetrade:'ServiceTrade',bamboo:'BambooHR',microsoft:'Microsoft 365',google_business:'Google Business'}[key]||key; }
document.addEventListener('click',function(e){
  if(e.target.closest('#ic-connect')){ try{parent.postMessage({type:'open-intacct'},'*');}catch(_){} return; }
  if(e.target.closest('[data-google-disc]')){
    if(!confirm('Disconnect Google Business Profile? Existing reviews stay; auto-sync and replies stop until you reconnect.')) return;
    var db=e.target.closest('[data-google-disc]'); db.disabled=true;
    fetch('/api/google/disconnect',{method:'POST'}).then(function(r){return r.json();}).then(function(){ OS.toast('Google Business disconnected.'); load(); })
      .catch(function(){ db.disabled=false; OS.toast('Could not disconnect.','bad'); });
    return;
  }
  var ms=e.target.closest('[data-mail-save]');
  if(ms){ var mkey=ms.getAttribute('data-mail-save');
    var input=document.querySelector('[data-mail-key="'+mkey+'"]'); var addr=input?input.value.trim():'';
    ms.disabled=true; var mt=ms.textContent; ms.textContent='Saving…';
    fetch('/api/mail/senders/'+encodeURIComponent(mkey),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({address:addr})})
      .then(function(r){return r.json();}).then(function(d){ ms.disabled=false; ms.textContent=mt;
        if(d&&d.ok){ OS.toast('Sender updated'+(addr?(' → '+addr):' (using the default mailbox)')+'.'); }
        else { OS.toast('Could not save that sender.','bad'); }
      }).catch(function(){ ms.disabled=false; ms.textContent=mt; OS.toast('Could not save.','bad'); });
    return;
  }
  var b=e.target.closest('[data-syncnow]'); if(!b) return;
  var key=b.getAttribute('data-syncnow'); b.disabled=true; var was=b.textContent; b.textContent='Syncing…';
  fetch('/api/sync-schedules/'+key+'/run',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    b.disabled=false; b.textContent=was;
    if(!d){ OS.toast('Could not sync.','bad'); return; }
    OS.toast((by(key))+': '+(d.detail||(d.ok?'synced':'sync failed')), d.ok?undefined:'bad');
    load();
  }).catch(function(){ b.disabled=false; b.textContent=was; OS.toast('Could not reach the sync service.','bad'); });
});
OS.ready(load); OS.onChange(load);
</script></body></html>
