<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounts · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<style>
  .search{width:100%;max-width:420px;font-family:var(--sans);font-weight:600;font-size:13.5px;border:1px solid var(--border);border-radius:10px;padding:10px 13px;background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div><h1>Accounts</h1><div class="os-q">Every customer, live from ServiceTrade.</div></div>
    </div>
    <input class="search" id="q" type="search" placeholder="Search customers…" />
    <div id="list" style="margin-top:14px"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var t=null;
function load(){
  var q=document.getElementById('q').value.trim();
  fetch('/api/accounts?pageSize=100'+(q?('&q='+encodeURIComponent(q)):'')).then(function(r){return r.json();}).then(function(d){
    var accts=d.accounts||[];
    if(!accts.length){document.getElementById('list').innerHTML=OS.empty(d.live===false?'Connect ServiceTrade to see live customers.':'No customers match.','');return;}
    var cols=[
      {as:'name',label:'Customer',strong:true},
      {as:'segment',label:'Segment',render:function(v){return OS.esc((v||'').split(' · ')[0]||'');}},
      {as:'sites',label:'Sites',kind:'num'},
      {as:'next',label:'Next action',render:function(v){return OS.esc(v||'');}},
      {as:'risk',label:'',render:function(v){return v==='at_risk'?OS.pill('at risk','bad'):'';}},
      {as:'go',label:'',render:function(v,r){return '<button class="os-fb" data-acct="'+r.id+'">Open</button>';}}
    ];
    document.getElementById('list').innerHTML=OS.table(cols, accts.map(function(a){return {name:a.name,segment:a.segment,sites:a.sites,next:a.next,risk:a.risk,id:a.id};}),{});
  }).catch(function(){document.getElementById('list').innerHTML=OS.errorBox('Could not load accounts.');});
}
document.getElementById('q').addEventListener('input',function(){clearTimeout(t);t=setTimeout(load,250);});
document.addEventListener('click',function(e){var b=e.target.closest('[data-acct]');if(b){OS.go('account',{param:'id='+b.getAttribute('data-acct')});}});
OS.ready(load);
</script>
</body>
</html>
