<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>1st Fire Protection · Operating System</title>
<link rel="icon" type="image/png" href="/brand/logo.png" />
<link rel="apple-touch-icon" href="/brand/logo.png" />
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  /* ---- Signal shell chrome. Most classes (.side/.nav-item/.group/.head/.seg/
     .avatar/.scrim/.palette) come from signal.css; this block adds only what the
     shell itself needs: the collapse + mobile-drawer behaviour, the iframe frames,
     the search field, the theme toggle, and the palette input/results. ---- */
  html,body{height:100%;overflow:hidden}
  .app{height:100vh;overflow:hidden}

  /* sidebar: collapsible on desktop */
  .side{position:relative;z-index:20;transition:margin-left .34s cubic-bezier(.4,0,.2,1),opacity .3s}
  .app.collapsed .side{margin-left:calc(-1 * var(--sidebar));opacity:0}
  .side .brand .grip{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
    background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .side .brand .grip:hover{border-color:var(--border-strong);color:var(--ink-2);background:var(--fill)}

  /* the search "field" button that opens the palette */
  .searchbtn{width:100%;display:flex;align-items:center;gap:8px;background:var(--fill);border:none;
    border-radius:var(--r-btn);padding:8px 11px;text-align:left;cursor:pointer;font-family:var(--sans)}
  .searchbtn .mag{color:var(--muted);display:flex}
  .searchbtn .lbl{flex:1;font-weight:500;font-size:12.5px;color:var(--muted)}

  /* nav variants layered on signal.css .nav-item */
  .nav-item{cursor:pointer}
  .nav-item .grow{flex:1;text-align:left}
  .nav-item .avstack{display:flex}
  .nav-item .avstack i{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);display:block}
  .nav-item .avstack i+i{margin-left:-7px}

  /* main column + iframe frames (persistent, one per screen) */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .frames{flex:1;position:relative;min-width:0;background:var(--bg)}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .2s;background:var(--bg)}
  .frame.on{opacity:1;pointer-events:auto}

  /* header extras */
  .head .range{font-weight:600;font-size:11.5px;color:var(--ink-2);border:1px solid var(--border);
    border-radius:var(--r-btn);padding:7px 12px;background:none;cursor:pointer}
  .head .range:hover{border-color:var(--border-strong)}
  .theme-tog{width:32px;height:32px;border-radius:var(--r-btn);border:1px solid var(--border);background:none;
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .theme-tog:hover{border-color:var(--border-strong);color:var(--ink-2)}
  .theme-tog svg{width:16px;height:16px}

  /* palette: input + result rows (on top of signal.css .scrim/.palette) */
  .palette .q input{flex:1;background:none;border:none;padding:0;font-family:var(--sans);font-weight:500;
    font-size:15px;color:var(--ink)}
  .palette .q input:focus{outline:none;box-shadow:none}
  .palette .body{padding:8px 8px 10px;max-height:56vh;overflow-y:auto}
  .palette .res{cursor:pointer}
  .palette .res .mg{width:22px;height:22px;border-radius:7px;font-weight:800;font-size:9px;display:flex;
    align-items:center;justify-content:center;flex:none}
  .palette .res .rl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .palette .res .rr{font-weight:700;font-size:11.5px;flex:none}
  .palette .res .rk{font-family:var(--mono);font-weight:600;font-size:9.5px;color:var(--faint);flex:none}
  .palette .res .ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
  .palette .res .ic svg{width:12px;height:12px}
  .palette .empty-q{padding:26px 18px;text-align:center;font-weight:500;font-size:12.5px;color:var(--muted)}

  /* mobile "reopen" button + backdrop */
  .reopen{position:fixed;top:14px;left:14px;z-index:60;display:none;align-items:center;gap:9px;
    padding:9px 14px 9px 10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-btn);
    box-shadow:var(--sh-rest);cursor:pointer;color:var(--ink-2)}
  .app.collapsed .reopen{display:flex}   /* show the Menu button whenever collapsed (desktop + mobile) */
  /* on desktop, clear the header title from under the floating Menu button when collapsed */
  @media (min-width:901px){ .app.collapsed .head{padding-left:118px} }
  .reopen .rl{font-weight:700;font-size:12px;color:var(--ink)}
  .backdrop{position:fixed;inset:0;z-index:15;background:rgba(21,26,45,.4);opacity:0;pointer-events:none;
    transition:opacity .3s;display:none}

  @media (max-width:900px){
    /* sidebar becomes an overlay drawer; the content no longer shifts */
    .side{position:fixed;top:0;left:0;bottom:0;height:100dvh;width:min(84vw,290px);margin-left:0;opacity:1;
      transform:translateX(0);transition:transform .34s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lift)}
    .app.collapsed .side{margin-left:0;opacity:1;transform:translateX(-102%)}
    /* iOS/Android won't scroll a fixed iframe's overflow, so flow the layout: the
       outer document scrolls and each iframe is sized to its content by JS. */
    html,body{height:auto;overflow:visible}
    .app{display:block;height:auto;min-height:100dvh}
    .main{min-height:100dvh}
    .frames{position:relative}
    .frame{position:relative;inset:auto;width:100%;height:auto;opacity:1;pointer-events:auto;transition:none;display:none}
    .frame.on{display:block}
    .backdrop{display:block}
    .app:not(.collapsed) .backdrop{opacity:1;pointer-events:auto}
    .app.collapsed .reopen{display:flex}
    .reopen{top:max(12px,env(safe-area-inset-top))}
    .head{padding-left:64px}       /* clear the floating Menu button */
    .head .range{display:none}
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side">
      <div class="brand">
        <span class="mark">1F</span>
        <span style="flex:1;min-width:0">
          <span class="n">1st Fire</span>
          <span class="s">San Antonio · 9 locations</span>
        </span>
        <button class="grip" id="collapse" title="Collapse (Ctrl/⌘ + \)" aria-label="Collapse sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <div style="padding:0 12px 10px">
        <button class="searchbtn" id="open-palette" aria-label="Search (⌘K)">
          <span class="mag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg></span>
          <span class="lbl">Search</span>
          <span class="key">⌘K</span>
        </button>
      </div>

      <nav id="nav">
        <button class="nav-item" data-key="home">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg></span>
          <span class="grow">Home</span>
        </button>
        <button class="nav-item" data-key="approve">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H4z"/><path d="M8 20h8"/></svg></span>
          <span class="grow">To approve</span>
          <span class="badge" id="c-approve" style="display:none">0</span>
        </button>
        <button class="nav-item" data-key="operator">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M12 8v4l3 2"/></svg></span>
          <span class="grow">Ask the Operator</span>
        </button>

        <div class="group">Workstreams</div>
        <button class="nav-item" data-key="phones">
          <span class="sq" style="background:var(--green)"></span>
          <span class="grow">Phones</span>
          <span class="count" id="c-phones"></span>
        </button>
        <button class="nav-item" data-key="money">
          <span class="sq" style="background:var(--money)"></span>
          <span class="grow">Getting paid</span>
          <span class="count" id="c-money"></span>
        </button>
        <button class="nav-item" data-key="reviews">
          <span class="sq" style="background:var(--amber)"></span>
          <span class="grow">Reputation</span>
          <span class="count" id="c-reviews"></span>
        </button>
        <button class="nav-item" data-key="spend">
          <span class="sq" style="background:var(--indigo)"></span>
          <span class="grow">Wasted spend</span>
          <span class="count" id="c-spend"></span>
        </button>

        <div class="group">Customers</div>
        <button class="nav-item" data-key="crm">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20v-1.5A4.5 4.5 0 0 1 8.5 14h3A4.5 4.5 0 0 1 16 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M17 11.5a3 3 0 1 0 0-6"/><path d="M18.5 20v-1.2a3.6 3.6 0 0 0-1.8-3.1"/></svg></span>
          <span class="grow">Accounts</span>
          <span class="count" id="c-accounts"></span>
        </button>
        <button class="nav-item" data-key="pipeline">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="5" height="14" rx="1.5"/><rect x="10" y="5" width="5" height="9" rx="1.5"/><rect x="17" y="5" width="4" height="5" rx="1.5"/></svg></span>
          <span class="grow">Pipeline</span>
          <span class="count" id="c-pipeline"></span>
        </button>
        <button class="nav-item" data-key="sync">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9a8 8 0 0 1 13.3-3.3L20 8"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-13.3 3.3L4 16"/><path d="M4 20v-4h4"/></svg></span>
          <span class="grow">ServiceTrade sync</span>
          <span class="dot live"></span>
        </button>

        <div class="group">Your team</div>
        <button class="nav-item" data-key="team">
          <span class="grow">9 agents</span>
          <span class="avstack"><i style="background:var(--indigo)"></i><i style="background:var(--green)"></i><i style="background:var(--amber)"></i></span>
        </button>
        <button class="nav-item" data-key="hire">
          <span class="grow" style="color:var(--indigo-deep);font-weight:700">+ Hire a new agent</span>
        </button>
      </nav>

      <div class="promo">
        <b>Connect ServiceTrade</b>
        <p>Pull real invoices and jobs instead of samples. Takes 2 minutes.</p>
        <span class="btn-accent btn-sm" style="display:inline-block;margin-top:10px">Connect</span>
      </div>
      <div class="me">
        <span class="avatar" style="width:26px;height:26px;font-size:10px">DB</span>
        <span style="flex:1;font-weight:600;font-size:12px;color:var(--ink)">Devon Booker</span>
        <span style="font-weight:500;font-size:10.5px;color:var(--muted)">Owner</span>
      </div>
    </aside>

    <div class="reopen" id="reopen">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="rl">Menu</span>
    </div>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="head">
        <h1 id="screen-title">Ask the Operator</h1>
        <span class="sub" id="screen-sub">One conversation over the whole company</span>
        <span class="spacer"></span>
        <span class="seg" id="view-seg">
          <button data-view="owner" class="on">Owner</button>
          <button data-view="office">Office</button>
        </span>
        <button class="range">This week</button>
        <button class="theme-tog" id="theme-tog" aria-label="Toggle light and dark theme">
          <span class="ti-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          <span class="ti-sun" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.4M12 20.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.5 12h2.4M20.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></span>
        </button>
        <span class="avatar">DB</span>
      </header>

      <div class="frames" id="frames"></div>
    </div>
  </div>

<script>
"use strict";
/* ---- Signal shell ----
   One iframe per screen (persistent, same-origin so postMessage nav + audio work).
   The sidebar, header title/subtitle and ⌘K palette all drive activate(). Screens
   not yet built (Home, To approve, and the CRM screens) open a graceful /soon
   placeholder until their phase lands. */
var SCREENS = {
  home:     { src:'/home',                         title:'Home',              sub:'Everything in one place', home:true },
  approve:  { src:'/approvals',                    title:'To approve',        sub:'Nothing leaves the building without you' },
  operator: { src:'/operator',                    title:'Ask the Operator',  sub:'One conversation over the whole company' },
  phones:   { src:'/calls',                        title:'Phones',            sub:'210-377-FIRE · answered 24/7' },
  money:    { src:'/invoices',                     title:'Getting paid',      sub:'Chases every receivable, drafts the reminder, waits for your yes' },
  reviews:  { src:'/reviews',                      title:'Reputation',        sub:'Turns finished jobs into reviews, drafts every reply' },
  spend:    { src:'/licenses',                     title:'Wasted spend',      sub:'Finds the seats you pay for but nobody uses' },
  crm:      { src:'/accounts',                     title:'Accounts',          sub:'412 customers, live from ServiceTrade' },
  account:  { src:'/account',                      title:'Account',           sub:'Customer detail', detail:true },
  pipeline: { src:'/pipeline',                     title:'Pipeline',          sub:'$412,300 open across 39 quotes' },
  sync:     { src:'/sync',                          title:'ServiceTrade sync', sub:'Two-way, every 15 minutes' },
  team:     { src:'/roster',                       title:'Your team',         sub:'9 agents, one job each' },
  hire:     { src:'/harness',                      title:'Hire a new agent',  sub:'Describe the gap in your own words' }
};
var KEYS = Object.keys(SCREENS);
var HOME = KEYS.filter(function(k){return SCREENS[k].home;})[0] || KEYS[0];
var NAV_MESSAGE_TYPE = 'app-navigate';

var app=document.getElementById('app'), nav=document.getElementById('nav'), frames=document.getElementById('frames'),
    backdrop=document.getElementById('backdrop'), reopen=document.getElementById('reopen'),
    titleEl=document.getElementById('screen-title'), subEl=document.getElementById('screen-sub');
var mq=window.matchMedia('(max-width:900px)');
function isMobile(){return mq.matches;}
var current=HOME;

/* build one iframe per screen; only the home frame gets its src eagerly */
frames.innerHTML=KEYS.map(function(k){
  var src=k===HOME?(' src="'+SCREENS[k].src+'"'):'';
  return '<iframe class="frame'+(k===HOME?' on':'')+'" id="frame-'+k+'" data-src="'+SCREENS[k].src+'"'+src+' allow="microphone; autoplay; camera"></iframe>';
}).join('');
function frameEl(k){return document.getElementById('frame-'+k);}

/* ---- mobile: size each iframe to its content so the outer document scrolls ---- */
function fitFrame(f){
  if(!f)return;
  if(!isMobile()){f.style.height='';return;}
  try{var doc=f.contentWindow&&f.contentWindow.document;if(!doc||!doc.body)return;
    var h=Math.max(doc.documentElement.scrollHeight||0,doc.body.scrollHeight||0);
    if(h>0)f.style.height=h+'px';}catch(_){}
}
function watchFrame(f){
  try{var win=f.contentWindow,doc=win.document,refit=function(){fitFrame(f);};
    if(typeof win.ResizeObserver!=='undefined'){new win.ResizeObserver(refit).observe(doc.body);}
    win.addEventListener('resize',refit);
    var n=0,iv=setInterval(function(){refit();if(++n>24)clearInterval(iv);},250);
  }catch(_){}
  fitFrame(f);
  // re-broadcast the current theme into every freshly loaded frame
  try{f.contentWindow.postMessage({type:'fp-theme',theme:curTheme()},'*');}catch(_){}
}
KEYS.forEach(function(k){var f=frameEl(k);f.addEventListener('load',function(){watchFrame(f);});});

/* ---- navigation ---- */
function activate(key,announce){
  if(!SCREENS[key])return;
  var f=frameEl(key); if(f&&!f.src)f.src=f.getAttribute('data-src');
  KEYS.forEach(function(k){
    frameEl(k).classList.toggle('on',k===key);
    var ni=nav.querySelector('.nav-item[data-key="'+k+'"]');
    if(ni)ni.classList.toggle('on',k===key);
  });
  current=key;
  titleEl.textContent=SCREENS[key].title;
  subEl.textContent=SCREENS[key].sub;
  try{document.title='1st FP · '+SCREENS[key].title;}catch(_){}
  if(isMobile()){setCollapsed(true);fitFrame(f);window.scrollTo(0,0);}
}
nav.addEventListener('click',function(e){var it=e.target.closest('.nav-item');if(it)activate(it.getAttribute('data-key'),true);});

/* ---- collapse / mobile drawer ---- */
function setCollapsed(v){app.classList.toggle('collapsed',v);if(!isMobile()){try{localStorage.setItem('shell_collapsed',v?'1':'0');}catch(_){}}}
document.getElementById('collapse').onclick=function(){setCollapsed(true);};
reopen.onclick=function(){setCollapsed(false);};
backdrop.addEventListener('click',function(){setCollapsed(true);});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='\\'){e.preventDefault();setCollapsed(!app.classList.contains('collapsed'));}});
if(isMobile()){app.classList.add('collapsed');}
else{try{if(localStorage.getItem('shell_collapsed')==='1')app.classList.add('collapsed');}catch(_){}}
function syncHeights(){if(isMobile()){fitFrame(frameEl(current));}else{KEYS.forEach(function(k){frameEl(k).style.height='';});}}
(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){
  if(isMobile())setCollapsed(true);
  else{try{setCollapsed(localStorage.getItem('shell_collapsed')==='1');}catch(_){setCollapsed(false);}}
  syncHeights();
});
window.addEventListener('resize',syncHeights);
window.addEventListener('orientationchange',function(){setTimeout(syncHeights,250);});

/* ---- cross-frame nav + roster refresh ---- */
window.addEventListener('message',function(e){var d=e.data||{};
  if(d.type===NAV_MESSAGE_TYPE&&d.tab){
    var nk=String(d.tab).toLowerCase();
    // optional param reloads that screen's frame with a query (e.g. account?id=5)
    if(d.param&&SCREENS[nk]){var nf=frameEl(nk);if(nf){nf.src=SCREENS[nk].src+(SCREENS[nk].src.indexOf('?')>=0?'&':'?')+d.param;}}
    activate(nk,true);
  }
  if(d.type==='counts-changed'){refreshCounts();}
  if(d.type==='roster-changed'){location.replace(location.pathname+'?tab='+encodeURIComponent(current));}
});

/* ---- owner / office view switch (UI only for now) ---- */
document.getElementById('view-seg').addEventListener('click',function(e){
  var b=e.target.closest('button[data-view]');if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
  try{localStorage.setItem('fpView',b.getAttribute('data-view'));}catch(_){}
});
try{var sv=localStorage.getItem('fpView');if(sv==='office'){document.querySelectorAll('#view-seg button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-view')==='office');});}}catch(_){}

/* ---- sidebar counts / badges ---- */
function refreshCounts(){
  fetch('/api/nav-counts').then(function(r){return r.json();}).then(function(c){
    function set(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}
    set('c-phones',c.phones||0); set('c-money',c.money||0); set('c-reviews',c.reviews||0);
    set('c-spend',c.spend||0); set('c-accounts',c.accounts||''); set('c-pipeline',c.pipeline||'');
    var badge=document.getElementById('c-approve');
    if(badge){if(c.approvals>0){badge.textContent=c.approvals;badge.style.display='';}else{badge.style.display='none';}}
  }).catch(function(){});
}
refreshCounts();

/* ---- deep link + public API ---- */
var q=new URLSearchParams(location.search).get('tab');
if(q&&SCREENS[q]&&q!==HOME){activate(q);}else{activate(HOME);}
window.AppShell={open:function(k){activate(k,true);},collapse:setCollapsed,screens:SCREENS};

/* ---- theme toggle (broadcast to every frame so the whole app flips) ---- */
var tog=document.getElementById('theme-tog');
function curTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
function paintTog(t){
  tog.querySelector('.ti-moon').style.display=t==='dark'?'none':'';
  tog.querySelector('.ti-sun').style.display=t==='dark'?'':'none';
}
function setTheme(t){
  try{localStorage.setItem('fpTheme',t);}catch(_){}
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');
  paintTog(t);
  document.querySelectorAll('.frames iframe').forEach(function(f){try{f.contentWindow.postMessage({type:'fp-theme',theme:t},'*');}catch(_){}});
}
paintTog(curTheme());
tog.addEventListener('click',function(){setTheme(curTheme()==='dark'?'light':'dark');});

/* ---- ⌘K command palette ---- */
var paletteOpen=false, palResults=[], palIndex=0, palEl=null;
function openPalette(){
  if(paletteOpen)return; paletteOpen=true;
  palEl=document.createElement('div'); palEl.className='scrim';
  palEl.innerHTML=
    '<div class="palette" role="dialog" aria-label="Command palette">'+
      '<div class="q">'+
        '<span style="color:var(--muted);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg></span>'+
        '<input id="pal-input" autocomplete="off" spellcheck="false" placeholder="Search customers, or type a command…" />'+
        '<span class="key">ESC</span>'+
      '</div>'+
      '<div class="body" id="pal-body"></div>'+
    '</div>';
  document.body.appendChild(palEl);
  palEl.addEventListener('mousedown',function(e){if(e.target===palEl)closePalette();});
  var input=palEl.querySelector('#pal-input');
  input.addEventListener('input',function(){runSearch(input.value);});
  input.focus();
  runSearch('');
}
function closePalette(){if(!paletteOpen)return;paletteOpen=false;if(palEl){palEl.remove();palEl=null;}palResults=[];palIndex=0;}
var searchTimer=null;
function runSearch(q){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(renderPalette)
      .catch(function(){renderPalette({customers:[],actions:[]});});
  },110);
}
var ACT_ICON={
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>',
  brain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h3l2 5-2.2 1.1a11 11 0 0 0 5.1 5.1L15 13l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>'
};
var ACT_TINT={mail:['var(--money-bg)','var(--money)'],brain:['var(--indigo-bg-2)','var(--indigo)'],phone:['var(--green-bg)','var(--green)']};
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderPalette(d){
  if(!paletteOpen||!palEl)return;
  var body=palEl.querySelector('#pal-body'); palResults=[]; var html='';
  var cust=d.customers||[], acts=d.actions||[];
  if(cust.length){
    html+='<div class="grp">Customers</div>';
    cust.forEach(function(c){
      var idx=palResults.length; palResults.push({screen:c.screen});
      var meta=c.days>0?(money(c.amount)+' · '+c.days+' days'):money(c.amount);
      html+='<button class="res" data-i="'+idx+'"><span class="mg" style="background:var(--indigo-bg);color:var(--indigo)">'+esc(c.monogram)+'</span>'+
        '<span class="rl">'+esc(c.name)+'</span><span class="rr" style="color:var(--money)">'+esc(meta)+'</span></button>';
    });
  }
  if(acts.length){
    html+='<div class="grp">Do something</div>';
    acts.forEach(function(a){
      var idx=palResults.length; palResults.push({screen:a.screen});
      var tint=ACT_TINT[a.kind]||['var(--fill)','var(--muted)'];
      html+='<button class="res" data-i="'+idx+'"><span class="ic" style="background:'+tint[0]+';color:'+tint[1]+'">'+(ACT_ICON[a.kind]||'')+'</span>'+
        '<span class="rl" style="color:var(--ink-2)">'+esc(a.label)+'</span>'+(a.key?'<span class="rk">⌘'+esc(a.key)+'</span>':'')+'</button>';
    });
  }
  if(!palResults.length)html='<div class="empty-q">No matches. Try a customer name.</div>';
  body.innerHTML=html;
  palIndex=0; paintPalIndex();
  body.querySelectorAll('.res').forEach(function(btn){
    btn.addEventListener('mouseenter',function(){palIndex=+btn.getAttribute('data-i');paintPalIndex();});
    btn.addEventListener('click',function(){choosePal(+btn.getAttribute('data-i'));});
  });
}
function paintPalIndex(){if(!palEl)return;palEl.querySelectorAll('.res').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-i')===palIndex);});}
function choosePal(i){var r=palResults[i];if(!r)return;closePalette();if(r.screen)activate(r.screen,true);}
document.getElementById('open-palette').addEventListener('click',openPalette);
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();paletteOpen?closePalette():openPalette();return;}
  if(!paletteOpen)return;
  if(e.key==='Escape'){e.preventDefault();closePalette();}
  else if(e.key==='ArrowDown'){e.preventDefault();palIndex=Math.min(palResults.length-1,palIndex+1);paintPalIndex();}
  else if(e.key==='ArrowUp'){e.preventDefault();palIndex=Math.max(0,palIndex-1);paintPalIndex();}
  else if(e.key==='Enter'){e.preventDefault();choosePal(palIndex);}
});
</script>
</body>
</html>
