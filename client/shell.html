<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>1st Fire Protection</title>
<link rel="icon" type="image/png" href="/brand/logo-240.png" />
<link rel="apple-touch-icon" href="/brand/logo-240.png" />
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<link rel="stylesheet" href="/brand/site-theme.css" />
<link rel="stylesheet" href="/brand/site-motion.css" />
<script src="/brand/site-motion.js" defer></script>
<style>
  /* App frame, modeled on 1stfpservices.com and the 1st FP Platform demo: a 56px blurred top bar
     (logo, module switcher, location, search, account), a 224px sidebar for the active module, and
     one persistent iframe per screen. */
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  .top{position:sticky;top:0;z-index:60;height:56px;border-bottom:1px solid rgba(0,0,0,.07);
    background:rgba(251,251,253,.82);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
  :root[data-theme="dark"] .top{background:rgba(28,28,30,.82);border-bottom-color:rgba(255,255,255,.08)}
  .top-in{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:0 18px}
  .brandlink{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
  .brandlink img{width:32px;height:32px;object-fit:contain;flex:none}
  .brandlink span{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rgt{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:980px;border:1px solid var(--border-strong);
    background:var(--panel);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .25s var(--ease)}
  .pillbtn:hover{border-color:var(--ink)}
  .pillbtn .k{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  select.loc{height:34px;max-width:180px;padding:0 30px 0 12px;border-radius:980px;border:1px solid var(--border-strong);background-color:var(--panel);
    font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
  .avatarbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:11px;letter-spacing:.02em;cursor:pointer;flex:none}
  :root[data-theme="dark"] .avatarbtn{background:var(--fill);color:var(--ink)}
  .menubtn{display:none}

  /* module switcher */
  .popwrap{position:relative}
  .modbtn{display:flex;align-items:center;gap:9px;white-space:nowrap;border-radius:980px;border:1px solid var(--border-strong);background:var(--panel);
    padding:5px 14px 5px 6px;cursor:pointer;color:var(--ink);font-family:var(--sans);transition:border-color .25s var(--ease)}
  .modbtn:hover{border-color:var(--ink)}
  .tile{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:11px}
  .modbtn b{font-weight:600;font-size:14px}
  .modbtn .tri{font-size:10px;color:var(--faint)}
  .pop{position:absolute;top:calc(100% + 8px);z-index:70;background:var(--panel);border-radius:18px;padding:8px;box-shadow:var(--sh-float);
    animation:popIn .22s var(--ease)}
  .pop[hidden]{display:none}
  .pop.center{left:50%;transform:translateX(-50%);width:340px;animation:popC .22s var(--ease)}
  @keyframes popC{from{opacity:0;transform:translate(-50%,-6px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
  .pop.right{right:0;width:280px}
  .pop-h{padding:8px 10px 6px;font-weight:800;font-size:10px;letter-spacing:.08em;color:var(--faint)}
  .modrow{display:grid;grid-template-columns:32px minmax(0,1fr) 16px;align-items:center;gap:12px;width:100%;border:0;border-radius:12px;padding:10px;
    background:var(--panel);text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans)}
  .modrow:hover{background:var(--bg)}
  .modrow.on{background:var(--brand-wash)}
  :root[data-theme="dark"] .modrow.on{background:rgba(224,51,47,.12)}
  .modrow .mt{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:13px}
  :root[data-theme="dark"] .modrow .mt{background:#3a3a3c}
  .modrow.on .mt{background:var(--brand)}
  .modrow b{display:block;font-size:14px}
  .modrow small{font-size:12px;color:var(--faint)}
  .modrow .ck{font-weight:800;color:var(--brand)}
  .me-card{padding:10px 12px 12px;border-bottom:1px solid var(--divider);margin-bottom:6px}
  .me-card b{display:block;font-size:14px}
  .me-card span{display:block;font-size:12px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
  .mrow{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;
    font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
  .mrow:hover{background:var(--bg)}
  .mrow.danger{color:var(--brand)}

  /* body: sidebar + frames */
  .body{display:flex;height:calc(100vh - 56px)}
  .side{flex:0 0 var(--sidebar);width:var(--sidebar);display:flex;flex-direction:column;gap:2px;overflow-y:auto;
    background:var(--panel-alt);border-right:1px solid var(--border);padding:18px 12px}
  .side-h{padding:0 10px 10px;font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .nv{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:10px;padding:9px 10px;
    background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:14px;font-weight:400;text-align:left;cursor:pointer;transition:background .2s}
  .nv:hover{background:rgba(0,0,0,.05)}
  :root[data-theme="dark"] .nv:hover{background:rgba(255,255,255,.06)}
  .nv.on{background:rgba(0,0,0,.06);color:var(--ink);font-weight:600}
  :root[data-theme="dark"] .nv.on{background:rgba(255,255,255,.08)}
  .nv::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:transparent}
  .nv.on::before{background:var(--brand)}
  .nv .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nv .c{font-size:11px;font-weight:600;color:var(--faint)}
  .conn{margin-top:auto;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.06);padding:12px}
  :root[data-theme="dark"] .conn{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
  .conn-h{font-weight:800;font-size:10px;letter-spacing:.08em;color:var(--faint)}
  .conn-l{display:grid;gap:6px;margin-top:8px;font-size:12px;color:var(--ink)}
  .conn-r{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;font-family:var(--sans);font-size:12px;color:var(--ink);cursor:pointer;text-align:left}
  .conn-r .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--border-strong)}
  .conn-r .d.fresh{background:var(--live);box-shadow:0 0 0 3px rgba(48,209,88,.18)}
  .conn-r .d.stale,.conn-r .d.no_sync{background:#ff9f0a;box-shadow:0 0 0 3px rgba(255,159,10,.18)}
  .conn-r .a{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .main{flex:1;min-width:0;position:relative}
  .frames,.frames iframe{width:100%;height:100%}
  .frames iframe{border:0;display:none;background:var(--bg)}
  .frames iframe.on{display:block}

  /* command palette (search pages) */
  .scrim{position:fixed;inset:0;background:rgba(29,29,31,.32);display:flex;align-items:flex-start;justify-content:center;padding-top:110px;z-index:90}
  .palette{width:min(560px,calc(100vw - 32px));background:var(--panel);border-radius:22px;box-shadow:var(--sh-modal);overflow:hidden}
  .palette .q{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--divider)}
  .palette .q input{flex:1;border:0;background:none;box-shadow:none;padding:4px 0;font-size:15px}
  .palette .body2{padding:8px;max-height:50vh;overflow:auto}
  .palette .res{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;border-radius:12px;padding:10px 12px;
    font-family:var(--sans);font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
  .palette .res small{font-size:12px;color:var(--faint)}
  .palette .res.on{background:var(--bg)}
  .palette .none{padding:18px;text-align:center;color:var(--muted);font-size:13px}

  #shell-toast-host{position:fixed;left:0;right:0;bottom:0;z-index:95;display:flex;justify-content:center;pointer-events:none;padding:0 16px 26px}

  /* narrow screens: the sidebar becomes a scrolling tab row under the bar (like the demo), and the
     page flows so iOS can scroll each iframe (sized to its content by JS). */
  @media (max-width:800px), (pointer:coarse){
    html,body{height:auto;overflow:visible}
    .body{flex-direction:column;height:auto}
    .side{flex:none;width:100%;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:56px;z-index:50}
    .side-h,.conn{display:none}
    .side nav{flex-direction:row;gap:4px}
    .nv{width:auto;flex:none;white-space:nowrap}
    .nv::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
    .frames,.frames iframe{height:auto;min-height:calc(100vh - 110px)}
  }
  @media (max-width:640px){
    .top-in{gap:8px;padding:0 12px}
    .brandlink span,.pillbtn .lbl,.pillbtn .k,select.loc{display:none}
    .modbtn b{font-size:13px}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <button class="brandlink" id="home-link" aria-label="1st Fire Protection home">
        <img src="/brand/logo-240.png" alt="" />
        <span>1st Fire Protection</span>
      </button>

      <div class="popwrap">
        <button class="modbtn" id="mod-btn" aria-haspopup="menu" aria-expanded="false">
          <span class="tile" id="mod-tile">P</span><b id="mod-label">People</b><span class="tri" aria-hidden="true">▼</span>
        </button>
        <div class="pop center" id="mod-pop" role="menu" aria-label="Switch module" hidden></div>
      </div>

      <div class="rgt">
        <select class="loc" id="loc" aria-label="Location" hidden></select>
        <button class="pillbtn" id="open-palette" aria-label="Search pages">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
          <span class="lbl">Search</span><span class="k">⌘K</span>
        </button>
        <div class="popwrap">
          <button class="avatarbtn" id="me-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Your account">··</button>
          <div class="pop right" id="me-pop" role="menu" aria-label="Your account" hidden>
            <div class="me-card"><b id="me-name">Signed in</b><span id="me-email"></span><span id="me-role"></span></div>
            <button class="mrow" id="theme-tog" role="menuitem"><span>Dark mode</span><span id="theme-state">Off</span></button>
            <button class="mrow danger" role="menuitem" onclick="signOut()">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="side" id="side">
      <div class="side-h" id="side-h">People</div>
      <nav id="nav" aria-label="Pages"></nav>
      <div class="conn" id="conn" hidden>
        <div class="conn-h">CONNECTED</div>
        <div class="conn-l" id="conn-l"></div>
      </div>
    </aside>
    <main class="main"><div class="frames" id="frames"></div></main>
  </div>

<script>
"use strict";
/* ---- what the OS does now: People (HR, onboarding, offboarding) and IT ---- */
var SCREENS = {
  people:      { src:'/people',      title:'Overview',          sub:'Who is joining, who is here, and who is leaving' },
  employees:   { src:'/people#employees', title:'Employees',      sub:'Everyone on the roster' },
  templates:   { src:'/people#templates', title:'Role templates', sub:'Job positions and their starting access' },
  onboarding:  { src:'/onboarding',  title:'Onboarding',        sub:'New hires: intake, approvals and Day-1 readiness' },
  offboarding: { src:'/offboarding', title:'Offboarding',       sub:'The departure checklist and account cleanup' },
  itSystems:   { src:'/it-systems',  title:'IT & Systems',      sub:'Access, licenses and system health' },
  devices:     { src:'/devices',     title:'Phones & iPads',    sub:'AT&T lines, devices, MDM and Teams voice' },
  devicesReport:{ src:'/devices-report', title:'Phones: executive report', sub:'Spend, savings and decisions for leadership' },
  adAudit:     { src:'/ad-audit',    title:'Active Directory',  sub:'On-prem AD: OU structure and account cleanup' },
  spAccess:    { src:'/sp-access',   title:'SharePoint access', sub:'Who has SharePoint access, and cleanup' },
  spend:       { src:'/licenses',    title:'License cleanup',   sub:'Seats you pay for that nobody uses' },
  settings:    { src:'/access',      title:'Access & Roles',    sub:'Who can see what in the OS' },
  integrations:{ src:'/company-integrations', title:'Integrations', sub:'Connected systems and sync health' },
  readiness:   { src:'/readiness',   title:'Readiness',         sub:'Identity, admin, backups and freshness' },
  myTasks:     { src:'/todo',        title:'My tasks',          sub:'Your own to-do list with a daily email' },
  reviewsHub:  { src:'/reviews-hub', title:'Overview',          sub:'Google reviews across every location' },
  reviews:     { src:'/reviews',     title:'Google reviews',    sub:'Read and reply to reviews' },
  reviewRequests:{ src:'/review-requests', title:'Review requests', sub:'Ask customers for a review after the job' }
};
var MODULES = [
  { k:'people', tile:'P', label:'People', desc:'Employees, onboarding and offboarding', items:['people','employees','onboarding','offboarding','templates'] },
  { k:'it',     tile:'I', label:'IT',     desc:'Accounts, access, licenses and systems', items:['itSystems','devices','devicesReport','myTasks','adAudit','spAccess','spend','settings','integrations','readiness'] },
  { k:'reviews', tile:'R', label:'Reviews', desc:'Google reviews and review requests', items:['reviewsHub','reviews','reviewRequests'] }
];
// The People-role module that governs each screen (mirrors server PAGE_MODULE); hidden when the role lacks it.
var SCREEN_MODULE = { people:'people', employees:'people', templates:'people', onboarding:'people', offboarding:'people',
  itSystems:'access', devices:'access', devicesReport:'access', adAudit:'access', spAccess:'access', spend:'access', settings:'access', integrations:'access', readiness:'access',
  reviewsHub:'service', reviews:'service', reviewRequests:'service' };
// Old links (?tab=home, ?tab=approve, ...) from before the OS was narrowed land on People.
var ALIASES = { 'reviews-hub':'reviewsHub', 'review-requests':'reviewRequests', home:'people', tasks:'people', approve:'onboarding', exceptions:'people', reportsPeople:'people', companyOffices:'people', sync:'integrations' };

var KEYS = Object.keys(SCREENS), HOME = 'people', current = null;
var GATE = false, ME_MODULES = {}, ME = null, WANTED = null;
// My tasks is personal: shown only to the people the server turns it on for (ME.personalTasks).
function allowedScreen(k){ if(k==='myTasks') return !!(ME && ME.personalTasks); if(!GATE) return true; var m=SCREEN_MODULE[k]; return !m || (ME_MODULES[m]||0) >= 1; }
function moduleOf(k){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].items.indexOf(k)>=0) return MODULES[i]; return MODULES[0]; }
function visibleModules(){ return MODULES.filter(function(m){ return m.items.some(allowedScreen); }); }
function firstAllowed(){ var ms=visibleModules(); for(var i=0;i<ms.length;i++){ var it=ms[i].items.filter(allowedScreen); if(it.length) return it[0]; } return null; }
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- one persistent iframe per screen (loaded on first visit) ---- */
var frames = document.getElementById('frames'), nav = document.getElementById('nav');
frames.innerHTML = KEYS.map(function(k){ return '<iframe id="frame-'+k+'" data-src="'+SCREENS[k].src+'" title="'+esc(SCREENS[k].title)+'"></iframe>'; }).join('');
function frameEl(k){ return document.getElementById('frame-'+k); }
function frameKeyFor(win){ for(var i=0;i<KEYS.length;i++){ var f=frameEl(KEYS[i]); if(f && f.contentWindow===win) return KEYS[i]; } return null; }
var subByScreen = {};

var mq = window.matchMedia('(max-width:800px), (pointer:coarse)');
function isMobile(){ return mq.matches; }
function fitFrame(f){
  if(!f) return;
  if(!isMobile()){ f.style.height=''; return; }
  try{ var d=f.contentWindow && f.contentWindow.document; if(!d||!d.body) return;
    var h=Math.max(d.documentElement.scrollHeight||0, d.body.scrollHeight||0); if(h>0) f.style.height=h+'px'; }catch(_){}
}
function watchFrame(f){
  try{ var w=f.contentWindow, refit=function(){ fitFrame(f); };
    if(typeof w.ResizeObserver!=='undefined') new w.ResizeObserver(refit).observe(w.document.body);
    var n=0, iv=setInterval(function(){ refit(); if(++n>24) clearInterval(iv); },250);
  }catch(_){}
  fitFrame(f);
  try{ f.contentWindow.postMessage({type:'fp-theme',theme:curTheme()},'*'); }catch(_){}
  try{ f.contentWindow.postMessage({type:'fp-office',office:curOffice()},'*'); }catch(_){}
}
KEYS.forEach(function(k){ var f=frameEl(k); f.addEventListener('load', function(){ watchFrame(f); }); });

/* ---- sidebar + module switcher ---- */
function renderNav(){
  var m = moduleOf(current||HOME);
  document.getElementById('side-h').textContent = m.label;
  nav.innerHTML = m.items.filter(allowedScreen).map(function(k){
    return '<button class="nv'+(k===current?' on':'')+'" data-key="'+k+'"'+(k===current?' aria-current="page"':'')+'><span class="t">'+esc(SCREENS[k].title)+'</span><span class="c" id="c-'+k+'"></span></button>';
  }).join('');
  document.getElementById('mod-tile').textContent = m.tile;
  document.getElementById('mod-label').textContent = m.label;
  document.getElementById('mod-pop').innerHTML = '<div class="pop-h">SWITCH MODULE</div>' + visibleModules().map(function(x){
    var on = x.k===m.k;
    return '<button class="modrow'+(on?' on':'')+'" role="menuitem" data-mod="'+x.k+'"><span class="mt">'+x.tile+'</span><span><b>'+esc(x.label)+'</b><small>'+esc(x.desc)+'</small></span><span class="ck">'+(on?'✓':'')+'</span></button>';
  }).join('');
  document.getElementById('loc').hidden = !(m.k==='people' && OFFICES.length>1);
  paintCounts();
}
nav.addEventListener('click', function(e){ var b=e.target.closest('[data-key]'); if(b) activate(b.getAttribute('data-key')); });
document.getElementById('mod-pop').addEventListener('click', function(e){
  var b=e.target.closest('[data-mod]'); if(!b) return; closePops();
  var m=MODULES.filter(function(x){ return x.k===b.getAttribute('data-mod'); })[0];
  var k=m && m.items.filter(allowedScreen)[0]; if(k) activate(k);
});
document.getElementById('home-link').addEventListener('click', function(){ var k=firstAllowed(); if(k) activate(k); });

function syncUrl(){
  try{ var qs = current===HOME && !subByScreen[current] ? '' : ('?tab='+encodeURIComponent(current)+(subByScreen[current]?'&sub='+encodeURIComponent(subByScreen[current]):''));
    history.replaceState(null,'',location.pathname+qs); }catch(_){}
}
function activate(key){
  key = ALIASES[key] || key;
  if(!SCREENS[key]) return;
  if(!allowedScreen(key)){ key=firstAllowed(); if(!key) return; }
  var f=frameEl(key);
  if(!f.src){ var ds=f.getAttribute('data-src'); if(subByScreen[key] && ds.indexOf('#')<0) ds+='#'+encodeURIComponent(subByScreen[key]); f.src=ds; }
  KEYS.forEach(function(k){ frameEl(k).classList.toggle('on', k===key); });
  current = key; renderNav(); syncUrl();
  try{ document.title = SCREENS[key].title+' · 1st Fire Protection'; }catch(_){}
  if(isMobile()){ fitFrame(f); window.scrollTo(0,0); }
}

/* ---- popovers ---- */
function closePops(){ document.querySelectorAll('.pop').forEach(function(p){ p.hidden=true; }); document.querySelectorAll('[aria-expanded="true"]').forEach(function(b){ b.setAttribute('aria-expanded','false'); }); }
function wirePop(btnId, popId){
  var b=document.getElementById(btnId), p=document.getElementById(popId);
  b.addEventListener('click', function(e){ e.stopPropagation(); var open=!p.hidden; closePops(); if(!open){ p.hidden=false; b.setAttribute('aria-expanded','true'); } });
}
wirePop('mod-btn','mod-pop'); wirePop('me-btn','me-pop');
document.addEventListener('click', function(e){ if(!e.target.closest('.popwrap')) closePops(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePops(); });

/* ---- location (office) filter: the People pages follow it ---- */
var OFFICES = [], CAN_ALL = true;
function curOffice(){ try{ return localStorage.getItem('fpos_office')||'all'; }catch(_){ return 'all'; } }
function setOffice(o){
  try{ localStorage.setItem('fpos_office',o); }catch(_){}
  try{ document.cookie='fpos_office='+encodeURIComponent(o)+';path=/;max-age=31536000;samesite=lax'; }catch(_){}
  document.querySelectorAll('.frames iframe').forEach(function(f){ try{ f.contentWindow.postMessage({type:'fp-office',office:o},'*'); }catch(_){} });
}
function renderLoc(){
  var sel=document.getElementById('loc'), cur=curOffice();
  sel.innerHTML = (CAN_ALL?'<option value="all">All locations</option>':'') + OFFICES.map(function(o){ return '<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>'; }).join('');
  var ok = (cur==='all'&&CAN_ALL) || OFFICES.some(function(o){ return o.value===cur; });
  var v = ok ? cur : (CAN_ALL?'all':(OFFICES[0]?OFFICES[0].value:'all'));
  sel.value = v; if(v!==cur) setOffice(v);
}
document.getElementById('loc').addEventListener('change', function(e){ setOffice(e.target.value); });

/* ---- who is signed in: name, menu, and which areas their role includes ---- */
function setMe(me){
  ME = me || {};
  var name=(ME.identity&&(ME.identity.name||ME.identity.email))||'Signed in';
  var roles=(ME.roles&&ME.roles.length)?ME.roles.map(function(r){ return r.replace(/_/g,' ').replace(/\b\w/g,function(c){ return c.toUpperCase(); }); }).join(' · '):(ME.legacy?'Office access':'');
  document.getElementById('me-name').textContent=name;
  document.getElementById('me-email').textContent=(ME.identity&&ME.identity.email&&ME.identity.email!==name)?ME.identity.email:'';
  document.getElementById('me-role').textContent=roles;
  var who=(ME.identity&&(ME.identity.name||ME.identity.email))||'';
  document.getElementById('me-btn').textContent=who?((who.replace(/@.*/,'').replace(/[^A-Za-z .]/g,'').split(/[\s.]+/).filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase())||'··'):'··';
  GATE = !!(ME.peopleAuthorized && ME.modules); ME_MODULES = ME.modules || {};
  // A deep link to My tasks (from the daily email) waits for /api/me before it can open.
  if(WANTED && WANTED!==current && allowedScreen(WANTED)){ activate(WANTED); }
  else if(current && !allowedScreen(current)){ var f=firstAllowed(); if(f) activate(f); } else renderNav();
  WANTED = null;
}
Promise.all([
  fetch('/api/me').then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch('/api/offices').then(function(r){ return r.json(); }).catch(function(){ return {offices:[]}; })
]).then(function(res){
  var me=res[0]||{}, all=(res[1]&&res[1].offices)||[];
  CAN_ALL = me.canSeeAllOffices!==false;
  var keys=(me.offices||[]).map(function(o){ return o.key; });
  OFFICES = CAN_ALL ? all : all.filter(function(o){ return keys.indexOf(o.key)>=0; });
  renderLoc(); setMe(me);
});

/* ---- connected systems ---- */
function ago(iso){ if(!iso) return ''; var m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  return m<60 ? m+'m' : m<1440 ? Math.round(m/60)+'h' : Math.round(m/1440)+'d'; }
var CONN_KEEP = { bamboo:1, entra:1, m365:1, microsoft:1, graph:1, servicetrade:1, intacct:1, ad:1, automate:1 };
fetch('/api/sources').then(function(r){ return r.json(); }).then(function(d){
  var s=((d&&d.sources)||[]).filter(function(x){ return x.connected || CONN_KEEP[x.key]; });
  if(!s.length) return;
  document.getElementById('conn-l').innerHTML = s.map(function(x){
    return '<button class="conn-r" data-go="integrations" title="'+esc(x.status.replace('_',' '))+'"><span class="d '+esc(x.status)+'"></span>'+esc(x.label)+'<span class="a">'+(x.connected?esc(ago(x.lastSyncedAt)||'on'):'off')+'</span></button>';
  }).join('');
  document.getElementById('conn').hidden=false;
}).catch(function(){});
document.getElementById('conn').addEventListener('click', function(e){ if(e.target.closest('[data-go]')) activate('integrations'); });

/* ---- sidebar counts ---- */
var COUNTS = {};
function paintCounts(){ Object.keys(COUNTS).forEach(function(k){ var el=document.getElementById('c-'+k); if(el) el.textContent=COUNTS[k]||''; }); }
function refreshCounts(){
  fetch('/api/people/overview').then(function(r){ return r.json(); }).then(function(o){
    if(!o || o.error) return;
    COUNTS.employees = o.active || ''; COUNTS.onboarding = o.onboarding || ''; COUNTS.offboarding = o.offboarding || ''; COUNTS.templates = o.templatesUnreviewed || '';
    paintCounts();
  }).catch(function(){});
}
refreshCounts();

/* ---- messages from the pages ---- */
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='app-navigate' && d.tab){
    var k=ALIASES[d.tab]||d.tab;
    if(d.param && SCREENS[k]){ var nf=frameEl(k); nf.src=SCREENS[k].src+(SCREENS[k].src.indexOf('?')>=0?'&':'?')+d.param; }
    activate(k);
  }
  if(d.type==='fp-subtab' && d.tab){ var sk=frameKeyFor(e.source); if(sk){ subByScreen[sk]=String(d.tab); if(sk===current) syncUrl(); } }
  if(d.type==='counts-changed') refreshCounts();
  if(d.type==='roster-changed') location.replace(location.pathname+'?tab='+encodeURIComponent(current));
  if(d.type==='set-office' && d.office){ setOffice(d.office); renderLoc(); }
  if(d.type==='fp-toast' && d.message) shellToast(d.message, d.tone);
});

/* ---- toast ---- */
var toastTimer=null;
function shellToast(msg, tone){
  var host=document.getElementById('shell-toast-host');
  if(!host){ host=document.createElement('div'); host.id='shell-toast-host'; document.body.appendChild(host); }
  host.innerHTML='<div class="os-toast'+(tone==='bad'?' bad':'')+'" role="status"><span class="tk">'+(tone==='bad'?'!':'✓')+'</span><span class="tm"></span></div>';
  host.querySelector('.tm').textContent=msg;
  requestAnimationFrame(function(){ var t=host.firstChild; if(t) t.classList.add('on'); });
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ var t=host.firstChild; if(t){ t.classList.remove('on'); setTimeout(function(){ host.innerHTML=''; },260); } },2800);
}

/* ---- theme ---- */
function curTheme(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
function paintTheme(){ document.getElementById('theme-state').textContent = curTheme()==='dark'?'On':'Off'; }
document.getElementById('theme-tog').addEventListener('click', function(){
  var t = curTheme()==='dark'?'light':'dark';
  try{ localStorage.setItem('fpTheme',t); }catch(_){}
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('.frames iframe').forEach(function(f){ try{ f.contentWindow.postMessage({type:'fp-theme',theme:t},'*'); }catch(_){} });
  paintTheme();
});
paintTheme();

window.signOut=function(){ fetch('/api/logout',{method:'POST'}).then(function(){ location.href='/login'; }).catch(function(){ location.href='/login'; }); };

/* ---- search pages (⌘K) ---- */
var pal=null, palRes=[], palIdx=0;
function openPalette(){
  if(pal) return;
  pal=document.createElement('div'); pal.className='scrim';
  pal.innerHTML='<div class="palette" role="dialog" aria-label="Search pages"><div class="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg><input id="pal-in" autocomplete="off" placeholder="Go to a page…" /></div><div class="body2" id="pal-body"></div></div>';
  document.body.appendChild(pal);
  pal.addEventListener('mousedown', function(e){ if(e.target===pal) closePalette(); });
  var inp=pal.querySelector('#pal-in'); inp.addEventListener('input', function(){ runPal(inp.value); }); inp.focus(); runPal('');
}
function closePalette(){ if(pal){ pal.remove(); pal=null; } }
function runPal(q){
  q=(q||'').trim().toLowerCase();
  palRes = KEYS.filter(allowedScreen).filter(function(k){ var s=SCREENS[k]; return !q || s.title.toLowerCase().indexOf(q)>=0 || s.sub.toLowerCase().indexOf(q)>=0 || moduleOf(k).label.toLowerCase().indexOf(q)>=0; });
  palIdx=0;
  pal.querySelector('#pal-body').innerHTML = palRes.length ? palRes.map(function(k,i){
    return '<button class="res'+(i===0?' on':'')+'" data-i="'+i+'"><span>'+esc(SCREENS[k].title)+'<br><small>'+esc(SCREENS[k].sub)+'</small></span><small>'+esc(moduleOf(k).label)+'</small></button>';
  }).join('') : '<div class="none">No page matches that.</div>';
  pal.querySelectorAll('.res').forEach(function(b){ b.addEventListener('click', function(){ var k=palRes[+b.getAttribute('data-i')]; closePalette(); activate(k); }); });
}
function paintPal(){ if(pal) pal.querySelectorAll('.res').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-i')===palIdx); }); }
document.getElementById('open-palette').addEventListener('click', openPalette);
document.addEventListener('keydown', function(e){
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); pal?closePalette():openPalette(); return; }
  if(!pal) return;
  if(e.key==='Escape'){ e.preventDefault(); closePalette(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(palRes.length-1,palIdx+1); paintPal(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); paintPal(); }
  else if(e.key==='Enter' && palRes[palIdx]){ e.preventDefault(); var k=palRes[palIdx]; closePalette(); activate(k); }
});

/* ---- layout changes + deep link ---- */
(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){ KEYS.forEach(function(k){ fitFrame(frameEl(k)); }); });
window.addEventListener('resize', function(){ if(isMobile()) fitFrame(frameEl(current)); });
var P=new URLSearchParams(location.search), qt=P.get('tab'), qs=P.get('sub');
qt = qt ? (ALIASES[qt]||qt) : null;
if(qt && SCREENS[qt]){ if(qs) subByScreen[qt]=qs; WANTED=qt; activate(qt); } else activate(HOME);
window.AppShell={ open:activate, screens:SCREENS };
</script>
