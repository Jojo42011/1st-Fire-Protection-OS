<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>1st Fire Protection · Operating System</title>
<link rel="stylesheet" href="/brand/brand.css" />
<style>
  /* THEME: the real 1st FP brand — red=the fire, navy=the uniform, off-white=the blueprint.
     Change these vars to re-skin the whole app. */
  :root {
    --bg:#F5F7F9; --panel:#FFFFFF; --navy:#1E2D40; --navy-2:#26384f; --navy-line:#34465d;
    --text:#1E2D40; --muted:#93A4C0; --sidebar-muted:#8A9AB0;
    --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.16);
    --accent:#E53935; --accent-2:#C62828; --gold:#F5B81B; --ok:#2E9E5B; --w:238px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  #shell{display:flex;height:100vh;width:100vw}
  #side{position:relative;flex:0 0 var(--w);width:var(--w);background:var(--navy);border-right:1px solid var(--navy-line);display:flex;flex-direction:column;z-index:20;transition:margin-left .34s cubic-bezier(.4,0,.2,1),opacity .3s}
  #shell.collapsed #side{margin-left:calc(-1 * var(--w));opacity:0}
  #side-head{display:flex;align-items:center;justify-content:space-between;padding:20px 14px 16px 18px;border-bottom:1px solid var(--navy-line)}
  #brand{display:flex;align-items:center;gap:11px}
  #brand .mark{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--navy));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:500;font-size:10px;color:#fff;letter-spacing:.02em}
  #brand .t{font-family:var(--font);font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1}
  #brand .t small{display:block;font-family:var(--mono);font-weight:500;font-size:8.5px;letter-spacing:.18em;color:var(--sidebar-muted);margin-top:3px}
  #collapse{width:30px;height:30px;border:1px solid var(--navy-line);background:transparent;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #collapse:hover{border-color:var(--accent);background:rgba(229,57,53,.12)}
  #nav{flex:1;overflow-y:auto;padding:10px 12px}
  #nav::-webkit-scrollbar{width:0}
  .nav-sep{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--sidebar-muted);padding:16px 10px 8px;display:flex;align-items:center;gap:9px}
  .nav-sep::before{content:"";width:16px;height:2px;background:var(--accent)}
  .nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:background .16s,border-color .16s,transform .1s}
  .nav-item:hover{background:rgba(255,255,255,.05);transform:translateX(2px)}
  .nav-item.active{background:rgba(229,57,53,.14);border-color:rgba(229,57,53,.4)}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--accent)}
  .nav-item .ic{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--navy-line);color:var(--accent)}
  .nav-item .ic svg{width:18px;height:18px}
  .nav-item .tx .l{font-size:14px;font-weight:700;color:#fff}
  .nav-item .tx .s{font-family:var(--mono);font-size:10px;color:var(--sidebar-muted);margin-top:2px;letter-spacing:.04em}
  #side-foot{padding:14px 18px;border-top:1px solid var(--navy-line);font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sidebar-muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,158,91,.18)}
  #reopen{position:fixed;top:16px;left:16px;z-index:60;display:none;align-items:center;gap:9px;padding:8px 14px 8px 8px;background:var(--navy);border:1px solid var(--navy-line);cursor:pointer}
  #shell.collapsed #reopen{display:flex}
  #reopen .mark{width:22px;height:22px;background:linear-gradient(135deg,var(--accent),var(--navy))}
  #reopen .rl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#fff;text-transform:uppercase}
  #main{flex:1;position:relative;min-width:0;background:var(--bg)}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .2s;background:var(--bg)}
  .frame.active{opacity:1;pointer-events:auto}
  #dock{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:12px;padding:9px 18px 9px 14px;background:var(--navy);border:1px solid var(--navy-line);cursor:pointer;box-shadow:0 8px 24px rgba(30,45,64,.22)}
  #dock.show{display:flex}
  #dock .p{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #dock .dt{font-size:13px;color:#fff} #dock .dt b{color:#fff} #dock .dt span{color:var(--sidebar-muted);font-size:11px}
  #toast{position:absolute;top:18px;left:50%;transform:translateX(-50%) translateY(-24px);z-index:70;background:var(--navy);border:1px solid var(--navy-line);color:#fff;font-size:13px;padding:11px 18px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(30,45,64,.22)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:var(--gold)}
  @media (max-width:780px){:root{--w:212px}}
</style>
</head>
<body>
  <div id="shell">
    <aside id="side">
      <div id="side-head">
        <div id="brand"><span class="mark">1FP</span><span class="t">1st&nbsp;Fire&nbsp;Protection<small>Operating System</small></span></div>
        <button id="collapse" title="Collapse (Ctrl/⌘ + \)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
      <nav id="nav"></nav>
      <div id="side-foot"><span class="dot"></span>Online · San Antonio</div>
    </aside>
    <div id="reopen"><span class="mark"></span><span class="rl">Menu</span></div>
    <div id="main">
      <div id="frames"></div>
      <div id="dock"><span class="p"></span><span class="dt"><b>Receptionist</b> is live <span>· tap to return</span></span></div>
      <div id="toast"></div>
    </div>
  </div>
<script>
/* ---- 1st FP TABS ---- */
var TABS = [
  { key:"calls",     label:"Receptionist",     sub:"Live · 24/7",      src:"/calls",    home:true,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 11.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>' },
  { key:"invoices",  label:"Invoice Collector", sub:"Receivables",     src:"/invoices",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>' },
  { key:"reviews",   label:"Review Collector",  sub:"Reputation",      src:"/reviews",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg>' },
  { key:"integrations", label:"Integrations",   sub:"The hands",       src:"/integrations",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>' }
];
var NAV_MESSAGE_TYPE = "app-navigate";
var DEFAULT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/></svg>';
(function(){ "use strict";
  var byKey={}; TABS.forEach(function(t){byKey[t.key]=t;});
  var home=(TABS.find(function(t){return t.home;})||TABS[0]).key, current=home;
  var nav=document.getElementById("nav"),frames=document.getElementById("frames"),dock=document.getElementById("dock"),toastEl=document.getElementById("toast"),shell=document.getElementById("shell");
  nav.innerHTML=TABS.map(function(t,i){var sep=(i===1)?'<div class="nav-sep">Agents</div>':'';return sep+'<div class="nav-item'+(t.key===current?' active':'')+'" data-key="'+t.key+'" title="'+t.label+'"><div class="ic">'+(t.icon||DEFAULT_ICON)+'</div><div class="tx"><div class="l">'+t.label+'</div><div class="s">'+(t.sub||'')+'</div></div></div>';}).join("");
  frames.innerHTML=TABS.map(function(t){var src=t.key===home?' src="'+t.src+'"':'';return '<iframe class="frame'+(t.key===current?' active':'')+'" id="frame-'+t.key+'" data-src="'+t.src+'"'+src+' allow="microphone; autoplay; camera"></iframe>';}).join("");
  function toast(m){toastEl.innerHTML=m;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove("show");},3000);}
  function activate(key,prog){if(!byKey[key])return;var f=document.getElementById("frame-"+key);if(f&&!f.src)f.src=f.getAttribute("data-src");TABS.forEach(function(t){document.getElementById("frame-"+t.key).classList.toggle("active",t.key===key);var ni=nav.querySelector('.nav-item[data-key="'+t.key+'"]');if(ni)ni.classList.toggle("active",t.key===key);});current=key;dock.classList.toggle("show",key!==home);if(prog&&key!==home)toast('Opened <b>'+byKey[key].label+'</b>');}
  function setCollapsed(v){shell.classList.toggle("collapsed",v);try{localStorage.setItem("shell_collapsed",v?"1":"0");}catch(_){}}
  document.getElementById("collapse").onclick=function(){setCollapsed(true);};
  document.getElementById("reopen").onclick=function(){setCollapsed(false);};
  document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="\\"){e.preventDefault();setCollapsed(!shell.classList.contains("collapsed"));}});
  try{if(localStorage.getItem("shell_collapsed")==="1")shell.classList.add("collapsed");}catch(_){}
  nav.addEventListener("click",function(e){var it=e.target.closest(".nav-item");if(it)activate(it.getAttribute("data-key"));});
  dock.addEventListener("click",function(){activate(home);});
  window.addEventListener("message",function(e){var d=e.data||{};if(d.type===NAV_MESSAGE_TYPE&&d.tab){activate(String(d.tab).toLowerCase(),true);}});
  var q=new URLSearchParams(location.search).get("tab");if(q&&byKey[q])activate(q);
  window.AppShell={open:function(k){activate(k,true);},collapse:setCollapsed,tabs:TABS};
})();
</script>
</body>
</html>
