<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline · Northstar</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  .screen{max-width:none}
  .pl-stats{display:flex;align-items:center;gap:26px;padding:16px 20px}
  @media (max-width:900px){
    .pl-stats{flex-wrap:wrap;gap:16px 26px}
    .pl-note{flex-basis:100%;max-width:none}
  }
  .pl-fig .pl-lab{font-weight:700;font-size:11px;color:var(--muted)}
  .pl-fig .pl-val{font-weight:800;font-size:22px;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
  .pl-fig .pl-val.money{color:var(--money)}
  .pl-fig .pl-val.green{color:var(--green)}
  .pl-note{flex:1;margin:0;font-weight:500;font-size:12.5px;line-height:1.6;color:var(--ink-3);max-width:46ch}
  .pl-count{font-weight:600;font-size:11px;color:var(--muted)}
  .pl-cust{font-weight:700;font-size:12.5px;color:var(--ink)}
  .deal.lost .pl-cust{color:var(--ink-2)}
  .pl-detail{font-weight:500;font-size:11.5px;color:var(--muted);margin-top:4px}
  .pl-foot{display:flex;align-items:center;gap:7px;margin-top:10px}
  .pl-amt{font-weight:800;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pl-foot .pl-spacer{flex:1}
  .deal.lost .pl-chip{display:inline-block;margin-top:10px}
</style>
</head>
<body>
<div class="screen view" id="root">
  <div class="card pl-stats" id="stats"></div>
  <div class="board" id="board"></div>
</div>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderStats(s){
  s=s||{};
  return ''
    +fig('Open pipeline',s.open,'')
    +fig('Quotes aging past 7 days',s.aging,'money')
    +fig('Win rate, 90 days',s.winRate,'green')
    +fig('From deficiencies',s.fromDeficiencies,'')
    +'<p class="pl-note">Quotes come from ServiceTrade the moment an estimator sends one. Stage changes here push straight back.</p>';
}
function fig(lab,val,tone){
  return '<div class="pl-fig"><div class="pl-lab">'+esc(lab)+'</div>'
    +'<div class="pl-val'+(tone?' '+tone:'')+'">'+esc(val)+'</div></div>';
}
function renderStage(st){
  var head='<div class="col-head"><span class="sq" style="background:'+esc(st.sq)+'"></span>'
    +'<span class="n">'+esc(st.label)+'</span>'
    +'<span class="pl-count">'+esc(st.count)+' · '+esc(st.total)+'</span></div>';
  var deals=(st.deals||[]).map(renderDeal).join('');
  return '<div class="pl-col">'+head
    +'<div style="display:flex;flex-direction:column;gap:10px">'+deals+'</div></div>';
}
function renderDeal(d){
  var chip='<span class="pill '+esc(d.chipTone||'gray')+' pl-chip">'+esc(d.chip)+'</span>';
  var body='<div class="pl-cust">'+esc(d.customer)+'</div>'
    +'<div class="pl-detail">'+esc(d.detail)+'</div>';
  if(d.lost){
    return '<div class="deal lost lift">'+body+chip+'</div>';
  }
  var foot='<div class="pl-foot"><span class="pl-amt num">'+esc(d.amount)+'</span>'
    +'<span class="pl-spacer"></span>'+chip+'</div>';
  return '<div class="deal lift">'+body+foot+'</div>';
}
function render(d){
  document.getElementById('stats').innerHTML=renderStats(d.stats);
  document.getElementById('board').innerHTML=(d.stages||[]).map(renderStage).join('');
}
function load(){
  fetch('/api/pipeline').then(function(r){return r.json();}).then(render);
}
load();
</script>
</body>
</html>
