<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phones executive report · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/brand/site-theme.css" />
<style>
  /* Headline card, same anatomy as License cleanup: big money number | divider | summary | side figure. */
  .hl{display:flex;align-items:center;gap:26px;padding:20px 22px;flex-wrap:wrap}
  .hl .big{font-weight:800;font-size:34px;line-height:1;color:var(--money);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hl .big small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:normal}
  .hl .vr{width:1px;height:52px;background:var(--divider)}
  .hl .side{flex:1;min-width:240px;font-weight:500;font-size:13px;line-height:1.65;color:var(--ink-3)}
  .hl .side b{color:var(--ink);font-weight:600}
  .hl .fig{text-align:right}
  .hl .fig .v{font-weight:800;font-size:20px;color:var(--green);font-variant-numeric:tabular-nums}
  .hl .fig .l{font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
  .hl .fig + .fig{margin-left:6px}
  .kpi{cursor:default}
  .kpi .top{justify-content:space-between}
  .card-head .n{font-weight:600;font-size:13px;color:var(--faint)}
  td .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
  td.r,th.r{text-align:right}
  tr.total td{font-weight:800;color:var(--ink);background:var(--panel-alt);border-bottom:none}
  .act{display:flex;gap:12px;align-items:flex-start}
  .step{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .bars{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .bar-row .lab{width:150px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
  .bar-row .bar>span{background:var(--brand)}
  .bar-row .bar.quiet>span{background:var(--ink-3)}
  .bar-row .v{width:auto;min-width:210px;text-align:left;font-weight:500;font-size:12.5px;color:var(--muted)}
  .bar-row .v b{color:var(--ink);font-weight:800;margin-right:6px}
  .grp{padding:14px 18px 8px;font-weight:700;font-size:13px;color:var(--ink);display:flex;gap:6px;align-items:baseline;border-top:1px solid var(--divider)}
  .grp:first-child{border-top:0}
  .grp .n{font-weight:600;color:var(--faint)}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .split-even{gap:14px}
  .split-even>.card{height:100%}
  .dec .row{align-items:flex-start;gap:12px}
  .dec .t{font-weight:600;font-size:14px;color:var(--ink)}
  .dec .d{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .tvcost{display:inline-flex;align-items:center;gap:8px}
  .tvcost input{width:96px;padding:6px 10px;font-size:13px}
  .loading{padding:60px 0;text-align:center;font-weight:500;color:var(--muted)}
  @media (max-width:900px){ .kpis{grid-template-columns:1fr 1fr} .split-even{grid-template-columns:1fr} }
  @media (max-width:640px){ .hl .vr{display:none} .hl .fig{text-align:left} .bar-row .lab{width:100px} .bar-row .v{min-width:0} }
  @media print{
    @page{size:letter;margin:.5in}
    .os-actions,.noprint{display:none!important}
    body{background:#fff}
    .page{padding:0;max-width:none}
    .view>*{animation:none!important}
    .card,.kpi,tr,.row{break-inside:avoid}
    .sec-h{break-after:avoid}
    .tw{overflow:visible}
  }
</style>
</head>
<body>
<div class="page view">
  <button class="crumb noprint" id="back">‹ Phones &amp; iPads</button>
  <div class="os-screen-head">
    <div>
      <h1>Phones &amp; iPads: executive report</h1>
      <div class="os-question" id="asof">Loading…</div>
    </div>
    <div class="os-actions"><button class="os-btn primary" id="print">Print or save as PDF</button></div>
  </div>
  <div id="out"><div class="loading">Loading the report…</div></div>
</div>
<script src="/os.js"></script>
<script>
"use strict";
var R=null;
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function usd(n,cents){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0}); }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
function fmtDate(iso){ if(!iso) return ''; var d=new Date(String(iso).length===10?iso+'T12:00:00':iso); return isNaN(d)?String(iso):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtRange(r){ if(!r||!r.from||!r.to) return ''; var f=new Date(r.from+'T12:00:00'), t=new Date(r.to+'T12:00:00');
  return f.toLocaleDateString('en-US',f.getFullYear()===t.getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})+' to '+t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function pill(text, tone){ return '<span class="pill '+tone+'">'+esc(text)+'</span>'; }
function tbl(head, rows, opts){ opts=opts||{};
  if(!rows.length) return '<div class="note-line" style="padding:0 18px 14px">'+esc(opts.empty||'None.')+'</div>';
  return '<div class="tw"><table><thead><tr>'+head.map(function(h){ return '<th'+(h.r?' class="r"':'')+'>'+esc(h.label)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr'+(r._total?' class="total"':'')+'>'+head.map(function(h){ return '<td class="'+(h.r?'r num':'')+'">'+h.cell(r)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
}
function card(title, n, body, foot){
  return '<div class="card card-clip"><div class="card-head"><h2>'+title+'</h2>'+(n?'<span class="n">'+n+'</span>':'')+'</div>'+body+(foot?'<div class="card-foot">'+foot+'</div>':'')+'</div>';
}
function secH(title, n, aside){ return '<div class="sec-h"><h2>'+title+(n!=null?'<span class="n">'+n+'</span>':'')+'</h2>'+(aside?'<span class="aside">'+aside+'</span>':'')+'</div>'; }

function load(){
  fetch('/api/devices/report').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ document.getElementById('out').innerHTML='<div class="loading">'+(d&&d.error==='people_auth_required'?'Sign in to see this report.':'Could not load the report.')+'</div>'; return; }
    R=d; render();
  }).catch(function(){ document.getElementById('out').innerHTML='<div class="loading">Could not load the report.</div>'; });
}

function render(){
  var s=R.spend, t=R.total, a=R.actions, tv=R.teamsVoice, est=s.costEstimated, o=R.asOf;
  var asof=['What we pay for phones and iPads, and what to cut.']; if(o.att) asof.push('AT&amp;T report of '+fmtDate(o.att)+'.');
  document.getElementById('asof').innerHTML=asof.join(' ');
  if(!s.activeLines){ document.getElementById('out').innerHTML='<div class="loading">No lines yet. Import the AT&amp;T report on the Phones &amp; iPads screen to build this report.</div>'; return; }
  var by=function(k){ return a.filter(function(x){return x.key===k;})[0]||{count:0,monthly:0,yearly:0,oneTime:0}; };
  var free=by('cancel_free'), owing=by('cancel_owing'), rmTeams=by('remove_teams'), heavy=by('drop_att_heavy');
  var html='';

  html+='<div class="card hl"><div class="big">'+usd(t.yearly)+'<small>Savings available per year</small></div><div class="vr"></div>'+
    '<div class="side"><b>'+usd(t.monthly)+' a month</b> across four actions'+(t.oneTime?', for '+usd(t.oneTime)+' in one-time device payoffs':'')+'. '+
    (free.count?'The first, cancelling '+plural(free.count,'idle line')+' that are already paid off, costs nothing.':'')+'</div>'+
    '<div class="fig"><div class="v">'+usd(free.monthly)+'</div><div class="l">free to cut per month</div></div></div>';

  html+='<div class="kpis" style="margin-top:14px">'+
    '<div class="kpi"><div class="top"><span class="lab">AT&amp;T service</span>'+(est?pill('est.','amber'):'')+'</div><span class="val">'+usd(s.monthlyService)+'</span><span class="sub">per month</span></div>'+
    '<div class="kpi"><div class="top"><span class="lab">Active lines</span></div><span class="val">'+s.activeLines+'</span><span class="sub">'+s.phones+' phones · '+s.tablets+' iPads</span></div>'+
    '<div class="kpi"><div class="top"><span class="lab">Device installments</span></div><span class="val">'+usd(s.monthlyInstallments)+'</span><span class="sub">per month</span></div>'+
    '<div class="kpi"><div class="top"><span class="lab">Still owed on devices</span></div><span class="val">'+usd(s.deviceBalance)+'</span><span class="sub">'+s.upgradeEligible+' lines can upgrade now</span></div></div>';

  var why={cancel_free:'Idle and already paid off, including lines the offices cancelled that AT&amp;T still bills.',
    cancel_owing:'Idle with a device balance. Newer devices are better reassigned to the next hires.',
    remove_teams:'Teams Phone licenses with no or almost no calls to outside numbers.',
    drop_att_heavy:'People who already make their outside calls through Teams.'};
  var rows=a.map(function(x,i){ return {i:i+1,x:x}; }).concat([{_total:true}]);
  html+=secH('Recommended actions')+card('Where the savings come from','', tbl([
    {label:'Action', cell:function(r){ return r._total?'Total':'<div class="act"><span class="step">'+r.i+'</span><div>'+esc(r.x.label)+(r.x.estimated?' '+pill('Teams price est.','amber'):'')+'<span class="sub">'+why[r.x.key]+'</span></div></div>'; }},
    {label:'Scope', r:true, cell:function(r){ return r._total?'':plural(r.x.count, r.x.unit==='licenses'?'license':'line'); }},
    {label:'Per month', r:true, cell:function(r){ return usd(r._total?t.monthly:r.x.monthly); }},
    {label:'Per year', r:true, cell:function(r){ return usd(r._total?t.yearly:r.x.yearly); }},
    {label:'One-time', r:true, cell:function(r){ var v=r._total?t.oneTime:r.x.oneTime; return v?usd(v):'$0'; }}
  ], rows), est?'AT&amp;T cost is estimated at '+usd(s.perLine,true)+' a line (the monthly bill divided by active lines) until plan costs are entered.':'');

  var max=Math.max.apply(null,R.offices.map(function(x){return x.lines;}).concat([1]));
  var bars='<div class="bars">'+R.offices.map(function(x,i){
    return '<div class="bar-row"><span class="lab">'+esc(x.label)+'</span><span class="bar'+(i<3?'':' quiet')+'"><span style="width:'+Math.max(2,Math.round(x.lines/max*100))+'%"></span></span>'+
      '<span class="v"><b>'+x.lines+'</b>'+esc(plural(x.phones,'phone')+' · '+plural(x.tablets,'iPad')+' · ~'+usd(x.monthly)+'/mo')+(x.idle?' · <span style="color:var(--money);font-weight:600">'+x.idle+' idle</span>':'')+'</span></div>';
  }).join('')+'</div>';
  var top3=R.offices.slice(0,3), top3n=top3.reduce(function(n,x){return n+x.lines;},0);
  var risk=tbl([
    {label:'Issue', cell:function(r){ return esc(r.label)+'<span class="sub">'+esc(r.why)+'</span>'; }},
    {label:'Devices', r:true, cell:function(r){ return r.count; }}
  ], R.risk);
  html+=secH('Fleet')+'<div class="split-even">'+
    card('Lines by office', s.activeLines+' lines', bars, esc(top3.map(function(x){return x.label;}).join(', '))+' hold '+top3n+' of '+s.activeLines+' lines ('+Math.round(top3n/s.activeLines*100)+'%).')+
    card('Device readiness', '', risk, 'Apple Business Manager and Addigy both track devices by serial number.')+'</div>';

  var idleFree=R.idleLines.filter(function(l){return !l.balance;}), idleOwe=R.idleLines.filter(function(l){return l.balance;});
  var icols=[
    {label:'Number', cell:function(r){ return '<span class="num">'+esc(r.number)+'</span>'; }},
    {label:'Office', cell:function(r){ return esc(r.office); }},
    {label:'Device', cell:function(r){ return esc(r.model); }},
    {label:'Why it is idle', cell:function(r){ return esc(r.reason)+(r.holder?'<span class="sub">'+esc(r.holder)+'</span>':''); }},
    {label:'Balance', r:true, cell:function(r){ return r.balance?usd(r.balance):'None'; }}
  ];
  html+=secH('Idle lines', R.idleLines.length, 'Cancel the free ones first; reassign newer devices that still owe')+
    '<div class="card card-clip"><div class="grp">Free to cancel <span class="n">'+idleFree.length+'</span></div>'+tbl(icols, idleFree)+
    '<div class="grp">Owe a device balance <span class="n">'+idleOwe.length+' · '+usd(idleOwe.reduce(function(n,l){return n+l.balance;},0))+'</span></div>'+tbl(icols, idleOwe)+'</div>';

  if(tv.synced){
    var pcols=[
      {label:'Person', cell:function(r){ return esc(r.person)+(r.office?'<span class="sub">'+esc(r.office)+'</span>':''); }},
      {label:'Outside calls', r:true, cell:function(r){ return r.pstn_calls==null?'n/a':r.pstn_calls; }},
      {label:'All Teams calls', r:true, cell:function(r){ return r.calls==null?'n/a':r.calls; }}
    ];
    var both=R.teams.remove.filter(function(r){return r.phones.length;}).length+R.teams.heavy.length+R.teams.review.length;
    var ranges=(o.teamsPstnRange?'<b>Outside calls:</b> '+fmtRange(o.teamsPstnRange):'')+(o.teamsUsageRange?' &nbsp;·&nbsp; <b>All Teams calls:</b> '+fmtRange(o.teamsUsageRange):'');
    html+=secH('AT&amp;T phone or Teams Phone', both, both+' people pay for both')+
      '<div class="banner">'+'<div>Calls to outside numbers show which one each person actually uses. Teams-to-Teams calls keep working without Teams Phone.'+(ranges?'<br>'+ranges:'')+'</div></div>'+
      '<div class="split-even">'+
        card('Remove Teams Phone', R.teams.remove.length, tbl(pcols, R.teams.remove))+
        '<div class="stack">'+card('Consider dropping the AT&amp;T phone', R.teams.heavy.length, tbl(pcols, R.teams.heavy, {empty:'Nobody.'}))+
          (R.teams.review.length?card('Review with their manager', R.teams.review.length, tbl(pcols, R.teams.review)):'')+
          (R.teams.disabled.length?card('Disabled accounts still holding one', R.teams.disabled.length, tbl(pcols, R.teams.disabled)):'')+'</div>'+
      '</div>';
  }

  var dec=[];
  if(free.count) dec.push(['Approve cancelling the '+plural(free.count,'idle line')+' that are paid off','Saves '+usd(free.monthly)+' a month at no cost.']);
  if(owing.count) dec.push(['Decide on the '+plural(owing.count,'idle line')+' that owe a balance','Cancelling saves '+usd(owing.monthly)+' a month for '+usd(owing.oneTime)+' in payoffs. Reassigning avoids buying new devices.']);
  if(rmTeams.count) dec.push(['Remove Teams Phone from '+plural(rmTeams.count,'person')+' who do not use it','Saves about '+usd(rmTeams.monthly)+' a month. Confirm shared accounts are not a main line first.']);
  dec.push(['Set the standard: one company number per person','Field staff keep an AT&T phone. Office staff who call from a computer use Teams Phone.']);
  if(heavy.count) dec.push(['Decide for the '+plural(heavy.count,'heavy Teams caller')+' whether to drop the AT&T phone','Saves '+usd(heavy.monthly)+' a month.']);
  dec.push(['Require Apple Business Manager and Addigy for every new device','Use the available upgrades to retire devices too old for current iOS.']);
  html+=secH('Decisions for leadership')+'<div class="card card-clip dec">'+dec.map(function(d,i){ return '<div class="row"><span class="step">'+(i+1)+'</span><div><div class="t">'+esc(d[0])+'</div><div class="d">'+esc(d[1])+'</div></div></div>'; }).join('')+'</div>';

  html+='<div class="note-line">'+
    (est?'AT&amp;T cost is the monthly bill divided by active lines until real plan costs are entered on Phones &amp; iPads. ':'AT&amp;T cost uses the plan costs entered for '+s.priced+' lines. ')+
    'Device balances come from AT&amp;T installment terms, or from the device workbook where AT&amp;T shows none. '+
    'Teams Phone is priced at <b>'+usd(tv.cost,true)+'</b> per user per month'+(tv.estimated?' (list price for Teams Phone with Calling Plan, not your invoice)':'')+'.'+
    '</div><div class="note-line noprint"><span class="tvcost">Teams Phone price from your invoice <input id="tvCost" type="number" min="0" step="0.01" value="'+(tv.estimated?'':tv.cost)+'" placeholder="'+tv.cost+'" /><button class="os-btn sm" id="tvSave">Save</button></span></div>';

  document.getElementById('out').innerHTML=html;
  document.getElementById('tvSave').addEventListener('click',function(){
    fetch('/api/devices/teams-voice-cost',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount:document.getElementById('tvCost').value})})
      .then(function(r){return r.json();}).then(function(d){ if(!d||!d.ok){ if(window.OS&&OS.toast) OS.toast((d&&d.error)||'Could not save.','bad'); return; } load(); });
  });
}
document.getElementById('print').addEventListener('click',function(){ window.print(); });
document.getElementById('back').addEventListener('click',function(){ if(window.OS&&OS.go) OS.go('devices'); else location.href='/devices'; });
load();
</script>
</body></html>
