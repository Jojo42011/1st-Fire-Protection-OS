<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review 1st Fire Protection</title>
<meta name="description" content="Choose the 1st Fire Protection office you worked with to leave a Google review.">
<meta name="theme-color" content="#FFF8F6">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta property="og:title" content="How was your experience with 1st Fire Protection?">
<meta property="og:description" content="Choose your office to leave us a Google review.">
<meta property="og:image" content="/brand/logo-email.png">
<link rel="icon" href="/brand/logo-240.png">
<link rel="apple-touch-icon" href="/brand/logo-240.png">
<link rel="preconnect" href="https://g.page">
<link rel="preconnect" href="https://search.google.com">
<link rel="dns-prefetch" href="https://accounts.google.com">
<link rel="preload" href="/brand/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Inter is shipped as one variable file (the three Inter-*.woff2 files are identical), so a single
     download covers every weight used here. */
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/brand/fonts/Inter-Bold.woff2") format("woff2"); }

  :root {
    --ink: #14213a;
    --ink-2: #1e2d40;
    --muted: #5a6577;
    --muted-2: #8b94a3;
    --line: #e5e8ed;
    --chip: #f1f3f6;
    --red: #e53935;
    --red-deep: #c62828;
    --red-tint: #fdeceb;
    --gold: #f5b81b;
    --paper: #fbfaf9;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --sh-card: 0 1px 2px rgba(20, 33, 58, .04), 0 8px 24px rgba(20, 33, 58, .06);
    --sh-hover: 0 2px 4px rgba(20, 33, 58, .05), 0 16px 36px rgba(20, 33, 58, .10);
    --sh-press: 0 1px 2px rgba(20, 33, 58, .08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background: linear-gradient(165deg, #fff6f3 0%, #ffffff 36%, #ffffff 58%, #f2f5fa 100%);
    background-attachment: fixed; overflow-x: hidden;
  }
  .glow { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
  .glow.a { width: 560px; height: 560px; top: -260px; right: -220px; background: radial-gradient(circle, rgba(229, 57, 53, .10), rgba(229, 57, 53, 0) 66%); }
  .glow.b { width: 620px; height: 620px; bottom: -320px; left: -260px; background: radial-gradient(circle, rgba(30, 45, 64, .08), rgba(30, 45, 64, 0) 66%); }

  main {
    position: relative; z-index: 1; margin: 0 auto; width: 100%; max-width: 480px;
    padding: max(28px, calc(env(safe-area-inset-top) + 18px)) max(20px, env(safe-area-inset-right)) max(24px, calc(env(safe-area-inset-bottom) + 16px)) max(20px, env(safe-area-inset-left));
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  }

  header { text-align: center; }
  .logo { display: block; width: 68px; height: auto; margin: 0 auto 14px; filter: drop-shadow(0 6px 14px rgba(20, 33, 58, .10)); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 100px;
    background: rgba(255, 255, 255, .9); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20, 33, 58, .04);
    font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
  }
  .pill .g { width: 16px; height: 16px; flex: none; }
  .pill .sep { width: 1px; height: 12px; background: var(--line); }
  .stars { display: inline-flex; gap: 1px; }
  .stars svg { width: 11px; height: 11px; fill: var(--gold); }
  h1 {
    margin: 16px 0 8px; font-size: clamp(31px, 8.4vw, 46px); line-height: 1.06; letter-spacing: -.04em;
    font-weight: 800; color: var(--ink); text-wrap: balance;
  }
  .sub { margin: 0 auto; max-width: 30ch; font-size: 16.5px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }

  .offices { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 9px; }
  .offices li { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms + 140ms); }
  header > * { animation: rise .55s var(--ease) both; }
  header > :nth-child(2) { animation-delay: 40ms; }
  header > :nth-child(3) { animation-delay: 70ms; }
  header > :nth-child(4) { animation-delay: 100ms; }

  .office {
    position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) 36px; align-items: center; gap: 14px;
    min-height: 64px; padding: 11px 14px; border-radius: 18px; background: #fff; border: 1px solid var(--line);
    box-shadow: var(--sh-card); color: var(--ink); text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease), opacity .3s var(--ease), background-color .2s var(--ease);
  }
  .office:focus-visible { outline: 3px solid rgba(229, 57, 53, .45); outline-offset: 3px; }
  .pin { width: 40px; height: 40px; border-radius: 12px; background: var(--red-tint); display: grid; place-items: center; transition: background-color .2s var(--ease); }
  .pin svg { width: 20px; height: 20px; fill: none; stroke: var(--red); stroke-width: 2; stroke-linejoin: round; }
  .label { display: flex; flex-direction: column; min-width: 0; }
  .name { font-size: 17px; font-weight: 650; letter-spacing: -.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-size: 12.5px; font-weight: 600; color: var(--red-deep); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .25s var(--ease), opacity .2s var(--ease); }
  .go { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; transition: background-color .2s var(--ease), transform .2s var(--ease); }
  .arrow { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--ease), stroke .2s var(--ease); }
  .spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .7s linear infinite; }

  @media (hover: hover) and (pointer: fine) {
    .office:hover { transform: translateY(-1px); box-shadow: var(--sh-hover); border-color: #d9dde4; }
    .office:hover .go { background: var(--ink); }
    .office:hover .arrow { stroke: #fff; transform: translateX(2px); }
  }
  .office.is-pressed, .office:active { transform: scale(.975); box-shadow: var(--sh-press); background: #fcfcfd; }
  .office.is-pressed .go, .office:active .go { background: var(--ink); transform: scale(.94); }
  .office.is-pressed .arrow, .office:active .arrow { stroke: #fff; transform: translateX(2px); }

  .offices.has-choice .office:not(.is-opening) { opacity: .42; }
  .office.is-opening { border-color: rgba(229, 57, 53, .5); box-shadow: 0 0 0 4px rgba(229, 57, 53, .10), var(--sh-card); transform: none; background: #fff; }
  .office.is-opening .pin { background: var(--red); }
  .office.is-opening .pin svg { stroke: #fff; }
  .office.is-opening .go { background: var(--red); transform: none; }
  .office.is-opening .arrow { display: none; }
  .office.is-opening .spin { display: block; }
  .office.is-opening .state { max-height: 18px; opacity: 1; }

  .thanks { margin: 30px auto 0; max-width: 34ch; text-align: center; font-size: 14px; line-height: 1.55; color: var(--muted); animation: rise .55s var(--ease) both; animation-delay: 480ms; }
  .thanks strong { display: block; color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 2px; }
  footer { margin-top: auto; padding-top: 28px; text-align: center; font-size: 12px; color: var(--muted-2); }
  .empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1px dashed var(--line); border-radius: 18px; background: rgba(255, 255, 255, .7); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 720px) {
    main { max-width: 700px; padding-top: max(64px, 9vh); }
    .logo { width: 92px; margin-bottom: 20px; }
    h1 { margin-top: 22px; }
    .sub { font-size: 18px; }
    .offices { grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
    .offices li:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 6px); }
    .office { min-height: 72px; padding: 14px 16px; }
    .thanks { margin-top: 40px; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 28px; }
    .office { gap: 12px; min-height: 62px; }
    .name { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
    .spin { animation: none; border-color: #fff; }
  }
</style>
</head>
<body>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>
<main>
  <header>
    <picture>
      <source srcset="/brand/logo-240.webp" type="image/webp">
      <img class="logo" src="/brand/logo-240.png" width="240" height="205" alt="1st Fire Protection" fetchpriority="high">
    </picture>
    <span class="pill">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google Reviews
      <span class="sep" aria-hidden="true"></span>
      <span class="stars" aria-label="5 stars"><svg viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg></span>
    </span>
    <h1>How was your experience?</h1>
    <p class="sub">Choose the office you worked with to leave us a Google review.</p>
  </header>

  <ul class="offices" aria-label="1st Fire Protection offices">
      <!--OFFICES-->
  </ul>

  <p class="thanks"><strong>Thank you for choosing us.</strong>Your review helps other Texas businesses find a fire protection team they can trust.</p>
  <footer>© <!--YEAR--> 1st Fire Protection</footer>
</main>

<script>
(function () {
  "use strict";
  var ENDPOINT = "/api/review-page/events";
  var params = new URLSearchParams(location.search);
  function clean(v, max) { return String(v || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, max); }
  var ctx = {
    src: clean(params.get("src"), 24) || (document.referrer ? "web" : "direct"),
    badge: clean(params.get("b") || params.get("badge"), 40),
    sid: Math.random().toString(36).slice(2, 12)
  };

  /* Analytics hook: one call fans out to our own endpoint (beacon, survives the page unloading),
     Google Tag Manager's dataLayer, gtag, and a DOM event, so any tool can be attached later. */
  function track(event, props) {
    var data = { event: event, src: ctx.src, badge: ctx.badge, sid: ctx.sid };
    for (var k in props || {}) data[k] = props[k];
    try { (window.dataLayer = window.dataLayer || []).push(data); } catch (e) {}
    try { if (typeof window.gtag === "function") window.gtag("event", event, data); } catch (e) {}
    try { document.dispatchEvent(new CustomEvent("fp:review", { detail: data })); } catch (e) {}
    try {
      var body = JSON.stringify(data);
      if (navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, new Blob([body], { type: "application/json" }))) return;
      fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" }, body: body, keepalive: true }).catch(function () {});
    } catch (e) {}
  }
  window.fpReview = { track: track };

  track("landing_visit");

  var list = document.querySelector(".offices");
  var selected = {};
  function select(a) {
    var office = a.getAttribute("data-office");
    if (!selected[office]) { selected[office] = true; track("office_selected", { office: office }); }
  }
  function unpress() { var p = list.querySelectorAll(".is-pressed"); for (var i = 0; i < p.length; i++) p[i].classList.remove("is-pressed"); }

  list.addEventListener("pointerdown", function (e) {
    var a = e.target.closest && e.target.closest(".office");
    if (!a) return;
    a.classList.add("is-pressed");
    select(a);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) { list.addEventListener(t, unpress); });

  /* The card is a real link, so the browser starts loading Google on the tap itself. We only mark
     the choice and log it; nothing waits on the beacon. */
  list.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".office");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    select(a);
    track("review_link_clicked", { office: a.getAttribute("data-office") });
    unpress();
    a.classList.add("is-opening");
    list.classList.add("has-choice");
  });

  /* Coming back from Google (back swipe restores this page from cache): reset the cards. */
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    unpress();
    list.classList.remove("has-choice");
    var o = list.querySelectorAll(".is-opening");
    for (var i = 0; i < o.length; i++) o[i].classList.remove("is-opening");
    selected = {};
  });
})();
</script>
</body>
</html>
