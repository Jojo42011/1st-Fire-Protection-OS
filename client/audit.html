<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Operator · 1st FP</title>
<link rel="stylesheet" href="/brand/brand.css" />
<style>
  /* ── THE X-RAY ROOM — dark, spacious, one thing at a time ─────────────
     Surfaces step up from near-black navy; red = signal, gold = a build,
     green = live. Values wear text tokens; color lives in marks only. */
  :root{
    --s0:#0C131D; --s1:#101927; --s2:#152134;
    --ink:#E9EEF5; --ink-2:#8FA0B4; --ink-3:#5C6B7D;
    --hair:rgba(233,238,245,.08); --hair-2:rgba(233,238,245,.16);
    --red:#E53935; --gold:#F5B81B; --ok:#2E9E5B;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:var(--s2) var(--s0)}
  body{background:var(--s0);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 420px at 50% -80px,rgba(229,57,53,.05),transparent 70%)}
  .wrap{max-width:1020px;margin:0 auto;padding:44px 40px 90px}
  .micro{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}

  /* top line */
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .top .id{display:flex;align-items:baseline;gap:14px}
  .top h1{font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
  .top .st{display:flex;align-items:center;gap:8px}
  .top .st .d{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .top .st.on .d{background:var(--ok);box-shadow:0 0 8px rgba(46,158,91,.6)}

  /* command — the spotlight */
  .command{margin:72px auto 0;max-width:760px;text-align:center}
  .command .micro{color:var(--red)}
  .cmdrow{display:flex;align-items:center;gap:0;margin-top:22px;border-bottom:1px solid var(--hair-2);transition:border-color .25s}
  .cmdrow:focus-within{border-color:var(--red)}
  #obs{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--sans);font-weight:400;
    font-size:21px;padding:16px 4px;min-width:0}
  #obs::placeholder{color:var(--ink-3);font-weight:400}
  #obs:focus{outline:none}
  #loc-sel{background:transparent;border:none;color:var(--ink-3);font-family:var(--mono);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;padding:8px 6px;cursor:pointer;max-width:150px}
  #loc-sel:focus{outline:none;color:var(--ink-2)} #loc-sel option{background:var(--s1);color:var(--ink)}
  #go{background:transparent;border:none;color:var(--red);cursor:pointer;padding:10px 2px 10px 14px;display:flex;align-items:center}
  #go svg{width:22px;height:22px} #go:disabled{opacity:.35}
  #go:hover svg{transform:translateX(3px)} #go svg{transition:transform .18s}

  /* the read — one finding, one build, one question */
  .read{max-width:760px;margin:34px auto 0;display:none;text-align:left}
  .read.show{display:block;animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .read .card{background:var(--s1);border:1px solid var(--hair);border-left:2px solid var(--red);padding:26px 30px}
  .read .f{font-size:19px;font-weight:400;line-height:1.5;color:var(--ink)}
  .read .b{display:flex;align-items:flex-start;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
  .read .b .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-top:5px}
  .read .b .n{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .read .b .lv{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ok);border:1px solid rgba(46,158,91,.45);padding:2px 6px;margin-left:4px;vertical-align:2px}
  .read .b .p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .read .q{margin-top:16px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
  .read .q b{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--red);font-weight:500;margin-right:10px}

  /* hero + stats */
  .stats{display:flex;align-items:flex-end;gap:70px;margin-top:96px;flex-wrap:wrap}
  .hero .micro{margin-bottom:14px}
  .hero .v{font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:.85}
  .hero .v small{font-size:38px;font-weight:700;color:var(--ink-2);letter-spacing:0}
  .hero .meter{width:220px;height:2px;background:rgba(229,57,53,.16);margin-top:20px;position:relative}
  .hero .meter i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .8s cubic-bezier(.2,.7,.3,1)}
  .tiles{display:flex;gap:56px;flex-wrap:wrap;padding-bottom:8px}
  .tile .v{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:12px}
  .tile .v small{font-size:18px;color:var(--ink-3);font-weight:400}

  /* sections */
  .sec{margin-top:88px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .sec-head .micro::before{content:"";display:inline-block;width:18px;height:1px;background:var(--red);margin-right:12px;vertical-align:4px}

  /* pillar map */
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
  .pillar{background:var(--s0);padding:24px 22px 20px;cursor:pointer;transition:background .2s;position:relative;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
  .pillar:hover{background:var(--s1)}
  .pillar .nm{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.5;max-width:12ch}
  .pillar .pc{position:absolute;top:22px;right:20px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .pillar .foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .pillar .m{flex:1;height:2px;background:rgba(229,57,53,.14);position:relative;margin-right:14px}
  .pillar .m i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .7s ease}
  .pillar .dots{display:flex;gap:5px}
  .pillar .dots .bd{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:bloom .5s ease}
  .pillar .dots .bd.lv{background:var(--ok)}
  @keyframes bloom{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

  /* locations */
  .locs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--hair);border-right:none}
  .loc{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 14px;
    border-right:1px solid var(--hair);cursor:pointer;transition:background .2s}
  .loc:hover{background:var(--s1)}
  .loc .d{width:5px;height:5px;border-radius:50%;border:1px solid var(--ink-3);flex:none}
  .loc.on .d{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px rgba(46,158,91,.55)}
  .loc .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
  .loc.on .n{color:var(--ink)}

  /* leaks */
  .leak{display:flex;align-items:center;gap:18px;padding:17px 6px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .15s}
  .leak:hover{background:var(--s1)}
  .leak .sd{width:7px;height:7px;border-radius:50%;flex:none}
  .leak .sd.high{background:var(--red);box-shadow:0 0 7px rgba(229,57,53,.5)} .leak .sd.medium{background:var(--gold)} .leak .sd.low{background:var(--ink-3)}
  .leak .t{flex:1;font-size:14.5px;font-weight:400;color:var(--ink);line-height:1.45;min-width:0}
  .leak .bld{display:flex;align-items:center;gap:8px;flex:none}
  .leak .bld .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .leak .bld .dot.lv{background:var(--ok)}
  .leak .bld .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
  .leak-detail{display:none;padding:4px 6px 20px 25px;border-bottom:1px solid var(--hair);font-size:13.5px;color:var(--ink-2);line-height:1.6;max-width:70ch}
  .leak-detail.show{display:block;animation:rise .3s ease}
  .more{background:transparent;border:none;color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:16px 6px}
  .more:hover{color:var(--ink-2)}

  /* footer action */
  .foot-act{margin-top:96px;display:flex;justify-content:center}
  .brief-btn{background:transparent;border:1px solid var(--hair-2);color:var(--ink);font-family:var(--sans);font-weight:700;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:17px 44px;cursor:pointer;transition:.2s}
  .brief-btn:hover{border-color:var(--red);color:#fff;background:rgba(229,57,53,.08)}
  .brief-btn:disabled{opacity:.4}

  /* drawer (pillar detail) */
  #veil{position:fixed;inset:0;background:rgba(6,10,16,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  #veil.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:-420px;bottom:0;width:400px;max-width:92vw;background:var(--s1);border-left:1px solid var(--hair-2);
    z-index:50;transition:right .3s cubic-bezier(.2,.7,.3,1);padding:34px 30px;overflow-y:auto}
  #drawer.show{right:0}
  #drawer h3{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
  #drawer .pc{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:8px}
  #drawer .grp{margin-top:30px}
  #drawer .grp .micro{display:block;margin-bottom:12px}
  #drawer .it{padding:11px 0;border-bottom:1px solid var(--hair);font-size:13.5px;line-height:1.5}
  #drawer .it b{font-weight:700;display:block}
  #drawer .it span{color:var(--ink-3);font-size:12.5px}
  #drawer .none{color:var(--ink-3);font-size:12.5px}
  .x{position:absolute;top:20px;right:20px;background:transparent;border:none;color:var(--ink-3);font-size:20px;cursor:pointer;padding:6px}
  .x:hover{color:var(--ink)}

  /* brief overlay */
  #brief{position:fixed;inset:0;background:var(--s0);z-index:60;display:none;overflow-y:auto}
  #brief.show{display:block;animation:rise .35s ease}
  #brief .inner{max-width:660px;margin:0 auto;padding:70px 40px 110px}
  #brief .actions{display:flex;gap:22px;align-items:center;margin-bottom:44px}
  #brief-md{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
  #brief-md h1{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);margin-bottom:16px;line-height:1.2}
  #brief-md h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin:40px 0 14px}
  #brief-md li{margin:0 0 12px 18px}
  #brief-md strong{color:var(--ink);font-weight:700}
  #brief-md em{color:var(--ink-3)}
  #brief-md hr{border:none;border-top:1px solid var(--hair);margin:30px 0}
  #brief-md p{margin-bottom:10px}

  @media (max-width:820px){
    .wrap{padding:30px 22px 70px}
    .command{margin-top:44px} #obs{font-size:17px}
    .stats{gap:36px;margin-top:64px} .hero .v{font-size:72px}
    .tiles{gap:34px} .tile .v{font-size:32px}
    .pillars{grid-template-columns:repeat(2,1fr)}
    .sec{margin-top:60px}
    .leak .bld .n{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="id"><h1>The Operator</h1><span class="micro">Operational Audit</span></div>
    <div class="st" id="st"><span class="d"></span><span class="micro" id="st-t">Rules Engine</span></div>
  </header>

  <!-- the spotlight -->
  <section class="command">
    <span class="micro">What did they say?</span>
    <div class="cmdrow">
      <input id="obs" placeholder="Repair quotes wait a week behind one estimator…" autocomplete="off" />
      <select id="loc-sel"><option value="">All sites</option></select>
      <button id="go" title="Log it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- the read -->
  <section class="read" id="read">
    <div class="card">
      <div class="f" id="read-f"></div>
      <div class="b" id="read-b" style="display:none">
        <span class="dot"></span>
        <span class="n" id="read-bn"></span>
        <span class="p" id="read-bp"></span>
      </div>
      <div class="q" id="read-q"></div>
    </div>
  </section>

  <!-- hero + tiles -->
  <section class="stats">
    <div class="hero">
      <span class="micro">Operation mapped</span>
      <div class="v"><span id="v-cov">0</span><small>%</small></div>
      <div class="meter"><i id="m-cov" style="width:0%"></i></div>
    </div>
    <div class="tiles">
      <div class="tile"><span class="micro">Leaks</span><div class="v" id="v-leaks">0</div></div>
      <div class="tile"><span class="micro">Builds matched</span><div class="v" id="v-builds">0</div></div>
      <div class="tile"><span class="micro">Key people</span><div class="v" id="v-vets">0</div></div>
      <div class="tile"><span class="micro">Sites</span><div class="v"><span id="v-locs">0</span><small id="v-locs-t">/9</small></div></div>
    </div>
  </section>

  <!-- pillar map -->
  <section class="sec">
    <div class="sec-head"><span class="micro">The pillar map</span></div>
    <div class="pillars" id="pillars"></div>
  </section>

  <!-- locations -->
  <section class="sec">
    <div class="sec-head"><span class="micro">Nine locations</span></div>
    <div class="locs" id="locs"></div>
  </section>

  <!-- leaks -->
  <section class="sec">
    <div class="sec-head"><span class="micro">The leak table</span></div>
    <div id="leaks"></div>
    <button class="more" id="more" style="display:none">Show all</button>
  </section>

  <div class="foot-act"><button class="brief-btn" id="brief-btn">Executive Brief</button></div>
</div>

<!-- pillar drawer -->
<div id="veil" onclick="closeDrawer()"></div>
<aside id="drawer"><button class="x" onclick="closeDrawer()">×</button><div id="drawer-body"></div></aside>

<!-- brief overlay -->
<div id="brief">
  <div class="inner">
    <div class="actions">
      <button class="brief-btn" id="brief-copy">Copy</button>
      <button class="brief-btn" onclick="document.getElementById('brief').classList.remove('show')">Close</button>
      <span class="micro" id="brief-note"></span>
    </div>
    <div id="brief-md"></div>
  </div>
</div>

<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var STATE=null,BRIEF_RAW='',SHOW_ALL=false;

/* count-up for the numbers */
function countTo(el,target){
  var start=Number(el.textContent)||0;if(start===target){el.textContent=target;return;}
  var t0=performance.now(),dur=700;
  function step(t){var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);
    el.textContent=Math.round(start+(target-start)*k);
    if(k<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

function load(){fetch('/api/audit').then(function(r){return r.json();}).then(render);}

function render(d){
  STATE=d;
  var st=document.getElementById('st');
  if(d.brain){st.classList.add('on');document.getElementById('st-t').textContent='Operator Brain';}
  else{st.classList.remove('on');document.getElementById('st-t').textContent='Rules Engine';}

  var m=d.metrics;
  countTo(document.getElementById('v-cov'),m.coverage);
  document.getElementById('m-cov').style.width=m.coverage+'%';
  countTo(document.getElementById('v-leaks'),m.leaks);
  countTo(document.getElementById('v-builds'),m.builds);
  countTo(document.getElementById('v-vets'),m.veterans);
  countTo(document.getElementById('v-locs'),m.locationsMapped);
  document.getElementById('v-locs-t').textContent='/'+m.locationsTotal;

  // location select
  var sel=document.getElementById('loc-sel'),cur=sel.value;
  sel.innerHTML='<option value="">All sites</option>'+d.locations.map(function(l){
    return '<option'+(l.name===cur?' selected':'')+'>'+esc(l.name)+'</option>';}).join('');

  // pillars — name, %, meter, build dots. nothing else.
  document.getElementById('pillars').innerHTML=d.pillars.map(function(p){
    var dots=p.capabilities.map(function(c){return '<span class="bd'+(c.live?' lv':'')+'" title="'+esc(c.name)+(c.live?' — live':'')+'"></span>';}).join('');
    return '<div class="pillar" onclick="openPillar(\''+p.key+'\')">'+
      '<span class="pc">'+p.coverage+'%</span><div class="nm">'+esc(p.name)+'</div>'+
      '<div class="foot"><div class="m"><i style="width:'+p.coverage+'%"></i></div><div class="dots">'+dots+'</div></div></div>';
  }).join('');

  // locations
  document.getElementById('locs').innerHTML=d.locations.map(function(l){
    return '<div class="loc'+(l.mapped?' on':'')+'" onclick="toggleLoc('+l.id+','+(l.mapped?0:1)+')">'+
      '<span class="d"></span><span class="n">'+esc(l.name.replace(/\s*\(.*\)/,''))+'</span></div>';
  }).join('');

  renderLeaks();
}

function renderLeaks(){
  var d=STATE,rows=d.findings.filter(function(f){return f.kind!=='strength';});
  var vis=SHOW_ALL?rows:rows.slice(0,5);
  document.getElementById('leaks').innerHTML=vis.map(function(f){
    var sev=(f.severity==='critical'||f.severity==='high')?'high':(f.severity==='medium'?'medium':'low');
    return '<div class="leak" onclick="toggleLeak('+f.id+')"><span class="sd '+sev+'"></span>'+
      '<span class="t">'+esc(f.title)+'</span>'+
      (f.capability?'<span class="bld"><span class="dot'+(f.capability_live?' lv':'')+'"></span><span class="n">'+esc(f.capability)+'</span></span>':'')+
      '</div><div class="leak-detail" id="ld-'+f.id+'">'+esc(f.detail||'')+(f.cost_hint?' · '+esc(f.cost_hint):'')+'</div>';
  }).join('');
  var more=document.getElementById('more');
  more.style.display=rows.length>5?'':'none';
  more.textContent=SHOW_ALL?'Show less':'Show all '+rows.length;
}
function toggleLeak(id){var el=document.getElementById('ld-'+id);if(el)el.classList.toggle('show');}
document.getElementById('more').onclick=function(){SHOW_ALL=!SHOW_ALL;renderLeaks();};

/* capture */
function logObs(){
  var inp=document.getElementById('obs'),go=document.getElementById('go');
  var text=inp.value.trim();if(!text)return;
  go.disabled=true;
  fetch('/api/audit/capture',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:text,location:document.getElementById('loc-sel').value||undefined})})
  .then(function(r){return r.json();})
  .then(function(d){go.disabled=false;if(!d.ok)return;inp.value='';showRead(text,d.analysis);render(d.state);})
  .catch(function(){go.disabled=false;});
}
function showRead(text,a){
  document.getElementById('read').classList.add('show');
  document.getElementById('read-f').textContent='“'+text+'”';
  var b=document.getElementById('read-b');
  if(a.capabilities&&a.capabilities.length){
    var c=a.capabilities[0],cat=(STATE.catalog.find(function(x){return x.id===c.id;})||{});
    b.style.display='';
    document.getElementById('read-bn').innerHTML='We build: '+esc(cat.name||c.id)+(cat.live?'<span class="lv">LIVE</span>':'');
    document.getElementById('read-bp').textContent=c.pitch||cat.what||'';
  }else{b.style.display='none';}
  var q=(a.questions||[])[0];
  document.getElementById('read-q').innerHTML=q?'<b>Ask next</b>'+esc(q):'';
}
document.getElementById('go').onclick=logObs;
document.getElementById('obs').addEventListener('keydown',function(e){if(e.key==='Enter')logObs();});

/* pillar drawer */
function openPillar(key){
  var d=STATE;if(!d)return;
  var p=d.pillars.find(function(x){return x.key===key;});
  var grp=function(t,items,fn){return '<div class="grp"><span class="micro">'+t+'</span>'+
    (items.length?items.map(fn).join(''):'<div class="none">Nothing mapped yet</div>')+'</div>';};
  document.getElementById('drawer-body').innerHTML=
    '<h3>'+esc(p.name)+'</h3><div class="pc">'+p.coverage+'% mapped · '+esc(p.tagline)+'</div>'+
    grp('Findings',d.findings.filter(function(x){return x.pillar_key===key;}),function(x){
      return '<div class="it"><b>'+esc(x.title)+'</b><span>'+esc(x.detail||'')+'</span></div>';})+
    grp('People',d.people.filter(function(x){return x.pillar_key===key;}),function(x){
      return '<div class="it"><b>'+esc(x.name)+'</b><span>'+esc(x.carries||x.role||'')+'</span></div>';})+
    grp('Systems',d.systems.filter(function(x){return x.pillar_key===key;}),function(x){
      return '<div class="it"><b>'+esc(x.name)+'</b><span>'+esc(x.gaps||x.truth_for||'')+'</span></div>';})+
    grp('Workflows',d.workflows.filter(function(x){return x.pillar_key===key;}),function(x){
      return '<div class="it"><b>'+esc(x.name)+'</b><span>'+esc(x.stalls?'Stalls: '+x.stalls:x.trigger_desc||'')+'</span></div>';});
  document.getElementById('drawer').classList.add('show');
  document.getElementById('veil').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('veil').classList.remove('show');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();document.getElementById('brief').classList.remove('show');}});

function toggleLoc(id,mapped){
  fetch('/api/audit/locations/'+id+'/mapped',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({mapped:!!mapped})}).then(load);
}

/* executive brief */
document.getElementById('brief-btn').onclick=function(){
  var btn=this;btn.disabled=true;btn.textContent='Assembling…';
  fetch('/api/audit/brief',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false;btn.textContent='Executive Brief';
    if(!d.ok)return;
    BRIEF_RAW=d.markdown;
    document.getElementById('brief-md').innerHTML=mdToHtml(d.markdown);
    document.getElementById('brief-note').textContent=d.engine==='operator-llm'?'Operator brain':'Rules engine';
    document.getElementById('brief').classList.add('show');
    document.getElementById('brief').scrollTop=0;
  }).catch(function(){btn.disabled=false;btn.textContent='Executive Brief';});
};
document.getElementById('brief-copy').onclick=function(){
  navigator.clipboard&&navigator.clipboard.writeText(BRIEF_RAW);
  this.textContent='Copied';var b=this;setTimeout(function(){b.textContent='Copy';},1500);
};
function mdToHtml(md){
  var html=esc(md);
  html=html.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  html=html.replace(/^---$/gm,'<hr>');
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>');
  html=html.replace(/^\d+\. (.*)$/gm,'<li>$1</li>').replace(/^- (.*)$/gm,'<li>$1</li>');
  html=html.replace(/🔴/g,'<span style="color:#E53935">●</span>').replace(/🟡/g,'<span style="color:#F5B81B">●</span>').replace(/⚪/g,'<span style="color:#5C6B7D">●</span>');
  return html.split(/\n{2,}/).map(function(b){return b.indexOf('<h')===0||b.indexOf('<hr')===0?b:'<p>'+b.replace(/\n/g,'<br>')+'</p>';}).join('');
}
load();
</script>
