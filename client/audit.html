<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit · 1st FP</title>
<link rel="stylesheet" href="/brand/brand.css" />
<style>
  /* ── THE COMMAND ROOM — the business as one radial system ─────────────
     Home: the wheel (his whole company at a glance). Click a department:
     left = the consult (one question at a time), right = the AI department
     assembling as he answers. Color is meaning: red signal, gold build, green live. */
  :root{
    --s0:#0C131D; --s1:#101927; --s2:#152134; --s3:#1B2A42;
    --ink:#E9EEF5; --ink-2:#8FA0B4; --ink-3:#5C6B7D;
    --hair:rgba(233,238,245,.08); --hair-2:rgba(233,238,245,.16);
    --red:#E53935; --gold:#F5B81B; --ok:#2E9E5B;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:var(--s2) var(--s0)}
  body{background:var(--s0);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1000px 480px at 50% -100px,rgba(229,57,53,.05),transparent 70%)}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 40px 90px}
  .micro{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
  .fadein{animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* top line */
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .top .id{display:flex;align-items:baseline;gap:14px}
  .top h1{font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
  .top .st{display:flex;align-items:center;gap:8px}
  .top .st .d{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .top .st.on .d{background:var(--ok);box-shadow:0 0 8px rgba(46,158,91,.6)}

  /* ══ HOME: THE WHEEL ══ */
  #home{}
  .wheel-zone{display:flex;justify-content:center;margin-top:34px}
  #wheel{width:min(680px,92vw);height:auto;display:block}
  .seg{fill:var(--s1);stroke:var(--s0);stroke-width:2.5;cursor:pointer;transition:fill .2s}
  .seg:hover{fill:var(--s2)}
  .seg-g:hover .seg{fill:var(--s2)}
  .seg-g{cursor:pointer}
  .seg-cov{fill:none;stroke:var(--red);stroke-width:2.5;pointer-events:none;transition:stroke-dashoffset .8s ease}
  .seg-name{fill:var(--ink);font-family:var(--sans);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;text-anchor:middle;pointer-events:none}
  .seg-pct{fill:var(--ink-3);font-family:var(--mono);font-size:10.5px;text-anchor:middle;pointer-events:none}
  .seg-dot{fill:var(--gold);pointer-events:none} .seg-dot.lv{fill:var(--ok)}
  .hub-ring{fill:var(--s1);stroke:var(--hair-2);stroke-width:1}
  .hub-t1{fill:var(--ink);font-family:var(--sans);font-weight:900;font-size:26px;letter-spacing:.04em;text-anchor:middle}
  .hub-t2{fill:var(--ink-3);font-family:var(--mono);font-size:8.5px;letter-spacing:.3em;text-anchor:middle}
  .hub-t3{fill:var(--ink);font-family:var(--sans);font-weight:800;font-size:30px;text-anchor:middle}
  .hub-t3 tspan{fill:var(--ink-2);font-size:15px;font-weight:700}
  .foot-act{margin-top:44px;display:flex;justify-content:center}
  .ghost{background:transparent;border:1px solid var(--hair-2);color:var(--ink);font-family:var(--sans);font-weight:700;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:16px 40px;cursor:pointer;transition:.2s}
  .ghost:hover{border-color:var(--red);background:rgba(229,57,53,.08)}
  .ghost:disabled{opacity:.4}

  /* ══ DEPARTMENT VIEW ══ */
  #dept{display:none}
  .d-head{display:flex;align-items:center;gap:20px;margin-top:30px}
  .back{background:transparent;border:1px solid var(--hair-2);color:var(--ink-2);width:40px;height:40px;cursor:pointer;font-size:17px;transition:.2s;flex:none}
  .back:hover{border-color:var(--red);color:var(--ink)}
  .d-head .nm{font-size:24px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .d-head .tg{font-size:13px;color:var(--ink-2);margin-top:5px;max-width:60ch}
  .d-head .pc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
  .split{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;margin-top:40px;align-items:start}

  /* left: the consult */
  .consult .micro{color:var(--red)}
  .qcard{background:var(--s1);border:1px solid var(--hair);border-left:2px solid var(--red);padding:26px 28px;margin-top:16px}
  .qcard .q{font-size:18px;font-weight:400;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{background:transparent;border:1px solid var(--hair-2);color:var(--ink-2);font-family:var(--sans);font-size:12.5px;
    padding:9px 14px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--gold);color:var(--ink)}
  .ansrow{display:flex;align-items:center;margin-top:18px;border-bottom:1px solid var(--hair-2);transition:border-color .25s}
  .ansrow:focus-within{border-color:var(--red)}
  #ans{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--sans);font-size:15.5px;padding:13px 4px;min-width:0}
  #ans::placeholder{color:var(--ink-3)} #ans:focus{outline:none}
  .icon-btn{background:transparent;border:none;color:var(--ink-3);cursor:pointer;padding:8px;display:flex}
  .icon-btn:hover{color:var(--ink)} .icon-btn.rec{color:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .icon-btn svg{width:19px;height:19px}
  #send-a{color:var(--red)}
  .qlog{margin-top:26px}
  .qlog .item{padding:10px 0;border-bottom:1px solid var(--hair);font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .qlog .item b{color:var(--ink-2);font-weight:600;display:block;font-size:12px}
  .skip{background:transparent;border:none;color:var(--ink-3);font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:14px;padding:4px 0}
  .skip:hover{color:var(--ink-2)}

  /* right: the assembly */
  .assembly{position:sticky;top:24px}
  #net{width:100%;height:auto;display:block}
  .n-line{stroke:var(--hair-2);stroke-width:1;transition:stroke .4s}
  .n-line.on{stroke:rgba(245,184,27,.5)}
  .n-core{fill:var(--s2);stroke:var(--hair-2);stroke-width:1}
  .n-core-t{fill:var(--ink);font-family:var(--sans);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-anchor:middle}
  .n-core-s{fill:var(--ink-3);font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;text-anchor:middle}
  .n-node{fill:var(--s1);stroke:var(--hair-2);stroke-width:1;transition:all .4s}
  .n-node.on{stroke:var(--gold);fill:var(--s2)}
  .n-node.lv{stroke:var(--ok)}
  .n-nt{fill:var(--ink-2);font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase;text-anchor:middle;transition:fill .4s}
  .n-nt.on{fill:var(--ink)}
  .n-dot{fill:var(--ink-3);transition:fill .4s} .n-dot.on{fill:var(--gold)} .n-dot.lvd{fill:var(--ok)}
  .n-sys{fill:var(--ink-3);font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;text-anchor:middle}
  .readout{border:1px solid var(--hair);background:var(--s1);padding:20px 24px;margin-top:18px}
  .readout .role{font-size:13.5px;color:var(--ink-2);line-height:1.6;padding-bottom:16px;border-bottom:1px solid var(--hair)}
  .agent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
  .agent-row:last-of-type{border-bottom:none}
  .agent-row .ad{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none;transition:background .4s}
  .agent-row.on .ad{background:var(--gold);box-shadow:0 0 7px rgba(245,184,27,.5)}
  .agent-row.lv .ad{background:var(--ok);box-shadow:0 0 7px rgba(46,158,91,.5)}
  .agent-row .an{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .agent-row .aw{font-size:12.5px;color:var(--ink-3);flex:1;line-height:1.45}
  .agent-row .at{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap}
  .agent-row.lv .at{color:var(--ok)}
  .buildline{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
  .buildline .n{font-size:22px;font-weight:800}
  .buildline .n small{font-size:12px;color:var(--ink-3);font-weight:400}

  @media (max-width:900px){
    .wrap{padding:28px 20px 70px}
    .split{grid-template-columns:1fr;gap:34px}
    .assembly{position:static}
    .seg-name{font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="id"><h1>Audit</h1><span class="micro" id="top-sub">Enterprise Discovery</span></div>
    <div class="st" id="st"><span class="d"></span><span class="micro" id="st-t">Rules Engine</span></div>
  </header>

  <!-- ══ HOME ══ -->
  <div id="home">
    <div class="wheel-zone"><svg id="wheel" viewBox="0 0 720 720"></svg></div>
    <div class="foot-act"><button class="ghost" id="brief-btn">Executive Brief</button></div>
  </div>

  <!-- ══ DEPARTMENT ══ -->
  <div id="dept">
    <div class="d-head">
      <button class="back" onclick="goHome()">‹</button>
      <div><div class="nm" id="d-nm"></div><div class="tg" id="d-tg"></div></div>
      <span class="pc" id="d-pc"></span>
    </div>
    <div class="split">
      <div class="consult">
        <span class="micro" id="q-count">The consult</span>
        <div class="qcard">
          <div class="q" id="q-text"></div>
          <div class="chips" id="q-chips"></div>
        </div>
        <div class="ansrow">
          <input id="ans" placeholder="Answer in his words — or tap an option above" autocomplete="off" />
          <button class="icon-btn" id="mic" title="Dictate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg></button>
          <button class="icon-btn" id="send-a" title="Log answer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <button class="skip" id="skip">Skip question ›</button>
        <div class="qlog" id="qlog"></div>
      </div>
      <div class="assembly">
        <svg id="net" viewBox="0 0 520 380"></svg>
        <div class="readout">
          <div class="role" id="d-role"></div>
          <div id="agent-rows"></div>
          <div class="buildline">
            <span class="micro">This department, standing up</span>
            <span class="n" id="build-n"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- brief overlay -->
<div id="brief" style="position:fixed;inset:0;background:var(--s0);z-index:60;display:none;overflow-y:auto">
  <div style="max-width:660px;margin:0 auto;padding:70px 40px 110px">
    <div style="display:flex;gap:22px;align-items:center;margin-bottom:44px">
      <button class="ghost" id="brief-copy">Copy</button>
      <button class="ghost" onclick="document.getElementById('brief').style.display='none'">Close</button>
      <span class="micro" id="brief-note"></span>
    </div>
    <div id="brief-md"></div>
  </div>
</div>
<style>
  #brief-md{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
  #brief-md h1{font-size:26px;font-weight:900;text-transform:uppercase;color:var(--ink);margin-bottom:16px;line-height:1.2}
  #brief-md h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin:40px 0 14px}
  #brief-md li{margin:0 0 12px 18px}
  #brief-md strong{color:var(--ink);font-weight:700}
  #brief-md em{color:var(--ink-3)}
  #brief-md hr{border:none;border-top:1px solid var(--hair);margin:30px 0}
  #brief-md p{margin-bottom:10px}
</style>

<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var STATE=null,BRIEF_RAW='',SHOW_ALL=false;
var CUR=null;        // current department key
var DECK=[],QI=0;    // question deck + index
var ANSWERED={};     // per-dept answered count
var ACTIVATED={};    // per-dept Set of activated agent indices

/* ───────── data ───────── */
function load(){return fetch('/api/audit').then(function(r){return r.json();}).then(function(d){STATE=d;renderHome();if(CUR)renderAssembly();return d;});}

/* ───────── home: the wheel ───────── */
function P(cx,cy,r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r0,r1,a0,a1){
  var p0=P(cx,cy,r1,a0),p1=P(cx,cy,r1,a1),p2=P(cx,cy,r0,a1),p3=P(cx,cy,r0,a0);
  var lg=(a1-a0)>Math.PI?1:0;
  return 'M'+p0[0]+' '+p0[1]+' A'+r1+' '+r1+' 0 '+lg+' 1 '+p1[0]+' '+p1[1]+
         ' L'+p2[0]+' '+p2[1]+' A'+r0+' '+r0+' 0 '+lg+' 0 '+p3[0]+' '+p3[1]+' Z';
}
function covArc(cx,cy,r,a0,a1,frac){
  if(frac<=0)return '';
  var a2=a0+(a1-a0)*Math.min(1,frac);
  var p0=P(cx,cy,r,a0),p1=P(cx,cy,r,a2);
  var lg=(a2-a0)>Math.PI?1:0;
  return 'M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 '+lg+' 1 '+p1[0]+' '+p1[1];
}
function splitName(n){
  if(n.length<=13)return [n];
  var w=n.split(' ');if(w.length===1)return [n];
  var a=w.shift(),line1=a;
  while(w.length&&(line1+' '+w[0]).length<=13)line1+=' '+w.shift();
  return [line1,w.join(' ')];
}
function renderWheel(){
  var d=STATE,svg=document.getElementById('wheel');
  var cx=360,cy=360,R=346,R0=168,n=d.departments.length;
  var start=-Math.PI/2, span=2*Math.PI/n, html='';
  d.departments.forEach(function(dep,i){
    var p=d.pillars.find(function(x){return x.key===dep.key;})||{coverage:0,capabilities:[]};
    var a0=start+i*span, a1=a0+span, mid=(a0+a1)/2;
    var lp=P(cx,cy,(R0+R)/2+4,mid);
    var lines=splitName(dep.wheel.toUpperCase());
    var yTop=lp[1]-(lines.length>1?16:8);
    var label=lines.map(function(ln,li){
      return '<text class="seg-name" x="'+lp[0]+'" y="'+(yTop+li*17)+'">'+esc(ln)+'</text>';
    }).join('');
    var yPct=yTop+lines.length*17+4;
    var caps=p.capabilities||[],dots='';
    caps.slice(0,4).forEach(function(c,ci){
      var dx=lp[0]-((Math.min(caps.length,4)-1)*10)/2+ci*10;
      dots+='<circle class="seg-dot'+(c.live?' lv':'')+'" cx="'+dx+'" cy="'+(yPct+15)+'" r="3"><title>'+esc(c.name)+'</title></circle>';
    });
    html+='<g class="seg-g" data-key="'+dep.key+'">'+
      '<path class="seg" d="'+arcPath(cx,cy,R0,R,a0,a1)+'"><title>'+esc(dep.name)+'</title></path>'+
      '<path class="seg-cov" d="'+covArc(cx,cy,R-6,a0+.03,a1-.03,(p.coverage||0)/100)+'"/>'+
      label+
      '<text class="seg-pct" x="'+lp[0]+'" y="'+yPct+'">'+(p.coverage||0)+'%</text>'+
      dots+
      '</g>';
  });
  // hub
  html+='<circle class="hub-ring" cx="'+cx+'" cy="'+cy+'" r="'+(R0-14)+'"/>'+
    '<text class="hub-t2" x="'+cx+'" y="'+(cy-34)+'">1ST FIRE PROTECTION</text>'+
    '<text class="hub-t1" x="'+cx+'" y="'+(cy-2)+'">AI OS</text>'+
    '<text class="hub-t3" x="'+cx+'" y="'+(cy+44)+'">'+STATE.metrics.coverage+'<tspan>%</tspan></text>'+
    '<text class="hub-t2" x="'+cx+'" y="'+(cy+66)+'">MAPPED</text>';
  svg.innerHTML=html;
  svg.querySelectorAll('.seg-g').forEach(function(g){
    g.addEventListener('click',function(){openDept(g.getAttribute('data-key'));});
  });
}
function renderHome(){
  var d=STATE;
  var st=document.getElementById('st');
  if(d.brain){st.classList.add('on');document.getElementById('st-t').textContent='Operator Brain';}
  else{st.classList.remove('on');document.getElementById('st-t').textContent='Rules Engine';}
  renderWheel();
}
/* ───────── department view ───────── */
function dep(){return STATE.departments.find(function(x){return x.key===CUR;});}
function openDept(key){
  CUR=key;
  var d=dep();if(!d)return;
  if(!ACTIVATED[key])ACTIVATED[key]=[];
  if(!ANSWERED[key])ANSWERED[key]=0;
  DECK=d.questions.slice();QI=Math.min(ANSWERED[key],DECK.length-1);
  document.getElementById('home').style.display='none';
  var dv=document.getElementById('dept');dv.style.display='block';dv.classList.remove('fadein');void dv.offsetWidth;dv.classList.add('fadein');
  document.getElementById('top-sub').textContent='Audit · '+d.name;
  document.getElementById('d-nm').textContent=d.name;
  document.getElementById('d-tg').textContent=d.tagline;
  document.getElementById('d-role').textContent=d.aiRole;
  document.getElementById('qlog').innerHTML='';
  renderQuestion();
  renderAssembly();
  window.scrollTo(0,0);
}
function goHome(){
  CUR=null;
  document.getElementById('dept').style.display='none';
  var h=document.getElementById('home');h.style.display='block';h.classList.remove('fadein');void h.offsetWidth;h.classList.add('fadein');
  document.getElementById('top-sub').textContent='Enterprise Discovery';
  load();
}
function renderQuestion(){
  var d=dep(),qc=document.getElementById('q-count');
  if(QI>=DECK.length){
    qc.textContent='Consult complete — '+ANSWERED[CUR]+' answered';
    document.getElementById('q-text').textContent='Department mapped. Anything else he said worth logging?';
    document.getElementById('q-chips').innerHTML='';
    return;
  }
  var q=DECK[QI];
  qc.textContent='The consult · '+(QI+1)+' of '+DECK.length;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('q-chips').innerHTML=(q.chips||[]).map(function(c){
    return '<button class="chip">'+esc(c)+'</button>';
  }).join('');
  document.querySelectorAll('#q-chips .chip').forEach(function(b){
    b.addEventListener('click',function(){var i=document.getElementById('ans');i.value=b.textContent;i.focus();});
  });
}
function sendAnswer(){
  var inp=document.getElementById('ans'),text=inp.value.trim();
  if(!text)return;
  var q=QI<DECK.length?DECK[QI].q:'(open note)';
  var payload=q==='(open note)'?text:q+' — '+text;
  inp.value='';
  // log it
  var log=document.getElementById('qlog');
  log.insertAdjacentHTML('afterbegin','<div class="item"><b>'+esc(text)+'</b>'+esc(q!=='(open note)'?q:'')+'</div>');
  ANSWERED[CUR]++;QI++;
  activateNext();
  renderQuestion();
  fetch('/api/audit/capture',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({text:payload,department:CUR})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok)return;
    STATE=d.state;
    // adaptive follow-up from the operator slots in next
    var qs=(d.analysis.questions||[]).filter(function(x){
      return !DECK.some(function(dq){return dq.q===x;});
    });
    if(qs.length&&QI<=DECK.length)DECK.splice(QI,0,{q:qs[0],chips:[]});
    // matched capabilities light their agents
    (d.analysis.capabilities||[]).forEach(function(c){activateByCapability(c.id);});
    renderQuestion();
    renderAssembly();
  });
}
document.getElementById('send-a').onclick=sendAnswer;
document.getElementById('ans').addEventListener('keydown',function(e){if(e.key==='Enter')sendAnswer();});
document.getElementById('skip').onclick=function(){if(QI<DECK.length){QI++;renderQuestion();}};

/* dictation */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
document.getElementById('mic').onclick=function(){
  var btn=this;
  if(!SR)return;
  if(rec){rec.stop();return;}
  rec=new SR();rec.lang='en-US';rec.interimResults=false;
  rec.onstart=function(){btn.classList.add('rec');};
  rec.onresult=function(e){document.getElementById('ans').value=e.results[0][0].transcript;};
  rec.onend=function(){btn.classList.remove('rec');rec=null;};
  rec.start();
};

/* activation model: each answer assembles one more agent; capability matches jump theirs on */
function activateNext(){
  var d=dep(),act=ACTIVATED[CUR];
  for(var i=0;i<d.agents.length;i++){
    if(act.indexOf(i)<0){act.push(i);return;}
  }
}
function activateByCapability(capId){
  var d=dep(),act=ACTIVATED[CUR];
  d.agents.forEach(function(a,i){
    if(a.capability_id===capId&&act.indexOf(i)<0)act.push(i);
  });
}

/* the assembly: dept-AI core + agent nodes + systems, lighting up */
function renderAssembly(){
  if(!CUR)return;
  var d=dep(),act=ACTIVATED[CUR]||[];
  var p=(STATE.pillars.find(function(x){return x.key===CUR;})||{coverage:0});
  document.getElementById('d-pc').textContent=p.coverage+'% MAPPED';
  var cx=260,cy=178,html='';
  var n=d.agents.length,spread=Math.min(Math.PI*.9,n*.75),a0=-Math.PI/2-spread/2+(spread/n)/2;
  var W=150,H=44,R=112;
  // lines first
  d.agents.forEach(function(a,i){
    var ang=a0+i*(spread/n),pos=P(cx,cy,R+30,ang);
    html+='<line class="n-line'+(act.indexOf(i)>=0?' on':'')+'" x1="'+cx+'" y1="'+cy+'" x2="'+pos[0]+'" y2="'+pos[1]+'"/>';
  });
  // system anchors below
  d.systems.forEach(function(s,i){
    var sx=cx-((d.systems.length-1)*150)/2+i*150,sy=cy+152;
    html+='<line class="n-line on" x1="'+cx+'" y1="'+(cy+26)+'" x2="'+sx+'" y2="'+(sy-12)+'"/>'+
      '<text class="n-sys" x="'+sx+'" y="'+sy+'">'+esc(s)+'</text>';
  });
  // agent nodes
  d.agents.forEach(function(a,i){
    var ang=a0+i*(spread/n),pos=P(cx,cy,R+30,ang);
    var on=act.indexOf(i)>=0,lv=a.live;
    html+='<g>'+
      '<rect class="n-node'+(on?' on':'')+(lv?' lv':'')+'" x="'+(pos[0]-W/2)+'" y="'+(pos[1]-H/2)+'" width="'+W+'" height="'+H+'"/>'+
      '<circle class="n-dot'+(on?' on':'')+(lv?' lvd':'')+'" cx="'+(pos[0]-W/2+14)+'" cy="'+pos[1]+'" r="3.5"/>'+
      '<text class="n-nt'+(on?' on':'')+'" x="'+(pos[0]+7)+'" y="'+(pos[1]+3.5)+'">'+esc(a.name)+'</text>'+
      '</g>';
  });
  // core
  html+='<g><circle class="n-core" cx="'+cx+'" cy="'+cy+'" r="46"/>'+
    '<text class="n-core-t" x="'+cx+'" y="'+(cy-2)+'">'+esc(d.wheel.split(' ')[0])+'</text>'+
    '<text class="n-core-s" x="'+cx+'" y="'+(cy+15)+'">AI DEPT</text></g>';
  document.getElementById('net').innerHTML=html;

  // readout rows
  document.getElementById('agent-rows').innerHTML=d.agents.map(function(a,i){
    var on=act.indexOf(i)>=0;
    return '<div class="agent-row'+(on?' on':'')+(a.live?' lv':'')+'">'+
      '<span class="ad"></span><span class="an">'+esc(a.name)+'</span>'+
      '<span class="aw">'+esc(a.what)+'</span>'+
      '<span class="at">'+(a.live?'LIVE NOW':'~'+a.weeks+'W')+'</span></div>';
  }).join('');
  var activeWeeks=d.agents.reduce(function(s,a,i){return s+((act.indexOf(i)>=0&&!a.live)?a.weeks:0);},0);
  var liveCount=d.agents.filter(function(a){return a.live;}).length;
  var actCount=(act||[]).length;
  document.getElementById('build-n').innerHTML=
    (liveCount?liveCount+'<small> live</small> · ':'')+actCount+'<small> of '+d.agents.length+' assembled</small>'+
    (activeWeeks?' · ~'+activeWeeks+'<small> weeks</small>':'');
}

/* ───────── brief ───────── */
document.getElementById('brief-btn').onclick=function(){
  var btn=this;btn.disabled=true;btn.textContent='Assembling…';
  fetch('/api/audit/brief',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false;btn.textContent='Executive Brief';
    if(!d.ok)return;
    BRIEF_RAW=d.markdown;
    document.getElementById('brief-md').innerHTML=mdToHtml(d.markdown);
    document.getElementById('brief-note').textContent=d.engine==='operator-llm'?'Operator brain':'Rules engine';
    var b=document.getElementById('brief');b.style.display='block';b.scrollTop=0;
  }).catch(function(){btn.disabled=false;btn.textContent='Executive Brief';});
};
document.getElementById('brief-copy').onclick=function(){
  navigator.clipboard&&navigator.clipboard.writeText(BRIEF_RAW);
  this.textContent='Copied';var b=this;setTimeout(function(){b.textContent='Copy';},1500);
};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('brief').style.display='none';if(CUR)goHome();}});
function mdToHtml(md){
  var html=esc(md);
  html=html.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  html=html.replace(/^---$/gm,'<hr>');
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>');
  html=html.replace(/^\d+\. (.*)$/gm,'<li>$1</li>').replace(/^- (.*)$/gm,'<li>$1</li>');
  html=html.replace(/🔴/g,'<span style="color:#E53935">●</span>').replace(/🟡/g,'<span style="color:#F5B81B">●</span>').replace(/⚪/g,'<span style="color:#5C6B7D">●</span>');
  return html.split(/\n{2,}/).map(function(b){return b.indexOf('<h')===0||b.indexOf('<hr')===0?b:'<p>'+b.replace(/\n/g,'<br>')+'</p>';}).join('');
}
load();
</script>
