<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exceptions · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<style>
  .ex{border:1px solid var(--border);border-left-width:4px;border-radius:12px;background:var(--panel);padding:14px 15px;margin-bottom:10px}
  .ex.critical{border-left-color:#b3261e}.ex.high{border-left-color:var(--os-bad)}.ex.medium{border-left-color:var(--os-warn)}.ex.low{border-left-color:var(--os-neutral)}
  .ex .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .ex .t{font-weight:750;font-size:14.5px;color:var(--ink);line-height:1.3}
  .ex .d{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:4px}
  .ex .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .ex .acts{display:flex;gap:6px;flex:none;position:relative}
  .ex .acts button{font-weight:700;font-size:11.5px;border-radius:8px;padding:6px 11px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--ink-2)}
  .ex .acts .open{background:var(--os-accent);color:#fff;border-color:transparent}
  .menu{position:absolute;top:36px;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:5;min-width:190px;overflow:hidden}
  .menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:var(--panel);padding:9px 13px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
  .menu button:hover{background:var(--fill)}
  .ofc{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
  .ofc .nm{font-weight:650;font-size:13px;color:var(--ink-2)}
  .ofc .track{height:14px;background:var(--fill);border-radius:7px;overflow:hidden}
  .ofc .fill{height:100%;background:var(--os-bad);border-radius:7px}
  .ofc .amt{font-weight:700;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div><h1 id="title">Exceptions</h1><div class="os-q">Where reality does not match the intended process.</div></div>
      <button class="os-fb" id="refresh">↻ Re-scan</button>
    </div>
    <div class="os-kpis" id="kpis" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
    <div class="os-filters" style="margin:18px 0 4px">
      <button class="os-fb on" data-view="issue">By issue</button>
      <button class="os-fb" data-view="office">By office</button>
      <span style="width:12px"></span>
      <span id="ownerFilters" class="os-filters"></span>
    </div>
    <div id="body"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var view='issue';
var ownerFilter=(new URLSearchParams(location.search).get('owner'))||'';
var OWNERS=[['','All owners'],['operations','Operations'],['accounting','Accounting'],['it','IT'],['people','People'],['safety','Safety']];
var CAT_TAB={deficiency_aging:'deficiencies',terminated_access:'people',ar_aging:'receivables',handoff_missing_office:'jobs',handoff_missing_contact:'jobs'};
var RESOLUTIONS=[['fixed','resolved','Fixed'],['source_corrected','resolved','Source corrected'],['accepted_exception','ignored','Accepted exception'],['false_positive','dismissed','False positive'],['dismissed','dismissed','Dismiss']];

function officeParam(){var o=OS.office();return o&&o!=='all'?('&office='+encodeURIComponent(o)):'';}
function renderOwners(){ document.getElementById('ownerFilters').innerHTML=OWNERS.map(function(o){
  return '<button class="os-fb'+(o[0]===ownerFilter?' on':'')+'" data-owner="'+o[0]+'">'+OS.esc(o[1])+'</button>'; }).join(''); }
function loadSummary(){
  fetch('/api/exceptions/summary').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)return; var s=d.summary;
    document.getElementById('kpis').innerHTML=[
      ['Open',s.open],['Financial impact',OS.money(s.financialImpact)],['Overdue',s.overdue||0],['Resolved (30d)',s.resolvedRecently||0]
    ].map(function(c){return '<div class="os-kpi"><div class="lab">'+c[0]+'</div><div class="val">'+c[1]+'</div></div>';}).join('');
    window.__byOffice=s.byOffice||{};
  });
}
function load(){
  loadSummary();
  var body=document.getElementById('body');
  var url='/api/exceptions?status=open'+officeParam()+(ownerFilter?('&owner='+ownerFilter):'');
  fetch(url).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){body.innerHTML=OS.errorBox('Could not load.');return;}
    if(!d.exceptions.length){body.innerHTML=OS.empty('No open exceptions'+(ownerFilter?(' for '+ownerFilter):'')+'. Clean.','✓');return;}
    if(view==='office'){ renderByOffice(d.exceptions); } else { body.innerHTML=d.exceptions.map(exCard).join(''); }
  }).catch(function(){body.innerHTML=OS.errorBox('Could not load.');});
}
function exCard(e){
  var impact=e.financial_impact>0?'<span class="os-tag" style="background:var(--os-warn-bg);color:var(--os-warn)">'+(e.financial_projected?'~':'')+OS.money(e.financial_impact)+(e.financial_projected?' projected':'')+'</span>':'';
  var tab=CAT_TAB[e.category]||'';
  var openBtn=tab?'<button class="open" data-tab="'+OS.esc(tab)+'"'+(e.office?' data-office="'+OS.esc(e.office)+'"':'')+'>Open</button>':'';
  return '<div class="ex '+OS.esc(e.severity)+'" data-id="'+e.id+'"><div class="h"><div><div class="t">'+OS.esc(e.title)+'</div>'+
    '<div class="d">'+OS.esc(e.description||'')+'</div></div><div class="acts">'+openBtn+
    '<button class="resolve" data-id="'+e.id+'">Resolve ▾</button></div></div>'+
    '<div class="tags">'+OS.ownerTag(e.owner_team||'')+OS.officeTag(e.officeLabel||'')+OS.pill(e.severity, e.severity==='critical'||e.severity==='high'?'bad':e.severity==='medium'?'warn':'neutral')+
    '<span class="os-tag">'+OS.esc(e.source_system||'')+'</span>'+impact+'</div></div>';
}
function renderByOffice(items){
  var by=window.__byOffice||{}; var keys=Object.keys(by);
  if(!keys.length){document.getElementById('body').innerHTML=OS.empty('No open exceptions.');return;}
  var max=Math.max.apply(null,keys.map(function(k){return by[k].count;}))||1;
  document.getElementById('body').innerHTML='<div class="os-tablewrap" style="padding:10px 16px">'+keys.sort(function(a,b){return by[b].count-by[a].count;}).map(function(k){
    var o=by[k];
    return '<div class="ofc" data-office="'+OS.esc(k==='__company__'?'':k)+'"><span class="nm">'+OS.esc(o.label)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.round((o.count/max)*100)+'%"></span></span>'+
      '<span class="amt">'+o.count+(o.impact?(' · '+OS.money(o.impact)):'')+'</span></div>';
  }).join('')+'</div>';
}
function setStatus(id,status,reason){
  fetch('/api/exceptions/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:status,note:reason})})
    .then(function(r){return r.json();}).then(function(){load();}).catch(function(){});
}
function closeMenus(){ document.querySelectorAll('.menu').forEach(function(m){m.remove();}); }
document.addEventListener('click',function(e){
  var v=e.target.closest('[data-view]'); if(v){ view=v.getAttribute('data-view'); [].forEach.call(document.querySelectorAll('[data-view]'),function(x){x.classList.toggle('on',x===v);}); load(); return; }
  var o=e.target.closest('[data-owner]'); if(o){ ownerFilter=o.getAttribute('data-owner'); renderOwners(); load(); return; }
  if(e.target.closest('#refresh')){ fetch('/api/exceptions/detect',{method:'POST'}).then(function(){load();}); return; }
  var rez=e.target.closest('.resolve'); if(rez){ e.stopPropagation(); closeMenus();
    var id=rez.getAttribute('data-id'); var menu=document.createElement('div'); menu.className='menu';
    menu.innerHTML=RESOLUTIONS.map(function(r){return '<button data-reason="'+r[0]+'" data-status="'+r[1]+'" data-id="'+id+'">'+r[2]+'</button>';}).join('');
    rez.parentNode.appendChild(menu); return; }
  var pick=e.target.closest('[data-reason]'); if(pick){ setStatus(pick.getAttribute('data-id'),pick.getAttribute('data-status'),pick.getAttribute('data-reason')); closeMenus(); return; }
  var ofc=e.target.closest('.ofc[data-office]'); if(ofc){ var off=ofc.getAttribute('data-office'); if(off){OS.go('deficiencies',{office:off});} return; }
  closeMenus();
});
OS.ready(function(){ renderOwners(); load(); });
OS.onChange(load);
</script>
</body>
</html>
