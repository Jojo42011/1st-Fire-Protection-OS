<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your team · 1st FP</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  .screen{max-width:none}
  .tm-strip{display:flex;align-items:center;gap:26px}
  .tm-strip .fig .v{font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
  .tm-strip .fig .l{font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
  .tm-strip p{flex:1;margin:0;font-weight:500;font-size:12.5px;line-height:1.6;color:var(--ink-3);max-width:60ch}
  .tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tm-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-card);padding:17px 18px;box-shadow:var(--sh-rest)}
  .tm-card .hd{display:flex;align-items:flex-start;gap:11px}
  .tm-card .mono34{width:34px;height:34px;border-radius:10px;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
  .tm-card .nm{font-weight:800;font-size:13.5px;color:var(--ink)}
  .tm-card .rl{font-weight:500;font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px}
  .tm-card .foot{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--divider-soft)}
  .tm-card .stat{font-weight:800;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .tm-card .stat-l{font-weight:500;font-size:11.5px;color:var(--muted)}
  .tm-card .open{font-weight:600;font-size:11.5px;color:var(--indigo);background:none;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="screen view" id="root">
  <div class="card card-pad tm-strip" id="strip"></div>
  <div class="tm-grid" id="grid"></div>
</div>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nav(tab){try{window.parent.postMessage({type:'app-navigate',tab:tab},'*');}catch(e){}}

/* workstream tint + where "Open" goes, by agent key (founding agents) with a fallback. */
var TINT={
  calls:['var(--green-bg)','var(--green)'], reception:['var(--green-bg)','var(--green)'],
  invoices:['var(--money-bg)','var(--money)'], finance:['var(--money-bg)','var(--money)'],
  reviews:['var(--amber-bg)','var(--amber-ink)'],
  licenses:['var(--indigo-bg-2)','var(--indigo)'],
  audit:['var(--indigo-bg-2)','var(--indigo)'], operator:['var(--indigo-bg-2)','var(--indigo)']
};
var OPEN={calls:'phones',invoices:'money',reviews:'reviews',licenses:'spend',audit:'operator',operator:'operator'};
/* headline stat for the founding agents (shell figures matching the design). */
var STAT={
  calls:['41','calls today'], invoices:['$96,420','collected this month'],
  reviews:['+14','reviews this month'], licenses:['$18,240','recovered']
};
var FALLBACK_TINTS=[['var(--green-bg)','var(--green)'],['var(--money-bg)','var(--money)'],['var(--amber-bg)','var(--amber-ink)'],['var(--indigo-bg-2)','var(--indigo)']];
function initials(name){return String(name||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase()||'?';}
function isBuilding(s){return ['building','in_progress','draft','proposed','pending'].indexOf(String(s||'').toLowerCase())>=0;}

fetch('/api/roster').then(function(r){return r.json();}).then(function(d){
  var agents=(d.agents||[]);
  var building=agents.filter(function(a){return isBuilding(a.status);}).length;
  var built=agents.length-building;
  document.getElementById('strip').innerHTML=
    '<div class="fig"><div class="v" style="color:var(--ink)">'+agents.length+'</div><div class="l">agents working</div></div>'+
    '<div class="fig"><div class="v" style="color:var(--green)">'+built+'</div><div class="l">built for you</div></div>'+
    '<div class="fig"><div class="v" style="color:var(--indigo)">'+building+'</div><div class="l">in progress</div></div>'+
    '<p>Every agent is one job, one department, one owner. When you describe a gap, the Operator finds it, the Harness builds it, and it shows up here — already wired to your data.</p>'+
    '<button class="btn-accent" id="hire">Hire a new agent</button>';
  document.getElementById('hire').onclick=function(){nav('hire');};

  document.getElementById('grid').innerHTML=agents.map(function(a,i){
    var t=TINT[a.key]||FALLBACK_TINTS[i%FALLBACK_TINTS.length];
    var b=isBuilding(a.status);
    var st=b?['Building','var(--indigo)','var(--indigo-bg-2)']:['Live','var(--green)','var(--green-bg)'];
    var stat=STAT[a.key]||(b?['Building','']:['Active','']);
    var openTab=OPEN[a.key]||'operator';
    return '<div class="tm-card">'+
      '<div class="hd"><span class="mono34" style="background:'+t[0]+';color:'+t[1]+'">'+esc(initials(a.name))+'</span>'+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(a.name)+'</div><div class="rl">'+esc(a.role||'')+'</div></div>'+
      '<span class="pill" style="color:'+st[1]+';background:'+st[2]+'">'+st[0]+'</span></div>'+
      '<div class="foot"><span class="stat">'+esc(stat[0])+'</span><span class="stat-l">'+esc(stat[1])+'</span>'+
      '<span style="flex:1"></span><button class="open" data-open="'+esc(openTab)+'">Open</button></div></div>';
  }).join('');
  document.querySelectorAll('.tm-card .open').forEach(function(b){b.onclick=function(){nav(b.getAttribute('data-open'));};});
}).catch(function(){
  document.getElementById('grid').innerHTML='<div class="card card-pad" style="color:var(--muted)">Roster unavailable.</div>';
});
</script>
</body>
</html>
