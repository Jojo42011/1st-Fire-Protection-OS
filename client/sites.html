<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sites · Northstar</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/list-view.css" />
<style>
  .screen{max-width:none}
  .st-name{font-weight:700;font-size:13px;color:var(--ink)}
  .st-addr{font-weight:500;font-size:11.5px;color:var(--muted);margin-top:1px}
  .st-acct{font-weight:600;font-size:12.5px;color:var(--indigo)}
</style>
</head>
<body>
<div class="screen view" id="root"></div>
<script src="/list-view.js"></script>
<script>
var esc=ListView.esc;
function nav(id){ if(id==null)return; try{window.parent.postMessage({type:'app-navigate',tab:'account',param:'id='+id},'*');}catch(e){} }

ListView({
  mount:document.getElementById('root'),
  endpoint:'/api/sites', dataKey:'sites', noun:'sites',
  searchPlaceholder:'Search sites or addresses…',
  filters:[['all','All'],['linked','Linked to account'],['addressed','Has address']],
  defaultSort:'name', sortDefaults:{name:'asc'},
  onRow:function(s){ nav(s.accountId); },
  columns:[
    { label:'Site', sort:'name', cell:function(s){
        return '<div class="st-name">'+esc(s.name)+'</div>'+(s.address?'<div class="st-addr">'+esc(s.address)+'</div>':''); } },
    { label:'Account', cell:function(s){ return '<span class="st-acct">'+esc(s.account)+'</span>'; } },
    { label:'System', cell:function(s){ return s.system?'<span style="color:var(--muted)">'+esc(s.system)+'</span>':'<span style="color:var(--faint)">—</span>'; } },
    { label:'Next service', cell:function(s){ return '<span style="color:var(--muted)">'+esc(s.next)+'</span>'; } },
    { label:'', align:'right', cell:function(){ return '<span class="lv-open">Open →</span>'; } }
  ]
});
</script>
</body>
</html>
