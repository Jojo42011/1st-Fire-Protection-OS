<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sites · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<style>.search{width:100%;max-width:420px;font-family:var(--sans);font-weight:600;font-size:13.5px;border:1px solid var(--border);border-radius:10px;padding:10px 13px;background:var(--panel);color:var(--ink)}</style>
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div><h1>Sites</h1><div class="os-q">Every service location, searchable.</div></div>
    </div>
    <input class="search" id="q" type="search" placeholder="Search sites…" />
    <div id="list" style="margin-top:14px"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var t=null;
function load(){
  var q=document.getElementById('q').value.trim();
  fetch('/api/sites?pageSize=100'+(q?('&q='+encodeURIComponent(q)):'')).then(function(r){return r.json();}).then(function(d){
    var sites=d.sites||[];
    if(!sites.length){document.getElementById('list').innerHTML=OS.empty(d.live===false?'Connect ServiceTrade to see live sites.':'No sites match.');return;}
    var cols=[
      {as:'name',label:'Site',strong:true},
      {as:'account',label:'Account'},
      {as:'address',label:'Address',render:function(v){return OS.esc(v||'');}},
      {as:'next',label:'Next visit',render:function(v){return OS.esc(v||'');}}
    ];
    document.getElementById('list').innerHTML=OS.table(cols, sites,{});
  }).catch(function(){document.getElementById('list').innerHTML=OS.errorBox('Could not load sites.');});
}
document.getElementById('q').addEventListener('input',function(){clearTimeout(t);t=setTimeout(load,250);});
OS.ready(load);
</script>
</body>
</html>
