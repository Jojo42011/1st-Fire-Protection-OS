<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · 1st Fire Protection</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px}

  /* the sign-in surface: an ink brand panel beside a white form, one hairline card */
  .auth{width:100%;max-width:900px;min-height:520px;display:grid;grid-template-columns:0.9fr 1.1fr;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}

  /* left: the brand lockup on ink */
  .brandpane{background:#101828;color:#fff;padding:40px 38px;display:flex;flex-direction:column;justify-content:space-between}
  .lockup{display:flex;flex-direction:column;gap:18px}
  .signet{width:56px;height:56px;border-radius:13px;background:#fff;color:#101828;font-weight:600;font-size:32px;
    letter-spacing:-.06em;display:flex;align-items:center;justify-content:center}
  .wordmark{font-weight:600;font-size:27px;letter-spacing:-.035em;line-height:1.05}
  .tagline{font-weight:400;font-size:15px;color:#98A2B3;margin-top:4px}
  .lede{font-weight:400;font-size:13.5px;line-height:1.6;color:#A7B0C0;max-width:34ch}
  .creds{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#D3AE68}

  /* right: the form */
  .formpane{padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:center}
  .formpane h1{margin:0 0 5px;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
  .formpane .p{margin:0 0 22px;font-size:13.5px;color:var(--muted);line-height:1.55}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
  input{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:15px;padding:12px 13px;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .2s}
  input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(16,24,40,.12)}
  .pwwrap{position:relative}
  .pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:none;
    color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;padding:6px 8px;font-family:var(--sans)}
  .submit{width:100%;margin-top:16px;background:var(--ink);color:#fff;font-family:var(--sans);font-weight:500;font-size:14.5px;
    border:0;border-radius:8px;padding:13px;cursor:pointer;transition:background .15s}
  .submit:hover{background:#000}
  .submit:disabled{opacity:.6;cursor:default}
  .err{color:var(--critical);font-size:13px;font-weight:500;margin-top:12px;min-height:18px}
  .orsep{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--faint);font-size:12px;font-weight:500}
  .orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--divider)}
  .ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
    text-decoration:none;background:var(--panel);color:var(--ink);font-weight:500;font-size:14px;border:1px solid var(--border);
    border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
  .ms-btn:hover{border-color:var(--border-hover);background:var(--fill)}

  @media (max-width:720px){
    .auth{grid-template-columns:1fr;max-width:420px;min-height:0}
    .brandpane{padding:28px 30px}
    .lockup{gap:14px} .lede{display:none} .signet{width:46px;height:46px;font-size:26px;border-radius:11px}
    .wordmark{font-size:22px} .creds{margin-top:16px}
    .formpane{padding:30px}
  }
</style>
</head>
<body>
  <div class="auth">
    <div class="brandpane">
      <div class="lockup">
        <div class="signet" aria-hidden="true">1</div>
        <div>
          <div class="wordmark">1st Fire Protection</div>
          <div class="tagline">Single-source life safety</div>
        </div>
        <div class="lede">The operating system behind our field service, people, and reputation. Licensed, certified, and always on call.</div>
      </div>
      <div class="creds">SCTRCA &middot; MBE &middot; SBE &middot; HUB</div>
    </div>

    <form class="formpane" id="form">
      <h1>Sign in</h1>
      <div class="p">Enter the access password, or sign in with your Microsoft work account.</div>
      <label for="pw">Password</label>
      <div class="pwwrap">
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus style="padding-right:64px" />
        <button type="button" id="toggle" class="pwtoggle" onclick="togglePw()" tabindex="-1">Show</button>
      </div>
      <button id="btn" type="submit" class="submit">Sign in</button>
      <div class="err" id="err"></div>

      <div class="orline" id="ssoWrap" style="display:none">
        <div class="orsep"><span>or</span></div>
        <a class="ms-btn" id="msBtn" href="/api/people/auth/login">
          <svg width="17" height="17" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
          <span>Sign in with Microsoft</span>
        </a>
      </div>
    </form>
  </div>
<script>
function togglePw(){
  var el=document.getElementById('pw'), t=document.getElementById('toggle');
  if(el.type==='password'){el.type='text';t.textContent='Hide';}else{el.type='password';t.textContent='Show';}
  el.focus();
}
function doLogin(){
  var pw=document.getElementById('pw').value.trim(); // drop stray spaces/newlines from paste
  var btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.ok){ window.location.href='/'; }
      else { err.textContent=(res.j&&res.j.error)||'Incorrect password'; btn.disabled=false; btn.textContent='Sign in'; document.getElementById('pw').select(); }
    })
    .catch(function(){ err.textContent='Something went wrong. Try again.'; btn.disabled=false; btn.textContent='Sign in'; });
}
// Attach via addEventListener (not inline) so the handler can never collide with the form's
// native submit() method - that collision was making the page reload instead of logging in.
document.getElementById('form').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
// Offer Microsoft sign-in only when Entra is actually configured (dev login also enables it).
fetch('/api/people/me').then(function(r){return r.json();}).then(function(m){
  if(m && (m.entraConfigured || m.devLogin)){ document.getElementById('ssoWrap').style.display=''; }
}).catch(function(){});
</script>
</body>
</html>
