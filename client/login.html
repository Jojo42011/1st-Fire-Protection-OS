<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    background:#1E2D40;font-family:Arial,Helvetica,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#FFFFFF;border-radius:14px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .top{background:#1E2D40;padding:22px 26px}
  .top .wm{color:#fff;font-weight:800;font-size:18px;letter-spacing:.04em}
  .top .sub{color:#F5B81B;font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .rule{height:3px;background:#E53935}
  .body{padding:26px 26px 30px}
  .body h1{margin:0 0 4px;font-size:18px;font-weight:800;color:#1E2D40}
  .body p{margin:0 0 20px;font-size:13px;color:#6B7683;line-height:1.5}
  label{display:block;font-size:12px;font-weight:700;color:#1E2D40;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;font-size:15px;padding:12px 13px;border:1px solid #D8DEE5;
    border-radius:9px;color:#1E2D40;outline:none}
  input:focus{border-color:#E53935;box-shadow:0 0 0 3px rgba(229,57,53,.12)}
  button{width:100%;margin-top:16px;background:#E53935;color:#fff;font-weight:700;font-size:15px;
    border:0;border-radius:9px;padding:13px;cursor:pointer}
  button:hover{background:#C62828}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#C62828;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
  .orsep{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:#9AA4B0;font-size:12px;font-weight:600}
  .orsep::before,.orsep::after{content:"";flex:1;height:1px;background:#E3E8EE}
  .ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
    text-decoration:none;background:#fff;color:#1E2D40;font-weight:700;font-size:14px;border:1px solid #D8DEE5;
    border-radius:9px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
  .ms-btn:hover{border-color:#B7BEC9;background:#F7F9FB}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="top">
      <div class="wm">1ST FIRE PROTECTION</div>
      <div class="sub">Operating System</div>
    </div>
    <div class="rule"></div>
    <div class="body">
      <h1>Sign in</h1>
      <p>Enter the access password, or sign in with your Microsoft work account.</p>
      <label for="pw">Password</label>
      <div style="position:relative">
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus style="padding-right:64px" />
        <button type="button" id="toggle" onclick="togglePw()" tabindex="-1"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;appearance:none;border:0;background:none;color:#6B7683;font-size:12px;font-weight:700;cursor:pointer;padding:6px 8px">Show</button>
      </div>
      <button id="btn" type="submit">Sign in</button>
      <div class="err" id="err"></div>

      <div class="orline" id="ssoWrap" style="display:none">
        <div class="orsep"><span>or</span></div>
        <a class="ms-btn" id="msBtn" href="/api/people/auth/login">
          <svg width="17" height="17" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
          <span>Sign in with Microsoft</span>
        </a>
      </div>
    </div>
  </form>
<script>
function togglePw(){
  var el=document.getElementById('pw'), t=document.getElementById('toggle');
  if(el.type==='password'){el.type='text';t.textContent='Hide';}else{el.type='password';t.textContent='Show';}
  el.focus();
}
function doLogin(){
  var pw=document.getElementById('pw').value.trim(); // drop stray spaces/newlines from paste
  var btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.ok){ window.location.href='/'; }
      else { err.textContent=(res.j&&res.j.error)||'Incorrect password'; btn.disabled=false; btn.textContent='Sign in'; document.getElementById('pw').select(); }
    })
    .catch(function(){ err.textContent='Something went wrong. Try again.'; btn.disabled=false; btn.textContent='Sign in'; });
}
// Attach via addEventListener (not inline) so the handler can never collide with the form's
// native submit() method - that collision was making the page reload instead of logging in.
document.getElementById('form').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
// Offer Microsoft sign-in only when Entra is actually configured (dev login also enables it).
fetch('/api/people/me').then(function(r){return r.json();}).then(function(m){
  if(m && (m.entraConfigured || m.devLogin)){ document.getElementById('ssoWrap').style.display=''; }
}).catch(function(){});
</script>
</body>
</html>
