<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    background:#1E2D40;font-family:Arial,Helvetica,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#FFFFFF;border-radius:14px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .top{background:#1E2D40;padding:22px 26px}
  .top .wm{color:#fff;font-weight:800;font-size:18px;letter-spacing:.04em}
  .top .sub{color:#F5B81B;font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .rule{height:3px;background:#E53935}
  .body{padding:26px 26px 30px}
  .body h1{margin:0 0 4px;font-size:18px;font-weight:800;color:#1E2D40}
  .body p{margin:0 0 20px;font-size:13px;color:#6B7683;line-height:1.5}
  label{display:block;font-size:12px;font-weight:700;color:#1E2D40;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;font-size:15px;padding:12px 13px;border:1px solid #D8DEE5;
    border-radius:9px;color:#1E2D40;outline:none}
  input:focus{border-color:#E53935;box-shadow:0 0 0 3px rgba(229,57,53,.12)}
  button{width:100%;margin-top:16px;background:#E53935;color:#fff;font-weight:700;font-size:15px;
    border:0;border-radius:9px;padding:13px;cursor:pointer}
  button:hover{background:#C62828}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#C62828;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
</style>
</head>
<body>
  <form class="card" id="form" onsubmit="return submit()">
    <div class="top">
      <div class="wm">1ST FIRE PROTECTION</div>
      <div class="sub">Operations OS</div>
    </div>
    <div class="rule"></div>
    <div class="body">
      <h1>Sign in</h1>
      <p>Enter the access password to continue.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus />
      <button id="btn" type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </div>
  </form>
<script>
function submit(){
  var pw=document.getElementById('pw').value;
  var btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.ok){ window.location.href='/'; }
      else { err.textContent=(res.j&&res.j.error)||'Incorrect password'; btn.disabled=false; btn.textContent='Sign in'; document.getElementById('pw').select(); }
    })
    .catch(function(){ err.textContent='Something went wrong. Try again.'; btn.disabled=false; btn.textContent='Sign in'; });
  return false;
}
</script>
</body>
</html>
