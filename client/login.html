<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · 1st Fire Protection</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/brand/site-theme.css" />
<link rel="stylesheet" href="/brand/site-motion.css" />
<script src="/brand/site-motion.js" defer></script>
<style>
  html,body{height:100%}
  body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px 16px;box-sizing:border-box;
    background:linear-gradient(160deg,#fff7f6 0%,#fbfbfd 45%,#fffaf1 100%);position:relative;overflow-x:hidden}
  :root[data-theme="dark"] body{background:linear-gradient(160deg,#1c1213 0%,#111113 50%,#17140e 100%)}
  /* soft blurred orbs behind the card, as on the website */
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;pointer-events:none;z-index:0}
  .orb.a{width:420px;height:420px;left:-120px;top:-80px;background:#ffd5d2}
  .orb.b{width:360px;height:360px;right:-100px;top:30%;background:#ffe9c2}
  .orb.c{width:300px;height:300px;left:30%;bottom:-140px;background:#ffe1de}
  @media (prefers-reduced-motion:no-preference){.orb{animation:drift 18s var(--ease) infinite alternate}.orb.b{animation-duration:22s}.orb.c{animation-duration:26s}}
  @keyframes drift{to{transform:translate(30px,20px) scale(1.06)}}
  .lockup{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
  .lockup img{width:40px;height:40px;object-fit:contain}
  .card{position:relative;z-index:1;width:100%;max-width:420px;box-sizing:border-box;background:var(--panel);border-radius:28px;
    padding:30px 32px 32px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 40px 80px -40px rgba(29,29,31,.35)}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.035em}
  .p{margin:8px 0 22px;font-size:15px;color:var(--muted);line-height:1.5}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
  input{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:16px;padding:13px 14px;background:var(--panel);
    border:1px solid var(--border-strong);border-radius:12px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--brand);box-shadow:var(--focus)}
  .pwwrap{position:relative}
  .pwtoggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:none;
    color:var(--link);font-size:12px;font-weight:500;cursor:pointer;padding:6px 8px;font-family:var(--sans)}
  .submit{width:100%;margin-top:18px;background:var(--brand);color:#fff;font-family:var(--sans);font-weight:600;font-size:16px;
    border:0;border-radius:980px;padding:14px;cursor:pointer;transition:background .2s,transform .15s}
  .submit:hover{background:var(--brand-hover)}
  .submit:active{transform:scale(.98)}
  .submit:disabled{opacity:.6;cursor:default}
  .err{color:var(--brand-deep);font-size:13px;font-weight:500;margin-top:12px;min-height:18px}
  .orsep{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--border)}
  .ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
    text-decoration:none;background:var(--panel);color:var(--ink);font-weight:600;font-size:15px;border:1px solid var(--border-strong);
    border-radius:980px;padding:13px;cursor:pointer;transition:border-color .2s}
  .ms-btn:hover{border-color:var(--ink);color:var(--ink)}
  .foot{position:relative;z-index:1;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
  <span class="orb a"></span><span class="orb b"></span><span class="orb c"></span>
  <div class="lockup" data-reveal="0"><img src="/brand/logo-240.png" alt="" />1st Fire Protection</div>
  <form class="card" id="form" data-reveal="120">
    <h1>Sign in</h1>
    <div class="p">People, onboarding, offboarding and IT in one place.</div>
    <div id="ssoWrap" style="display:none">
      <a class="ms-btn" id="msBtn" href="/api/people/auth/login">
        <svg width="17" height="17" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
        <span>Sign in with Microsoft</span>
      </a>
      <div class="orsep"><span>or use the office password</span></div>
    </div>
    <label for="pw">Password</label>
    <div class="pwwrap">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" style="padding-right:64px" />
      <button type="button" id="toggle" class="pwtoggle" onclick="togglePw()" tabindex="-1">Show</button>
    </div>
    <button id="btn" type="submit" class="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">1st FP Services, LLC</div>
<script>
function togglePw(){
  var el=document.getElementById('pw'), t=document.getElementById('toggle');
  if(el.type==='password'){el.type='text';t.textContent='Hide';}else{el.type='password';t.textContent='Show';}
  el.focus();
}
function doLogin(){
  var pw=document.getElementById('pw').value.trim(); // drop stray spaces/newlines from paste
  var btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.ok){ window.location.href='/'; }
      else { err.textContent=(res.j&&res.j.error)||'Incorrect password'; btn.disabled=false; btn.textContent='Sign in'; document.getElementById('pw').select(); }
    })
    .catch(function(){ err.textContent='Something went wrong. Try again.'; btn.disabled=false; btn.textContent='Sign in'; });
}
// Attach via addEventListener (not inline) so the handler can never collide with the form's
// native submit() method - that collision was making the page reload instead of logging in.
document.getElementById('form').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
// Offer Microsoft sign-in only when Entra is actually configured (dev login also enables it).
fetch('/api/people/me').then(function(r){return r.json();}).then(function(m){
  if(m && (m.entraConfigured || m.devLogin)){ document.getElementById('ssoWrap').style.display=''; }
}).catch(function(){});
</script>
</body>
</html>
