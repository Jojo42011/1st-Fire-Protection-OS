<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedule · 1st FP</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  .screen{max-width:none}
  .dp-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .dp-kpi{padding:15px 17px}
  .dp-kpi .lab{font-weight:700;font-size:11.5px;color:var(--muted)}
  .dp-kpi .val{font-weight:800;font-size:24px;color:var(--ink);margin-top:9px;font-variant-numeric:tabular-nums}
  .dp-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  .dp-legend{display:flex;align-items:center;gap:6px;font-weight:600;font-size:11px;border-radius:7px;padding:4px 9px}
  .dp-legend .sq{width:7px;height:7px;border-radius:2px}
  .dp-legend.pro{color:var(--indigo);background:var(--indigo-bg-2)}
  .dp-legend.con{color:var(--teal);background:var(--teal-bg)}
  .dp-scroll{overflow-x:auto}
  .dp-week{min-width:640px}
  .dp-wrow{display:grid;grid-template-columns:132px repeat(5,1fr);align-items:stretch}
  .dp-whead{background:var(--panel-alt);border-bottom:1px solid var(--divider)}
  .dp-whead span{padding:9px 10px;font-weight:700;font-size:11px;color:var(--muted)}
  .dp-whead span:first-child{padding-left:18px}
  .dp-crow{border-bottom:1px solid var(--divider-soft)}
  .dp-crow:last-child{border-bottom:none}
  .dp-crew{padding:12px 18px;border-right:1px solid var(--divider-soft)}
  .dp-crew .nm{font-weight:700;font-size:12.5px;color:var(--ink)}
  .dp-crew .sk{font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
  .dp-bar{height:5px;border-radius:999px;background:var(--fill);margin-top:8px;overflow:hidden}
  .dp-bar span{display:block;height:100%;border-radius:999px}
  .dp-day{padding:8px;border-right:1px solid var(--divider-soft);display:flex;flex-direction:column;gap:6px;min-height:74px}
  .dp-day:last-child{border-right:none}
  .dp-job{border-radius:8px;padding:7px 8px;border:1px solid}
  .dp-job .who{font-weight:700;font-size:11px;line-height:1.3}
  .dp-job .win{font-family:var(--mono);font-size:10px;margin-top:2px}
  .dp-prop .hd{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--divider-soft)}
  .dp-prop .sq{width:9px;height:9px;border-radius:3px;background:var(--teal)}
  .dp-prop .tag{font-weight:700;font-size:11.5px;color:var(--teal)}
  .dp-prop .bd{padding:15px 18px}
  .dp-prop .ti{font-weight:800;font-size:15px;color:var(--ink)}
  .dp-prop p{margin:8px 0 0;font-weight:500;font-size:12.5px;line-height:1.6;color:var(--ink-3)}
  .dp-wl .row{padding:12px 18px;border-bottom:1px solid var(--divider-soft);display:flex;align-items:center;gap:10px}
  .dp-wl .row:last-child{border-bottom:none}
  .dp-wl .rk{font-family:var(--mono);font-weight:700;font-size:10.5px;border-radius:6px;padding:3px 7px}
  .dp-wl .nm{font-weight:700;font-size:12.5px;color:var(--ink)}
  .dp-wl .nd{font-weight:500;font-size:11px;color:var(--muted)}
  .dp-ns{padding:15px 18px}
  .dp-ns .stats{display:flex;gap:20px;margin-top:13px}
  .dp-ns .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
  .dp-ns .nl{font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
  @media (max-width:900px){
    .dp-kpis{grid-template-columns:repeat(2,1fr)}
    .dp-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="screen view" id="root">
  <div class="dp-kpis" id="kpis"></div>
  <div class="dp-grid" style="margin-top:18px">
    <div class="card card-clip" id="week-card"></div>
    <div class="stack">
      <div class="card card-clip dp-prop" id="prop-card" style="border-left:3px solid var(--teal);display:none"></div>
      <div class="card card-clip dp-wl" id="wl-card"></div>
      <div class="card dp-ns" id="ns-card"></div>
    </div>
  </div>
</div>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nav(tab){try{window.parent.postMessage({type:'app-navigate',tab:tab},'*');}catch(e){}}
function notify(){try{window.parent.postMessage({type:'counts-changed'},'*');}catch(e){}}
var DATA=null;

fetch('/api/schedule').then(function(r){return r.json();}).then(function(d){DATA=d;render();});

function render(){
  var d=DATA, s=d.summary;
  var kpis = s.kpis ? s.kpis.map(function(k){return [k.lab,k.val,k.color];}) : [
    ['Jobs today', s.jobsToday, 'var(--ink)'],
    ['Crew utilization', s.utilization, 'var(--teal)'],
    ['No-show rate', s.noShowRate, 'var(--green)'],
    ['Open slots this week', s.openSlots, 'var(--money)'],
    ['On the waitlist', s.waitlisted, 'var(--ink)']
  ];
  document.getElementById('kpis').innerHTML=kpis.map(function(k){
    return '<div class="card dp-kpi"><div class="lab">'+esc(k[0])+'</div><div class="val" style="color:'+k[2]+'">'+esc(k[1])+'</div></div>';
  }).join('');

  // crew-week grid
  var head='<div class="dp-wrow dp-whead"><span>'+esc(d.header.crewLabel)+'</span>'+
    d.header.days.map(function(l){return '<span>'+esc(l)+'</span>';}).join('')+'</div>';
  var body=d.crews.map(function(c){
    var cells=c.days.map(function(day){
      var jobs=day.jobs.map(function(j){
        return '<div class="dp-job" style="background:'+j.bg+';border-color:'+j.border+'">'+
          '<div class="who" style="color:'+j.fg+'">'+esc(j.who)+'</div>'+
          '<div class="win" style="color:'+j.metaFg+'">'+esc(j.window)+'</div></div>';
      }).join('');
      return '<div class="dp-day">'+jobs+'</div>';
    }).join('');
    return '<div class="dp-wrow dp-crow"><div class="dp-crew">'+
      '<div class="nm">'+esc(c.name)+'</div><div class="sk">'+esc(c.skills)+'</div>'+
      '<div class="dp-bar"><span style="width:'+c.loadPct+';background:'+c.loadFg+'"></span></div></div>'+
      cells+'</div>';
  }).join('');
  document.getElementById('week-card').innerHTML=
    '<div class="card-head"><h2>This week by crew</h2><span style="flex:1"></span>'+
      '<span class="dp-legend pro"><span class="sq" style="background:var(--indigo)"></span>proposed</span>'+
      '<span class="dp-legend con"><span class="sq" style="background:var(--teal)"></span>confirmed</span></div>'+
    '<div class="dp-scroll"><div class="dp-week">'+head+body+'</div></div>';

  // proposal
  var p=d.proposal, pc=document.getElementById('prop-card');
  if(p){
    pc.style.display='';
    pc.innerHTML=
      '<div class="hd"><span class="sq"></span><span class="tag">This schedules work</span></div>'+
      '<div class="bd" id="prop-body"><div class="ti">'+esc(p.title)+'</div>'+
        '<p>'+esc(p.reason)+'</p>'+
        '<div style="display:flex;gap:8px;margin-top:13px">'+
          '<button class="btn-primary" id="approve-slot">Approve slot</button>'+
          '<button class="btn" id="pick-another">Pick another</button></div></div>';
    document.getElementById('approve-slot').onclick=function(){approve(p.appointmentId,this);};
    document.getElementById('pick-another').onclick=function(){nav('dispatch');};
  } else { pc.style.display='none'; }

  // waitlist
  document.getElementById('wl-card').innerHTML=
    '<div class="card-head"><h2>'+esc(d.waitlistTitle||'Waitlist')+'</h2><span style="flex:1"></span><span style="font-weight:500;font-size:11px;color:var(--faint)">'+esc(d.waitlistNote||'backfills cancellations')+'</span></div>'+
    d.waitlist.map(function(w){
      var tone=({money:['var(--money)','var(--money-bg)'],amber:['var(--amber-ink)','var(--amber-bg)'],gray:['var(--muted)','var(--fill)']})[w.pill]||['var(--muted)','var(--fill)'];
      return '<div class="row"><span class="rk" style="color:'+tone[0]+';background:'+tone[1]+'">'+esc(w.rank)+'</span>'+
        '<div style="flex:1"><div class="nm">'+esc(w.customer)+'</div><div class="nd">'+esc(w.need)+'</div></div></div>';
    }).join('');

  // no-shows
  var ns=d.noShows;
  var stats = ns.stats ? ns.stats.map(function(x){return '<div><div class="n" style="color:'+(x.color||'var(--ink)')+'">'+esc(x.n)+'</div><div class="nl">'+esc(x.nl)+'</div></div>';}).join('')
    : '<div><div class="n" style="color:var(--green)">'+esc(ns.rate)+'</div><div class="nl">this month</div></div>'+
      '<div><div class="n" style="color:var(--ink)">'+esc(ns.missed)+'</div><div class="nl">missed visits</div></div>'+
      '<div><div class="n" style="color:var(--ink)">'+esc(ns.reminders)+'</div><div class="nl">reminders sent</div></div>';
  document.getElementById('ns-card').innerHTML=
    '<div style="font-weight:800;font-size:13.5px;color:var(--ink)">'+esc(ns.title||'No-shows')+'</div>'+
    '<p style="margin:6px 0 0;font-weight:500;font-size:12px;line-height:1.55;color:var(--muted)">'+esc(ns.note)+'</p>'+
    '<div class="stats">'+stats+'</div>';
}
function approve(id,btn){
  btn.disabled=true; btn.textContent='Sending…';
  fetch('/api/schedule/'+id+'/approve',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(function(r){return r.json();}).then(function(){
    notify();
    document.getElementById('prop-body').innerHTML=
      '<div class="empty" style="padding:24px 8px"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<h3 style="font-size:14px">Slot is in your inbox</h3><p>It commits the crew and starts the reminders, so it waits for your yes.</p>'+
      '<button class="btn-primary" style="margin-top:12px" onclick="nav(\'approve\')">Open the approvals inbox</button></div>';
  }).catch(function(){btn.disabled=false;btn.textContent='Approve slot';});
}
</script>
</body>
</html>
