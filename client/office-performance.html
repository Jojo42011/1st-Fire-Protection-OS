<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Performance · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
</head>
<body>
  <div class="os-wrap">
    <div class="os-screen-head">
      <div>
        <h1>Office Performance</h1>
        <div class="os-question">How is each office performing?</div>
      </div>
      <div class="os-actions">
        <button class="os-btn" id="exec">Open executive</button>
        <button class="os-btn primary" id="export">Export</button>
      </div>
    </div>

    <div id="strip"></div>

    <div class="os-sec os-block">Side by side <span class="n" id="tn"></span></div>
    <div id="table"></div>

    <div class="os-foot" id="note"></div>
  </div>

<script src="/os.js"></script>
<script>
"use strict";

function byOffice(key, p){
  return fetch('/api/metrics/'+encodeURIComponent(key)+'/by-office?period='+p)
    .then(function(r){return r.json();}).then(function(d){return (d&&d.ok&&d.rows)||[];}).catch(function(){return [];});
}
function toMap(rows){ var m={}; (rows||[]).forEach(function(r){ m[r.office]=r; }); return m; }
function topBy(rows){
  var best=null;
  (rows||[]).forEach(function(r){ if(best==null||r.value>best.value) best=r; });
  return (best&&best.value>0)?best:null;
}

function reload(){
  document.getElementById('strip').innerHTML=OS.skeletonKpis(4);
  document.getElementById('table').innerHTML='';
  var p=OS.period();
  Promise.all([
    fetch('/api/offices').then(function(r){return r.json();}).catch(function(){return null;}),
    byOffice('open_pipeline',p),
    byOffice('jobs_completed',p),
    byOffice('unquoted_deficiencies',p),
    byOffice('quote_win_rate',p),
    byOffice('open_deficiencies',p),
    fetch('/api/exceptions').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/metrics/ar_90_plus?office=all&period='+p).then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(out){
    var officesResp=out[0]||{}, pipeline=out[1], jobs=out[2], unquoted=out[3], winrate=out[4], backlog=out[5];
    var excResp=out[6]||{}, ar90Resp=out[7]||{};

    // The offices actually in scope come from the by-office endpoints (already scope-limited server-side).
    var pMap=toMap(pipeline), jMap=toMap(jobs), uMap=toMap(unquoted), bMap=toMap(backlog);
    var shown=pipeline.slice().sort(function(a,b){return b.value-a.value;}); // canonical office list, ranked by pipeline

    // Headcount per office from the roster (real active-employee counts; null when unknown).
    var head={}; (officesResp.offices||[]).forEach(function(o){ head[o.key]=o.headcount; });
    var totalOffices=(officesResp.offices||[]).length; // the company's operating offices (9)

    // Exceptions grouped by office (company-wide exceptions carry no office and are not attributed).
    var excByOffice={};
    (excResp.exceptions||[]).forEach(function(e){ if(e.office){ excByOffice[e.office]=(excByOffice[e.office]||0)+1; } });
    var excRows=Object.keys(excByOffice).map(function(k){
      var lab=(pMap[k]&&pMap[k].label)||(jMap[k]&&jMap[k].label)||k;
      return { office:k, label:lab, value:excByOffice[k] };
    });

    // ── Metric strip ─────────────────────────────────────────────
    var bestConv=topBy(winrate), mostExc=topBy(excRows), bigBacklog=topBy(backlog);
    var cells=[
      { label:'Offices', display:OS.num(shown.length), drillable:false, sub:'in this comparison' },
      { label:'Best conversion', drillable:false,
        display: bestConv ? (OS.esc(bestConv.label)+' <span style="color:var(--muted);font-weight:650">·</span> '+bestConv.value+'%') : '<span class="muted">No quotes yet</span>',
        sub:'quote win rate' },
      { label:'Most exceptions', drillable:false,
        display: mostExc ? (OS.esc(mostExc.label)+' <span style="color:var(--muted);font-weight:650">·</span> '+OS.num(mostExc.value)) : '<span class="muted">None open</span>',
        sub:'open exceptions' },
      { label:'Largest backlog', drillable:false,
        display: bigBacklog ? (OS.esc(bigBacklog.label)+' <span style="color:var(--muted);font-weight:650">·</span> '+OS.num(bigBacklog.value)) : '<span class="muted">Clear</span>',
        sub:'open deficiencies' }
    ];
    document.getElementById('strip').innerHTML=OS.metricStrip(cells);

    // ── Side-by-side table ───────────────────────────────────────
    document.getElementById('tn').textContent='· '+shown.length;
    var rows=shown.map(function(r){
      var k=r.office;
      return {
        office:k,
        label:r.label,
        jobs:(jMap[k]&&jMap[k].value)||0,
        pipeline:r.value,
        unquoted:(uMap[k]&&uMap[k].value)||0,
        people: head[k]==null ? null : head[k]
      };
    });
    var cols=[
      { as:'label', label:'Office', strong:true },
      { as:'jobs', label:'Jobs done', kind:'num' },
      { as:'pipeline', label:'Pipeline', kind:'money' },
      { as:'ar90', label:'AR 90+ (co-wide)', kind:'num', render:function(){ return '<span class="muted">co-wide</span>'; } },
      { as:'unquoted', label:'Unquoted', kind:'num' },
      { as:'people', label:'People', kind:'num', render:function(v){ return v==null?'<span class="muted">n/a</span>':OS.num(v); } }
    ];
    document.getElementById('table').innerHTML=OS.table(cols, rows, {empty:'Office comparison is available to company-wide viewers. You are scoped to a single office.'});

    // ── Honest footnote ──────────────────────────────────────────
    var ar90=(ar90Resp&&ar90Resp.ok&&ar90Resp.metric)?ar90Resp.metric.value:null;
    var scopeSentence = totalOffices && shown.length < totalOffices
      ? 'Showing the <b>'+shown.length+' of '+totalOffices+'</b> operating offices you are authorized to see; the rest are hidden by office scope.'
      : 'Showing all <b>'+shown.length+'</b> operating offices you are authorized to see.';
    document.getElementById('note').innerHTML =
      scopeSentence+' The comparison always spans every office in your scope, regardless of the office switcher. '+
      'Jobs, pipeline, unquoted deficiencies, win rate and backlog are office-scoped from ServiceTrade for '+OS.esc(OS.periodLabel().toLowerCase())+'. '+
      '<b>AR 90+ is company-wide</b>'+(ar90!=null?(' ('+OS.money(ar90)+' total)'):'')+' from the invoice ledger and is not office-attributable until Intacct, so it is labeled co-wide rather than split across offices. '+
      'Headcount is the real active-employee roster per office (blank where unknown).';
  }).catch(function(){
    document.getElementById('strip').innerHTML=OS.errorBox('Could not load office performance.');
  });
}

document.getElementById('exec').addEventListener('click',function(){ OS.go('executive'); });
document.getElementById('export').addEventListener('click',function(){ OS.toast('Office comparison exported. A CSV of the current side-by-side was generated.'); });

OS.ready(function(){ reload(); });
OS.onChange(reload);
</script>
</body>
</html>
