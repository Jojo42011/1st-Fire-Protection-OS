<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offboarding · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<style>
  .wrap{padding:22px 26px;max-width:1120px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:14px 0 20px}
  .tabs button{font-weight:600;font-size:13px;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 14px;border-bottom:1px solid var(--border);font-weight:500}
  td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .who{font-weight:600;color:var(--ink)} .sub2{font-size:11px;color:var(--muted)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .rowlink{cursor:pointer} .rowlink:hover td{background:var(--panel-alt)}
  .stg{margin-top:16px} .stg h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;gap:10px;align-items:center}
  .stg h4::after{content:"";flex:1;height:1px;background:var(--border)}
  .oi{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;background:var(--panel)}
  .oi .lab{font-weight:600;font-size:12.5px;color:var(--ink)} .oi .dl{font-size:11.5px;color:var(--muted);margin-top:2px}
  .oi .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
  .oi .ax{display:flex;gap:6px;align-items:center;flex:none}
  .btn2{font-family:var(--sans);font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--panel);color:var(--ink-2);border-radius:7px;padding:5px 10px;cursor:pointer}
  .btn2.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn2.bad{border-color:var(--critical,#8C1D18);color:var(--critical,#8C1D18)}
  :root[data-theme="dark"] .btn2.primary{color:var(--bg)}
  form.of{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:720px}
  form.of .fld{display:flex;flex-direction:column;gap:5px} form.of .full{grid-column:1/3}
  form.of label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  form.of input[type=text],form.of input[type=email],form.of input[type=date]{font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:none}
  form.of input:focus{border-color:var(--ink)}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .policy{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
  .policy input{width:64px;font-family:var(--mono);text-align:center;border:1px solid var(--border);border-radius:7px;padding:5px;background:var(--panel);color:var(--ink)}
  .selbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
  .muted{color:var(--muted)} .empty{color:var(--muted);font-size:13px;padding:22px}
</style>
<script src="/os.js" defer></script>
</head>
<body>
<div class="wrap">
  <div>
    <h1 style="font-size:20px;font-weight:600;margin:0">Offboarding</h1>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 0;max-width:660px">The departure SOP: lock down the account, convert the mailbox to shared and drop the license, forward mail for a set window, then retire the account. Deletes always need approval. Nothing runs against AD or 365 automatically yet: each step is surfaced here to work through.</p>
  </div>
  <div class="tabs">
    <button data-tab="board" class="on">Board</button>
    <button data-tab="backlog">Backlog sweep</button>
    <button data-tab="new">New offboarding</button>
  </div>
  <div id="view"></div>
</div>

<script>
function esc(t){return OS.esc(t);}
var SEV={critical:'bad',high:'bad',medium:'warn'};
var STAGE={s1:'Day 0 · lock down',s2:'Stop paying',s3:'Cut the forward',s4:'Retire'};
var TAB='board', OPEN=null, POLICY={forwardDays:90,retainDays:180};

function setTab(t){TAB=t;document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===t);});render();
  try{history.replaceState(null,'','#'+t);}catch(_){} try{parent.postMessage({type:'fp-subtab',tab:t},'*');}catch(_){}
}

/* ---------- board ---------- */
function render(){
  if(TAB==='board') return loadBoard();
  if(TAB==='backlog') return loadBacklog();
  if(TAB==='new') return renderNew();
}
function loadBoard(){
  document.getElementById('view').innerHTML='<div class="empty">Loading…</div>';
  fetch('/api/offboarding').then(function(r){return r.json();}).then(function(d){
    POLICY=d.policy||POLICY;
    var reqs=d.requests||[];
    var rows=reqs.map(function(r){var ru=r.rollup||{};
      var st=r.status==='complete'?OS.pill('Complete','good'):r.status==='cancelled'?OS.pill('Cancelled','neutral'):OS.pill('Open','warn');
      return '<tr class="rowlink" data-id="'+r.id+'"><td><div class="who">'+esc(r.name)+'</div><div class="sub2 mono">'+esc(r.upn||'')+'</div></td>'+
        '<td>'+st+(ru.pendingApprovals>0?' '+OS.pill(ru.pendingApprovals+' appr','warn'):'')+'</td>'+
        '<td class="mono">'+ru.done+'/'+ru.total+'</td>'+
        '<td class="mono">'+esc(r.forward_until||'')+'</td>'+
        '<td class="mono">'+esc(r.retain_until||'')+'</td>'+
        '<td>'+(r.source==='backlog'?OS.pill('backlog','neutral'):'')+'</td></tr>';
    }).join('');
    var table=reqs.length?'<div class="card"><table><thead><tr><th>Person</th><th>Status</th><th>Done</th><th>Forward until</th><th>Retain until</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No offboarding requests yet. Start one under New offboarding, or pull from the Backlog sweep.</div>';
    document.getElementById('view').innerHTML='<div class="policy">Forwarding runs <b>'+POLICY.forwardDays+'</b> days; accounts retire after <b>'+POLICY.retainDays+'</b> days. <a href="#" id="editPolicy" style="color:var(--ink)">Edit</a></div>'+table+'<div id="detail" style="margin-top:20px"></div>';
    document.querySelectorAll('.rowlink').forEach(function(tr){tr.addEventListener('click',function(){openReq(Number(tr.getAttribute('data-id')));});});
    document.getElementById('editPolicy').addEventListener('click',function(e){e.preventDefault();editPolicy();});
  });
}
function editPolicy(){
  var p=document.querySelector('.policy');
  p.innerHTML='Forwarding <input id="pf" type="number" min="1" value="'+POLICY.forwardDays+'"> days · retire after <input id="pr" type="number" min="1" value="'+POLICY.retainDays+'"> days <button class="btn2 primary" id="psave">Save</button>';
  document.getElementById('psave').addEventListener('click',function(){
    fetch('/api/offboarding/policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({forwardDays:Number(document.getElementById('pf').value),retainDays:Number(document.getElementById('pr').value)})})
      .then(function(r){return r.json();}).then(function(d){POLICY=d.policy;OS.toast('Policy saved.');loadBoard();});
  });
}
function openReq(id){
  OPEN=id;
  fetch('/api/offboarding/'+id).then(function(r){return r.json();}).then(function(d){
    if(!d.ok)return; var r=d.request, ru=d.rollup;
    var byStage={s1:[],s2:[],s3:[],s4:[]};
    (d.items||[]).forEach(function(it){(byStage[it.stage]||(byStage[it.stage]=[])).push(it);});
    var stages=Object.keys(STAGE).map(function(s){
      var its=byStage[s]||[]; if(!its.length)return '';
      return '<div class="stg"><h4>'+STAGE[s]+'</h4>'+its.map(itemRow).join('')+'</div>';
    }).join('');
    document.getElementById('detail').innerHTML='<div class="card" style="padding:16px 18px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">'+
      '<div><h2 style="margin:0;font-size:17px">'+esc(r.name)+'</h2><div class="sub2 mono">'+esc(r.upn||'')+(r.office?(' · '+esc(r.office)):'')+'</div>'+
      '<div class="sub2" style="margin-top:4px">Forward to '+esc(r.forward_to||'manager')+' until <b>'+esc(r.forward_until)+'</b> · retire <b>'+esc(r.retain_until)+'</b> · mailbox at retention: <b>'+(r.mailbox_action==='hold'?'hold':'delete')+'</b></div></div>'+
      '<div style="display:flex;gap:8px"><button class="btn2 bad" id="cancelReq">Cancel</button><button class="btn2" id="closeReq">Close</button></div></div>'+
      stages+'</div>';
    document.getElementById('closeReq').addEventListener('click',function(){OPEN=null;document.getElementById('detail').innerHTML='';});
    document.getElementById('cancelReq').addEventListener('click',function(){if(!confirm('Cancel this offboarding request?'))return;fetch('/api/offboarding/'+id+'/cancel',{method:'POST'}).then(function(){OS.toast('Cancelled.');loadBoard();});});
    document.querySelectorAll('#detail [data-item]').forEach(function(b){b.addEventListener('click',function(){decide(Number(b.getAttribute('data-item')),b.getAttribute('data-verb'));});});
    document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function itemRow(it){
  var st,ax='';
  if(it.status==='pending'){
    st=OS.pill(it.kind==='approval'?'Needs approval':'Pending',it.kind==='approval'?'warn':'neutral');
    if(it.kind==='approval') ax='<button class="btn2 primary" data-item="'+it.id+'" data-verb="approve">Approve</button><button class="btn2 bad" data-item="'+it.id+'" data-verb="reject">Reject</button>';
    else ax='<button class="btn2 primary" data-item="'+it.id+'" data-verb="complete">Done</button><button class="btn2" data-item="'+it.id+'" data-verb="skip">Skip</button>';
  } else if(it.status==='done'||it.status==='approved'){st=OS.pill(it.status==='approved'?'Approved':'Done','good');}
  else if(it.status==='skipped'){st=OS.pill('Skipped','neutral');}
  else {st=OS.pill('Rejected','bad');}
  return '<div class="oi"><div><div class="lab">'+esc(it.label)+'</div>'+(it.detail?'<div class="dl">'+esc(it.detail)+'</div>':'')+
    '<div class="meta">'+esc(it.owner_label||it.owner)+' · due '+esc(it.due_at||'')+(it.decided_by&&it.status!=='pending'?(' · '+esc(it.status)+' by '+esc(it.decided_by)):'')+'</div></div>'+
    '<div class="ax">'+st+ax+'</div></div>';
}
function decide(id,verb){fetch('/api/offboarding/items/'+id+'/'+verb,{method:'POST'}).then(function(r){return r.json();}).then(function(){if(OPEN)openReq(OPEN);});}

/* ---------- backlog ---------- */
function loadBacklog(){
  document.getElementById('view').innerHTML='<div class="empty">Scanning the AD mirror…</div>';
  fetch('/api/offboarding/backlog').then(function(r){return r.json();}).then(function(d){
    var c=d.candidates||[];
    if(!c.length){document.getElementById('view').innerHTML='<div class="empty">No terminated-account backlog. Either the AD mirror has no terminated matches yet, or every candidate already has an offboarding request.</div>';return;}
    var rows=c.map(function(x){
      return '<tr><td><input type="checkbox" class="cbx" value="'+esc(x.object_guid)+'"></td>'+
        '<td><div class="who">'+esc(x.name||x.sam||'-')+'</div><div class="sub2 mono">'+esc(x.upn||x.sam||'')+'</div></td>'+
        '<td>'+OS.pill(x.severity,SEV[x.severity]||'neutral')+'</td>'+
        '<td>'+esc(x.reason)+'</td>'+
        '<td>'+(x.enabled?OS.pill('enabled','bad'):OS.pill('disabled','neutral'))+'</td>'+
        '<td class="mono">'+x.groups+'</td>'+
        '<td class="mono">'+(x.ageDays==null?'-':x.ageDays+'d')+'</td></tr>';
    }).join('');
    document.getElementById('view').innerHTML=
      '<div class="selbar"><div class="muted">'+c.length+' account'+(c.length===1?'':'s')+' with no offboarding yet. Selecting creates a request per account using the 90-day forward and current retention policy.</div>'+
      '<button class="os-btn primary" id="createSel" disabled>Create offboarding for selected</button></div>'+
      '<div class="card"><table><thead><tr><th><input type="checkbox" id="cbxAll"></th><th>Account</th><th>Severity</th><th>Why</th><th>State</th><th>Groups</th><th>Age</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    var boxes=function(){return Array.prototype.slice.call(document.querySelectorAll('.cbx'));};
    var sync=function(){var n=boxes().filter(function(b){return b.checked;}).length;var btn=document.getElementById('createSel');btn.disabled=n===0;btn.textContent=n?('Create offboarding for '+n+' selected'):'Create offboarding for selected';};
    document.getElementById('cbxAll').addEventListener('change',function(e){boxes().forEach(function(b){b.checked=e.target.checked;});sync();});
    boxes().forEach(function(b){b.addEventListener('change',sync);});
    document.getElementById('createSel').addEventListener('click',function(){
      var guids=boxes().filter(function(b){return b.checked;}).map(function(b){return b.value;});
      if(!guids.length)return; var btn=this; btn.disabled=true; btn.textContent='Creating…';
      fetch('/api/offboarding/backlog/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guids:guids})})
        .then(function(r){return r.json();}).then(function(res){
          OS.toast('Created '+res.created+' offboarding request'+(res.created===1?'':'s')+(res.skipped?(', skipped '+res.skipped):'')+'.');
          setTab('board');
        }).catch(function(){btn.disabled=false;btn.textContent='Create offboarding for selected';OS.toast('Could not create.','bad');});
    });
  });
}

/* ---------- new ---------- */
function renderNew(){
  document.getElementById('view').innerHTML=
    '<form class="of" id="newForm">'+
    '<div class="fld"><label>Name</label><input type="text" name="name" required></div>'+
    '<div class="fld"><label>UPN / work email</label><input type="email" name="upn" placeholder="first.last@1stfpservices.com"></div>'+
    '<div class="fld"><label>Manager email (forward target)</label><input type="email" name="manager_email"></div>'+
    '<div class="fld"><label>Office</label><input type="text" name="office"></div>'+
    '<div class="fld"><label>Termination date</label><input type="date" name="termination_date"></div>'+
    '<div class="fld"><label>Last working day</label><input type="date" name="last_working_date"></div>'+
    '<div class="fld full"><label class="chk"><input type="checkbox" name="hold"> Keep the mailbox on hold at retention instead of deleting it</label></div>'+
    '<div class="full"><button type="submit" class="os-btn primary">Start offboarding</button></div>'+
    '</form>';
  document.getElementById('newForm').addEventListener('submit',function(e){
    e.preventDefault(); var f=e.target;
    var body={name:f.name.value.trim(),upn:f.upn.value.trim()||undefined,manager_email:f.manager_email.value.trim()||undefined,office:f.office.value.trim()||undefined,termination_date:f.termination_date.value||undefined,last_working_date:f.last_working_date.value||undefined,mailbox_action:f.hold.checked?'hold':'delete'};
    if(!body.name){OS.toast('Name is required.','bad');return;}
    fetch('/api/offboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(d){if(!d.ok){OS.toast(d.error||'Could not create.','bad');return;}OS.toast('Offboarding started.');setTab('board');});
  });
}

document.addEventListener('DOMContentLoaded',function(){
  if(!window.OS){setTimeout(arguments.callee,50);return;}
  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'));});});
  // Restore the sub-tab from the hash the shell loaded us with (e.g. #backlog).
  var h=(location.hash||'').replace(/^#/,'');
  if(h==='board'||h==='backlog'||h==='new') TAB=h;
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===TAB);});
  render();
});
</script>
</body>
</html>
