<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offboarding · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<link rel="stylesheet" href="/brand/site-theme.css" />
<style>
  .who{font-weight:600;color:var(--ink)} .sub2{font-size:12px;color:var(--muted)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ob-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--fill);padding:2px 8px;border-radius:980px;margin-left:6px}
  form.of{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;background:var(--panel);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--border);padding:22px}
  form.of .fld{display:flex;flex-direction:column;gap:6px} form.of .full{grid-column:1/3}
  form.of label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  form.of input[type=text],form.of input[type=email],form.of input[type=date]{font-size:14px}
  @media(max-width:640px){form.of{grid-template-columns:1fr} form.of .full{grid-column:1}}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);text-transform:none!important;letter-spacing:0!important;font-weight:500!important}
  .policy input{width:64px;font-family:var(--mono);text-align:center;padding:5px;border-radius:10px}
  .selbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
  .muted{color:var(--muted)} .empty{color:var(--muted);font-size:13px;padding:22px}
  .scriptbox textarea{width:100%;height:300px;font-family:var(--mono);font-size:11.5px;white-space:pre;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
</style>
<script src="/os.js" defer></script>
</head>
<body>
<div class="page view">
  <div id="crumbHost"></div>
  <div class="os-screen-head" id="offHead">
    <div>
      <h1 id="pgTitle">Offboarding</h1>
      <div class="os-question" id="pgSub">Who is leaving, and is all their access and company property back?</div>
    </div>
    <div class="os-actions" id="headActions">
      <button class="os-btn" data-tab="backlog">Backlog sweep</button>
      <button class="os-btn primary" data-tab="new">Start offboarding</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<script>
function esc(t){return OS.esc(t);}
var SEV={critical:'bad',high:'bad',medium:'warn'};
var STAGE={s1:'Day 0 · lock down',s2:'Stop paying',s3:'Cut the forward',s4:'Retire'};
var TAB='board', OPEN=null, POLICY={forwardDays:90,retainDays:180};
var DEPT='', CAN_ALL=false; // department filter (admins can see all and narrow by dept)
var DEPTS=[['','All teams'],['it','IT'],['hr','HR'],['accounting','Accounting'],['manager','Manager']];
function ownerQS(){return DEPT?('?owner='+encodeURIComponent(DEPT)):'';}

var HEADS={
  board:{t:'Offboarding',s:'Who is leaving, and is all their access and company property back?'},
  backlog:{t:'Backlog sweep',s:'Accounts in Active Directory that belong to people who have left, with no offboarding yet.'},
  new:{t:'Start offboarding',s:'Pick the person. Their checklist is built from what they actually have.'}
};
function setHead(title,sub,crumb,actions){
  document.getElementById('pgTitle').textContent=title;
  document.getElementById('pgSub').textContent=sub||'';
  document.getElementById('offHead').style.display='';
  document.getElementById('headActions').style.display=actions?'':'none';
  var ch=document.getElementById('crumbHost');
  ch.innerHTML=crumb?'<button class="crumb" id="crumbBtn">← '+esc(crumb)+'</button>':'';
  if(crumb) document.getElementById('crumbBtn').addEventListener('click',function(){OPEN=null;setTab('board');});
}
function setTab(t){TAB=t;OPEN=null;var h=HEADS[t]||HEADS.board;setHead(h.t,h.s,t==='board'?null:'Offboarding',t==='board');render();window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+t);}catch(_){} try{parent.postMessage({type:'fp-subtab',tab:t},'*');}catch(_){}
}

/* ---------- board ---------- */
function render(){
  if(TAB==='board') return loadBoard();
  if(TAB==='backlog') return loadBacklog();
  if(TAB==='new') return renderNew();
}
function loadBoard(){
  document.getElementById('view').innerHTML='<div class="empty">Loading…</div>';
  fetch('/api/offboarding'+ownerQS()).then(function(r){return r.json();}).then(function(d){
    POLICY=d.policy||POLICY;
    CAN_ALL=!!(d.viewer&&d.viewer.canSeeAll);
    var reqs=d.requests||[];
    var rows=reqs.map(function(r){var ru=r.rollup||{};
      var st=r.status==='complete'?OS.pill('Complete','good'):r.status==='cancelled'?OS.pill('Cancelled','neutral'):OS.pill('In progress','warn');
      var pct=ru.total?Math.round(ru.done/ru.total*100):0;
      return '<tr class="rowlink click" data-id="'+r.id+'"><td><div class="who">'+esc(r.name)+(r.no_directory?'<span class="ob-tag">no AD or email</span>':'')+(r.source==='bamboo'?'<span class="ob-tag">from BambooHR</span>':r.source==='backlog'?'<span class="ob-tag">backlog</span>':'')+'</div><div class="sub2">'+esc(r.upn||r.office||'')+'</div></td>'+
        '<td><div style="display:flex;align-items:center;gap:9px"><span class="pbar'+(pct>=100?' done':'')+'"><span style="width:'+pct+'%"></span></span><span class="sub2" style="white-space:nowrap">'+ru.done+' of '+ru.total+'</span></div></td>'+
        '<td>'+st+(ru.pendingApprovals>0?' '+OS.pill(ru.pendingApprovals+' approval'+(ru.pendingApprovals===1?'':'s'),'warn'):'')+'</td>'+
        '<td>'+esc(OS.date?OS.date(r.forward_until):r.forward_until||'')+'</td>'+
        '<td>'+esc(OS.date?OS.date(r.retain_until):r.retain_until||'')+'</td></tr>';
    }).join('');
    var open=reqs.filter(function(r){return r.status==='open';});
    var appr=reqs.reduce(function(n,r){return n+((r.rollup&&r.rollup.pendingApprovals)||0);},0);
    var steps=open.reduce(function(n,r){return n+((r.rollup&&r.rollup.pending)||0);},0);
    var done=reqs.filter(function(r){return r.status==='complete';}).length;
    var strip=OS.metricStrip([
      {label:'Leaving now',value:open.length,format:'count',drillable:false,sub:'open offboardings'},
      {label:'Steps left',value:steps,format:'count',drillable:false,sub:'across every team'},
      {label:'Approvals waiting',value:appr,format:'count',drillable:false,sub:'account and mailbox deletes'},
      {label:'Completed',value:done,format:'count',drillable:false,sub:'fully offboarded'}
    ]);
    var table=reqs.length?'<div class="os-tablewrap"><table class="os-table"><thead><tr><th>Person</th><th>Progress</th><th>Status</th><th>Mail forwards until</th><th>Account retires</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      :OS.empty('No one is being offboarded. Start one, or run the backlog sweep.','✓');
    var chips = CAN_ALL
      ? '<div class="os-chips">'+DEPTS.map(function(d2){return '<button class="os-chip'+(d2[0]===DEPT?' on':'')+'" data-dept="'+d2[0]+'">'+esc(d2[0]?d2[1]:'All teams')+'</button>';}).join('')+'</div>'
      : '<div class="note-line" style="margin:0 0 10px">Showing your team\'s steps.</div>';
    document.getElementById('view').innerHTML=strip+'<div class="sec-h"><h2>People leaving<span class="n">'+open.length+'</span></h2><span class="aside">Click someone to see their checklist</span></div>'+chips+table+
      '<div class="note-line policy">Mail forwards for <b>'+POLICY.forwardDays+' days</b>, then the account retires after <b>'+POLICY.retainDays+' days</b>. <button class="linkbtn" id="editPolicy">Change</button></div><div id="cloudPerm"></div>';
    document.querySelectorAll('.rowlink').forEach(function(tr){tr.addEventListener('click',function(){openReq(Number(tr.getAttribute('data-id')));});});
    document.getElementById('editPolicy').addEventListener('click',function(e){e.preventDefault();editPolicy();});
    document.querySelectorAll('[data-dept]').forEach(function(b){b.addEventListener('click',function(){DEPT=b.getAttribute('data-dept');OPEN=null;loadBoard();});});
    loadCloudPerm();
  });
}
// Show whether the connected Microsoft app actually holds the permissions the "Run in cloud" steps need.
function loadCloudPerm(){
  var el=document.getElementById('cloudPerm'); if(!el)return;
  function box(bg,bd,ink,html){var tone=bg==='#eaf6ee'?'good':bg==='#fdf3e3'?'warn':'';return '<div class="banner '+tone+'" style="margin-top:14px">'+html+'</div>';}
  fetch('/api/offboarding/cloud-permissions').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)return;
    if(!d.connected){el.innerHTML=box('#f6f6f4','#e2e2dd','#6b6b66','<span><b>Run in cloud is off.</b> Microsoft 365 is not connected, so cloud steps are done by hand or by script.</span>');return;}
    if(!d.introspectable){el.innerHTML=box('#f6f6f4','#e2e2dd','#6b6b66','<b>Cloud offboarding</b>: connected (permissions could not be read from a static token).');return;}
    if(d.allPresent){el.innerHTML=box('#eaf6ee','#bfe3cb','#1a7f37','&#10003; <b>Cloud offboarding ready.</b> The connected app has all required Microsoft 365 permissions. "Run in cloud" works with no PowerShell.');return;}
    el.innerHTML=box('#fdf3e3','#f0dcb4','#8a5a12','&#9888; <b>Cloud offboarding: missing '+d.missing.length+' permission'+(d.missing.length===1?'':'s')+'.</b> Add these to the app registration and grant admin consent: <b>'+d.missing.map(esc).join(', ')+'</b>. Steps whose permission is already present still work.');
  }).catch(function(){});
}
function editPolicy(){
  var p=document.querySelector('.policy');
  p.innerHTML='Mail forwards for <input id="pf" type="number" min="1" value="'+POLICY.forwardDays+'"> days, account retires after <input id="pr" type="number" min="1" value="'+POLICY.retainDays+'"> days <button class="os-btn sm primary" id="psave">Save</button>';
  document.getElementById('psave').addEventListener('click',function(){
    fetch('/api/offboarding/policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({forwardDays:Number(document.getElementById('pf').value),retainDays:Number(document.getElementById('pr').value)})})
      .then(function(r){return r.json();}).then(function(d){POLICY=d.policy;OS.toast('Policy saved.');loadBoard();});
  });
}
function openReq(id){
  OPEN=id;
  fetch('/api/offboarding/'+id+ownerQS()).then(function(r){return r.json();}).then(function(d){
    if(!d.ok)return; var r=d.request, ru=d.rollup;
    // Group by department. Each department with a shared mailbox and open tasks gets a one-click
    // digest button that emails that department its still-to-do tasks.
    var byDept={};
    (d.items||[]).forEach(function(it){(byDept[it.dept]||(byDept[it.dept]=[])).push(it);});
    var stages=(d.departments||[]).map(function(dp){
      var its=byDept[dp.key]||[]; if(!its.length)return '';
      var emailBtn = (dp.mailbox && dp.open>0) ? '<button class="os-btn sm" data-deptemail="'+dp.key+'" title="Email '+esc(dp.mailbox)+'">Email</button>' : '';
      return '<div class="lane"><div class="lane-h"><span class="ln">'+esc(dp.label)+' <span class="lc">'+(dp.total-dp.open)+' of '+dp.total+'</span></span>'+
        '<span class="lr">'+(dp.open>0?OS.pill(dp.open+' to do','warn'):OS.pill('All done','good'))+emailBtn+'</span></div>'+
        its.map(itemRow).join('')+'</div>';
    }).join('');
    setHead(r.name,(r.upn||(d.no_directory?'No email or AD account':''))+(r.office?(' · '+r.office):''),'Offboarding',false);
    var pct=ru.total?Math.round(ru.done/ru.total*100):0;
    document.getElementById('view').innerHTML=
      '<div class="dhead" style="margin-top:-6px"><div class="dmeta" style="margin:0">'+
        '<span class="mchip"><b>'+ru.done+' of '+ru.total+'</b> done</span>'+
        '<span class="mchip">Mail forwards to <b>'+esc(r.forward_to||'their manager')+'</b> until <b>'+esc(OS.date?OS.date(r.forward_until):r.forward_until)+'</b></span>'+
        '<span class="mchip">Account retires <b>'+esc(OS.date?OS.date(r.retain_until):r.retain_until)+'</b>, mailbox <b>'+(r.mailbox_action==='hold'?'kept on hold':'deleted')+'</b></span>'+
      '</div><div class="dacts"><button class="os-btn" id="dcReq">AD script</button><button class="os-btn" id="cloudReq">Cloud script</button><button class="os-btn danger" id="cancelReq">Cancel offboarding</button></div></div>'+
      (d.no_directory?'<div class="banner" style="margin-top:12px">No directory account, so the Active Directory and Microsoft 365 steps are marked N/A.</div>':'')+
      '<div class="pbar'+(pct>=100?' done':'')+'" style="margin:14px 0 4px"><span style="width:'+pct+'%"></span></div>'+
      '<div id="exoOut"></div><div id="detail">'+stages+'</div>';

    var showScript=function(path,title,note){
      fetch(path).then(function(r){return r.json();}).then(function(d){
        if(!d.ok){OS.toast(d.error||'Could not build the script.','bad');return;}
        var out=document.getElementById('exoOut');
        out.innerHTML='<div class="lane scriptbox" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>'+title+'</b><button class="os-btn sm" id="exoCopy">Copy</button></div><textarea id="exoText" readonly></textarea><div class="sub2" style="margin-top:6px">'+note+'</div></div>';
        document.getElementById('exoText').value=d.script;
        document.getElementById('exoCopy').addEventListener('click',function(){var t=document.getElementById('exoText');t.select();document.execCommand('copy');OS.toast('Copied.');});
      });
    };
    document.getElementById('dcReq').addEventListener('click',function(){showScript('/api/offboarding/'+id+'/dc-script','AD offboarding script - run on the domain controller','Set <b>$env:AGENT_TOKEN</b>, then run on a DC. Disables the account and removes group membership. Each step marks its task done here ONLY if it succeeds; refresh this request after.');});
    document.getElementById('cloudReq').addEventListener('click',function(){showScript('/api/offboarding/'+id+'/cloud-script','Cloud offboarding script - run on your computer','Run <b>Connect-ExchangeOnline</b> and <b>Connect-MgGraph</b> first, and set <b>$env:AGENT_TOKEN</b>. Converts to shared, removes the license, revokes sessions, sets forwarding + auto-reply. Marks each task done ONLY if it succeeds; refresh this request after.');});
    document.getElementById('cancelReq').addEventListener('click',function(){if(!confirm('Cancel this offboarding request?'))return;fetch('/api/offboarding/'+id+'/cancel',{method:'POST'}).then(function(){OS.toast('Offboarding cancelled.');setTab('board');});});
    document.querySelectorAll('#detail [data-item]').forEach(function(b){b.addEventListener('click',function(){decide(Number(b.getAttribute('data-item')),b.getAttribute('data-verb'));});});
    document.querySelectorAll('#detail [data-run]').forEach(function(b){b.addEventListener('click',function(){runOnDc(Number(b.getAttribute('data-run')),b);});});
    document.querySelectorAll('#detail [data-cloud]').forEach(function(b){b.addEventListener('click',function(){runInCloud(Number(b.getAttribute('data-cloud')),b);});});
    document.querySelectorAll('#detail [data-deptemail]').forEach(function(b){b.addEventListener('click',function(){emailDept(b.getAttribute('data-deptemail'),b);});});
    window.scrollTo(0,0);
  });
}
var DC_ACTIONS={ad_disable:1,groups_remove:1,ad_delete:1}; // steps the DC agent can run
// Cloud steps the OS runs server-side via Microsoft Graph (no PowerShell, no laptop modules).
var CLOUD_ACTIONS={revoke_sessions:1,license_remove:1,autoreply_set:1,fwd_set:1,data_reassign:1};
function itemRow(it){
  var st,ax='';
  var dc=DC_ACTIONS[it.action_code];
  var cloud=CLOUD_ACTIONS[it.action_code];
  if(it.status==='pending'){
    st=it.kind==='approval'?OS.pill('Needs approval','warn'):'';
    if(it.kind==='approval') ax='<button class="os-btn sm primary" data-item="'+it.id+'" data-verb="approve">Approve</button><button class="os-btn sm" data-item="'+it.id+'" data-verb="reject">Don\'t approve</button>';
    else ax='<button class="os-btn sm primary" data-item="'+it.id+'" data-verb="complete">Mark done</button><button class="os-btn sm" data-item="'+it.id+'" data-verb="skip">Skip</button>';
    // Task steps the DC can run get a "Run on DC" button. Delete is an approval: it only appears once approved.
    if(dc && it.kind!=='approval') ax='<button class="os-btn sm" data-run="'+it.id+'">Run on DC</button>'+ax;
    // Cloud steps run server-side, right now, no laptop needed.
    if(cloud && it.kind!=='approval') ax='<button class="os-btn sm" data-cloud="'+it.id+'">Run in cloud</button>'+ax;
  } else if(it.status==='na'){
    st=OS.pill('N/A','neutral');
  } else if(it.status==='approved'){
    st=OS.pill('Approved','good');
    if(dc) ax='<button class="os-btn sm danger" data-run="'+it.id+'">Run delete on DC</button>';
  } else if(it.status==='done'){st=OS.pill('Done','good');}
  else if(it.status==='skipped'){st=OS.pill('Skipped','neutral');}
  else {st=OS.pill('Rejected','bad');}
  var due=it.due_at?('Due '+(OS.date?OS.date(it.due_at):it.due_at)):'';
  var who=(it.decided_by&&it.status!=='pending')?(({done:'Done',approved:'Approved',skipped:'Skipped',na:'N/A',rejected:'Not approved'})[it.status]||it.status)+' by '+it.decided_by:'';
  return '<div class="lane-i'+(it.status==='pending'?'':' closed')+'"><div class="lt"><div class="lab">'+esc(it.label)+'</div>'+(it.detail?'<div class="dl">'+esc(it.detail)+'</div>':'')+
    '<div class="meta">'+esc([it.status==='pending'?due:'',who].filter(Boolean).join(' · '))+'</div></div>'+
    '<div class="ax">'+st+ax+'</div></div>';
}
function decide(id,verb){fetch('/api/offboarding/items/'+id+'/'+verb,{method:'POST'}).then(function(r){return r.json();}).then(function(d){if(!d||!d.ok){OS.toast((d&&d.error)||'Could not save that.',{tone:'bad',ms:7000});return;}if(OPEN)openReq(OPEN);}).catch(function(){OS.toast('Could not reach the server.',{tone:'bad'});});}
function runOnDc(id,btn){
  if(!confirm('Queue this action for the domain controller to run?'))return;
  btn.disabled=true; btn.textContent='Queuing…';
  fetch('/api/offboarding/items/'+id+'/run-on-dc',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){OS.toast(d.error||'Could not queue.','bad');btn.disabled=false;btn.textContent='Run on DC';return;}
    OS.toast('Queued on the DC. It runs on the next agent cycle (within ~15 min); the step flips to Done when it reports back.');
    if(OPEN)openReq(OPEN);
  }).catch(function(){btn.disabled=false;btn.textContent='Run on DC';OS.toast('Could not queue.','bad');});
}
function runInCloud(id,btn){
  if(!confirm('Run this step now against Microsoft 365? It happens immediately.'))return;
  btn.disabled=true; btn.textContent='Running…';
  fetch('/api/offboarding/items/'+id+'/run-in-cloud',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){OS.toast(d.error||'Could not run.','bad');btn.disabled=false;btn.textContent='Run in cloud';return;}
    OS.toast(d.detail||'Done.');
    if(OPEN)openReq(OPEN);
  }).catch(function(){btn.disabled=false;btn.textContent='Run in cloud';OS.toast('Could not run.','bad');});
}
function emailDept(dept,btn){
  if(!confirm('Send this department its open offboarding tasks in one email?'))return;
  btn.disabled=true; var was=btn.textContent; btn.textContent='Sending…';
  fetch('/api/offboarding/'+OPEN+'/email-department',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dept:dept})}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){OS.toast(d.error||'Could not send.','bad');btn.disabled=false;btn.textContent=was;return;}
    OS.toast('Emailed '+(d.to||'the shared mailbox')+' with '+(d.count||0)+' task'+(d.count===1?'':'s')+'.');
    btn.disabled=false;btn.textContent=was;
  }).catch(function(){btn.disabled=false;btn.textContent=was;OS.toast('Could not send.','bad');});
}

/* ---------- backlog ---------- */
function loadBacklog(){
  document.getElementById('view').innerHTML='<div class="empty">Scanning the AD mirror…</div>';
  fetch('/api/offboarding/backlog').then(function(r){return r.json();}).then(function(d){
    var c=d.candidates||[];
    if(!c.length){document.getElementById('view').innerHTML='<div class="empty">No terminated-account backlog. Either the AD mirror has no terminated matches yet, or every candidate already has an offboarding request.</div>';return;}
    var rows=c.map(function(x){
      return '<tr><td><input type="checkbox" class="cbx" value="'+esc(x.object_guid)+'"></td>'+
        '<td><div class="who">'+esc(x.name||x.sam||'-')+'</div><div class="sub2 mono">'+esc(x.upn||x.sam||'')+'</div></td>'+
        '<td>'+OS.pill(x.severity,SEV[x.severity]||'neutral')+'</td>'+
        '<td>'+esc(x.reason)+'</td>'+
        '<td>'+(x.enabled?OS.pill('enabled','bad'):OS.pill('disabled','neutral'))+'</td>'+
        '<td class="mono">'+x.groups+'</td>'+
        '<td class="mono">'+(x.ageDays==null?'-':x.ageDays+'d')+'</td></tr>';
    }).join('');
    document.getElementById('view').innerHTML=
      '<div class="selbar"><div class="muted">'+c.length+' account'+(c.length===1?'':'s')+' with no offboarding yet. Each one you pick gets its own checklist.</div>'+
      '<button class="os-btn primary" id="createSel" disabled>Create offboarding for selected</button></div>'+
      '<div class="os-tablewrap"><table class="os-table"><thead><tr><th><input type="checkbox" id="cbxAll"></th><th>Account</th><th>Severity</th><th>Why</th><th>State</th><th>Groups</th><th>Age</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    var boxes=function(){return Array.prototype.slice.call(document.querySelectorAll('.cbx'));};
    var sync=function(){var n=boxes().filter(function(b){return b.checked;}).length;var btn=document.getElementById('createSel');btn.disabled=n===0;btn.textContent=n?('Create offboarding for '+n+' selected'):'Create offboarding for selected';};
    document.getElementById('cbxAll').addEventListener('change',function(e){boxes().forEach(function(b){b.checked=e.target.checked;});sync();});
    boxes().forEach(function(b){b.addEventListener('change',sync);});
    document.getElementById('createSel').addEventListener('click',function(){
      var guids=boxes().filter(function(b){return b.checked;}).map(function(b){return b.value;});
      if(!guids.length)return; var btn=this; btn.disabled=true; btn.textContent='Creating…';
      fetch('/api/offboarding/backlog/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guids:guids})})
        .then(function(r){return r.json();}).then(function(res){
          OS.toast('Created '+res.created+' offboarding request'+(res.created===1?'':'s')+(res.skipped?(', skipped '+res.skipped):'')+'.');
          setTab('board');
        }).catch(function(){btn.disabled=false;btn.textContent='Create offboarding for selected';OS.toast('Could not create.','bad');});
    });
  });
}

/* ---------- new ---------- */
var PEOPLE=[];
// A type-ahead combobox over `items`. labelFn -> display text, valueFn -> hidden value. Filters as
// you type (matches anywhere in the label), click to pick. onPick(item) fires on selection.
function combo(inputId,hiddenId,listId,items,labelFn,valueFn,onPick){
  var inp=document.getElementById(inputId),hid=document.getElementById(hiddenId),list=document.getElementById(listId);
  function render(q){
    q=(q||'').toLowerCase().trim();
    var m=items.filter(function(it){return labelFn(it).toLowerCase().indexOf(q)>=0;}).slice(0,25);
    if(!m.length){list.hidden=true;list.innerHTML='';return;}
    list.innerHTML=m.map(function(it){return '<div class="combo-opt" data-v="'+esc(String(valueFn(it)))+'" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--divider,#eee);font-size:13px">'+esc(labelFn(it))+'</div>';}).join('');
    list.hidden=false;
    Array.prototype.forEach.call(list.querySelectorAll('.combo-opt'),function(o){
      o.addEventListener('mouseenter',function(){o.style.background='var(--hover,#f2f4f7)';});
      o.addEventListener('mouseleave',function(){o.style.background='';});
      o.addEventListener('mousedown',function(e){e.preventDefault();
        var it=items.filter(function(x){return String(valueFn(x))===o.getAttribute('data-v');})[0];
        inp.value=labelFn(it);hid.value=valueFn(it);list.hidden=true;if(onPick)onPick(it);});
    });
  }
  inp.addEventListener('input',function(){hid.value='';render(inp.value);});
  inp.addEventListener('focus',function(){render(inp.value);});
  inp.addEventListener('blur',function(){setTimeout(function(){list.hidden=true;},150);});
  return {set:function(label,val){inp.value=label||'';hid.value=val||'';}};
}
function renderNew(){
  document.getElementById('view').innerHTML='<div class="empty">Loading employees…</div>';
  fetch('/api/offboarding/people').then(function(r){return r.json();}).then(function(d){
    PEOPLE=d.employees||[];
    // Forward target can be ANY active employee with a usable address (work email, else UPN).
    var emailOf=function(p){return p.work_email||p.upn||'';};
    var withEmail=PEOPLE.filter(function(p){return emailOf(p);});
    var box='position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card,#fff);border:1px solid var(--divider,#ddd);border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)';
    document.getElementById('view').innerHTML=
      '<form class="of" id="newForm">'+
      '<div class="fld full" style="position:relative"><label>Employee</label><input type="text" id="empSearch" placeholder="Type a name to search…" autocomplete="off"><input type="hidden" name="employee" id="empId"><div id="empList" style="'+box+'" hidden></div></div>'+
      '<div class="fld"><label>UPN / work email</label><input type="email" name="upn" id="empUpn" placeholder="auto-filled" readonly></div>'+
      '<div class="fld"><label>Office</label><input type="text" name="office" id="empOffice" placeholder="auto-filled" readonly></div>'+
      '<div class="fld full" style="position:relative"><label>Manager (forward target)</label><input type="text" id="mgrSearch" placeholder="Type a manager\'s name…" autocomplete="off"><input type="hidden" name="manager_email" id="mgrEmail"><div id="mgrList" style="'+box+'" hidden></div><div class="sub2" id="mgrHint" style="margin-top:4px"></div></div>'+
      '<div class="fld"><label>Last working day</label><input type="date" name="last_working_date"></div>'+
      '<div class="fld"><label>Termination date</label><input type="date" name="termination_date"></div>'+
      '<div class="fld full"><label class="chk"><input type="checkbox" name="hold"> Keep the mailbox on hold at retention instead of deleting it</label></div>'+
      '<div class="full"><button type="submit" class="os-btn primary">Start offboarding</button></div>'+
      '</form>';
    var mgrCombo=combo('mgrSearch','mgrEmail','mgrList',withEmail,function(p){return p.name+(p.office?(' - '+p.office):'');},function(p){return emailOf(p);});
    combo('empSearch','empId','empList',PEOPLE,function(p){return p.name+(p.office?(' - '+p.office):'');},function(p){return p.id;},function(p){
      document.getElementById('empUpn').value=p.upn||p.work_email||'';
      document.getElementById('empOffice').value=p.office||'';
      var hint=document.getElementById('mgrHint');
      // Pre-fill the manager combo from the person's resolved manager.
      if(p.manager_email){mgrCombo.set(p.manager||'',p.manager_email);hint.textContent=p.manager?('Manager on file: '+p.manager):'';}
      else{mgrCombo.set('','');hint.textContent=p.manager?('Manager on file: '+p.manager+' - no email matched, search and pick one above'):'';}
    });
    document.getElementById('newForm').addEventListener('submit',function(e){
      e.preventDefault(); var f=e.target;
      if(!f.employee.value){OS.toast('Pick an employee.','bad');return;}
      var body={employee_id:Number(f.employee.value),manager_email:f.manager_email.value||undefined,last_working_date:f.last_working_date.value||undefined,termination_date:f.termination_date.value||undefined,mailbox_action:f.hold.checked?'hold':'delete'};
      fetch('/api/offboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){return r.json();}).then(function(d){if(!d.ok){OS.toast(d.error||'Could not create.','bad');return;}OS.toast('Offboarding started.');setTab('board');});
    });
  });
}

document.addEventListener('DOMContentLoaded',function(){
  if(!window.OS){setTimeout(arguments.callee,50);return;}
  document.querySelectorAll('#headActions [data-tab]').forEach(function(b){b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'));});});
  // Restore the sub-tab from the hash the shell loaded us with (e.g. #backlog).
  var h=(location.hash||'').replace(/^#/,'');
  if(h==='board'||h==='backlog'||h==='new') TAB=h;
  setTab(TAB);
});
</script>
</body>
</html>
