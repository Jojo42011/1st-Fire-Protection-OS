<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reviews · Northstar</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  html,body{height:100%}
  .hub{display:flex;flex-direction:column;height:100vh;max-width:none}
  .hub-head{padding:18px 22px 0}
  .hub-tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--divider);margin-top:14px}
  .hub-tab{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:13px;color:var(--muted);padding:11px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .hub-tab.on{color:var(--ink);border-bottom-color:var(--fp-red,#E53935)}
  .hub-tab .tag{font-weight:700;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:var(--fill);border-radius:6px;padding:2px 6px;margin-left:7px;vertical-align:middle}
  .hub-frame{flex:1;width:100%;border:0;background:var(--bg)}
  .fnl{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px 0}
  .fnl .kpi{flex:1;min-width:150px}
  .fnl .arrow{align-self:center;color:var(--faint);font-size:18px;font-weight:800}
</style>
</head>
<body>
<div class="hub">
  <div class="hub-head">
    <p style="font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">Reputation · The word-of-mouth loop</p>
    <h1 style="font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink);margin-top:5px">Reviews</h1>
  </div>

  <!-- the funnel: ask -> earn -> rate -->
  <div class="fnl" id="funnel"></div>

  <div class="hub-tabs">
    <button class="hub-tab on" data-src="/review-requests" onclick="tab(this)">Requests</button>
    <button class="hub-tab" data-src="/reviews" onclick="tab(this)">Reviews &amp; replies<span class="tag" id="rr-tag">demo</span></button>
  </div>

  <iframe id="frame" class="hub-frame" src="/review-requests?embed=1" allow="clipboard-write"></iframe>
</div>

<script>
function kpi(l,v,s){return '<div class="kpi"><div class="top"><div class="lab">'+l+'</div></div><div class="val">'+v+'</div><div class="sub">'+(s||'')+'</div></div>';}
function tab(btn){
  var tabs=document.querySelectorAll('.hub-tab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('on');
  btn.classList.add('on');
  document.getElementById('frame').src=btn.getAttribute('data-src')+'?embed=1';
}
// funnel numbers from both halves (outbound requests + inbound reputation)
Promise.all([
  fetch('/api/reviews/targets').then(function(r){return r.json();}).catch(function(){return {};}),
  fetch('/api/reviews').then(function(r){return r.json();}).catch(function(){return {};})
]).then(function(res){
  var rq=(res[0]&&res[0].summary)||{}, rep=(res[1]&&res[1].summary)||{};
  var live=res[1]&&res[1].live;
  if(live){document.getElementById('rr-tag').textContent='live';}
  var avg=rep.avgRating?Number(rep.avgRating).toFixed(1):'—';
  document.getElementById('funnel').innerHTML=
    kpi('Requests sent',(rq.sent||0),'via Microsoft 365')+
    '<span class="arrow">→</span>'+
    kpi('Held to send',(rq.held||0),(rq.dailySent||0)+' / '+(rq.dailyCap||40)+' today')+
    '<span class="arrow">→</span>'+
    kpi('Reviews earned',(rep.totalReviews!=null?rep.totalReviews:'—'),(rep.thisMonthDelta?('+'+rep.thisMonthDelta+' this month'):'')+(live?'':' · demo'))+
    '<span class="arrow">→</span>'+
    kpi('Avg rating',avg,live?'live from Google':'demo until Google connects');
});
</script>
</body>
</html>
