<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quotes · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div><h1>Quotes</h1><div class="os-q">The sales pipeline: what is open, won, and lost.</div>
        <div class="os-ctx" style="margin-top:8px"><span class="chip" id="ctxOffice">All offices</span><span class="chip" id="ctxPeriod">This month</span></div></div>
    </div>
    <div class="os-kpis" id="kpis" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
    <div class="os-filters" id="views" style="margin:18px 0 10px"></div>
    <div id="list"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var view='open_pipeline';
var VIEWS=[['open_pipeline','Open'],['quotes_won','Won'],['quotes_lost','Lost']];
function renderViews(){document.getElementById('views').innerHTML=VIEWS.map(function(v){return '<button class="os-fb'+(v[0]===view?' on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>';}).join('');}
function reload(){
  document.getElementById('ctxOffice').textContent=OS.officeLabel();
  document.getElementById('ctxPeriod').textContent=OS.periodLabel();
  document.getElementById('kpis').innerHTML=OS.skeletonKpis(3);
  OS.metrics(['open_pipeline','quote_win_rate','quotes_won'],{compare:true}).then(function(cards){
    document.getElementById('kpis').innerHTML=OS.kpiRow(cards.filter(Boolean),{});
  });
  loadList();
}
function loadList(){
  document.getElementById('list').innerHTML=OS.skeletonKpis(1);
  OS.drill(view,{limit:100}).then(function(d){
    if(!d||!d.ok){document.getElementById('list').innerHTML=OS.empty('No quotes in this view.');return;}
    document.getElementById('list').innerHTML=OS.table(d.columns,d.rows,{empty:'No quotes in this view.'});
  });
}
document.getElementById('views').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b){view=b.getAttribute('data-view');renderViews();loadList();}});
OS.ready(function(){renderViews();reload();}); OS.onChange(reload);
</script>
</body>
</html>
