<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offices · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" /><link rel="stylesheet" href="/signal.css" /><link rel="stylesheet" href="/os.css" />
<style>
  .ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .oc{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:16px;cursor:pointer;transition:border-color .12s}
  .oc:hover{border-color:var(--border-strong)}
  .oc h3{font-weight:800;font-size:16px;color:var(--ink)}
  .oc .mets{display:flex;gap:18px;margin-top:12px}
  .oc .m .l{font-weight:650;font-size:10.5px;text-transform:uppercase;color:var(--muted)}
  .oc .m .v{font-weight:800;font-size:19px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
  .oc .go{font-weight:700;font-size:12px;color:var(--os-accent);margin-top:12px;display:inline-block}
</style>
</head><body>
  <div class="os-wrap">
    <div class="os-head"><div><h1>Offices</h1><div class="os-q">Each office, at a glance. Open one for its full operating profile.</div></div></div>
    <div class="ocards" id="cards"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
function load(){
  document.getElementById('cards').innerHTML=OS.skeletonKpis(6);
  Promise.all([
    fetch('/api/metrics/open_pipeline/by-office?period='+OS.period()).then(function(r){return r.json();}),
    fetch('/api/metrics/open_deficiencies/by-office?period='+OS.period()).then(function(r){return r.json();})
  ]).then(function(res){
    var pipe={}, def={};
    (res[0].rows||[]).forEach(function(r){pipe[r.office]={label:r.label,value:r.value};});
    (res[1].rows||[]).forEach(function(r){def[r.office]=r.value;});
    var keys=Object.keys(pipe);
    if(!keys.length){document.getElementById('cards').innerHTML=OS.empty('No offices in your scope.');return;}
    document.getElementById('cards').innerHTML=keys.map(function(k){
      return '<div class="oc" data-office="'+OS.esc(k)+'"><h3>'+OS.esc(pipe[k].label)+'</h3>'+
        '<div class="mets"><div class="m"><div class="l">Open pipeline</div><div class="v">'+OS.money(pipe[k].value)+'</div></div>'+
        '<div class="m"><div class="l">Open deficiencies</div><div class="v">'+OS.num(def[k]||0)+'</div></div></div>'+
        '<span class="go">Open office performance →</span></div>';
    }).join('');
  }).catch(function(){document.getElementById('cards').innerHTML=OS.errorBox('Could not load offices.');});
}
document.addEventListener('click',function(e){var c=e.target.closest('[data-office]');if(c){OS.go('officePerf',{office:c.getAttribute('data-office')});}});
OS.ready(load); OS.onChange(load);
</script></body></html>
