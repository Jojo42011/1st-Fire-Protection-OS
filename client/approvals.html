<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Approvals · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
<style>
  .ap{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:16px 17px;margin-bottom:12px}
  .ap .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .ap .cat{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3)}
  .ap .t{font-weight:750;font-size:15.5px;color:var(--ink);margin-top:3px;line-height:1.3}
  .ap .reason{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:5px}
  .ap .body{font-weight:500;font-size:12.5px;color:var(--ink-2);background:var(--fill);border-radius:10px;padding:11px 13px;margin-top:11px;white-space:pre-wrap;max-height:150px;overflow:auto}
  .ap .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .ap .stake{font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ap .acts{display:flex;gap:8px;margin-top:13px}
  .ap .acts button{font-weight:700;font-size:13px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--ink-2)}
  .ap .acts .yes{background:var(--os-good);color:#fff;border-color:transparent}
  .ap .acts .no{background:var(--panel);color:var(--os-bad);border-color:var(--os-bad)}
</style>
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div><h1>Approvals</h1><div class="os-q">What needs your decision. Nothing leaves the building without a yes.</div></div>
    </div>
    <div class="os-kpis" id="kpis" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
    <div class="os-filters" id="catFilters" style="margin:18px 0 8px"></div>
    <div id="list"></div>
  </div>
<script src="/os.js"></script>
<script>
"use strict";
var catFilter='';
var CATS=[['','All'],['Access','Access'],['Spend','Spend'],['Financial','Financial'],['People','People'],['External communication','External comms']];
function categoryOf(it){
  var k=it.kind||'', a=it.agent_key||'';
  if(/seat|reclaim|cancel/.test(k)||a==='licenses') return 'Spend';
  if(/quote_price|push_st|price/.test(k)||a==='crm') return 'Financial';
  if(a==='people'||/access|provision/.test(k)) return 'Access';
  return 'External communication';
}
function load(){
  fetch('/api/approvals').then(function(r){return r.json();}).then(function(d){
    var items=(d.items||[]).map(function(it){ it._cat=categoryOf(it); return it; });
    renderKpis(items);
    renderCats(items);
    var shown=catFilter?items.filter(function(it){return it._cat===catFilter;}):items;
    var list=document.getElementById('list');
    if(!shown.length){ list.innerHTML=OS.empty('Nothing needs your decision right now.','✓'); return; }
    list.innerHTML=shown.map(card).join('');
  }).catch(function(){document.getElementById('list').innerHTML=OS.errorBox('Could not load approvals.');});
}
function renderKpis(items){
  var byCat={}; items.forEach(function(it){byCat[it._cat]=(byCat[it._cat]||0)+1;});
  var cards=[['Waiting',items.length]];
  ['Financial','Spend','External communication'].forEach(function(c){ if(byCat[c]) cards.push([c==='External communication'?'External':c,byCat[c]]); });
  document.getElementById('kpis').innerHTML=cards.map(function(c){return '<div class="os-kpi"><div class="lab">'+c[0]+'</div><div class="val">'+c[1]+'</div></div>';}).join('');
}
function renderCats(items){
  var present={}; items.forEach(function(it){present[it._cat]=true;});
  document.getElementById('catFilters').innerHTML=CATS.filter(function(c){return c[0]===''||present[c[0]];}).map(function(c){
    return '<button class="os-fb'+(c[0]===catFilter?' on':'')+'" data-cat="'+OS.esc(c[0])+'">'+OS.esc(c[1])+'</button>'; }).join('');
}
function card(it){
  var risk=it.risk==='sensitive'?OS.pill('sensitive','warn'):OS.pill('routine','neutral');
  var stake=it.stake?'<span class="stake">'+OS.esc(it.stake)+'</span>':'';
  return '<div class="ap"><div class="h"><div><div class="cat">'+OS.esc(it._cat)+'</div>'+
    '<div class="t">'+OS.esc(it.title)+'</div>'+
    (it.trail?'<div class="reason">'+OS.esc(it.trail)+'</div>':'')+'</div>'+stake+'</div>'+
    (it.body?'<div class="body">'+OS.esc(it.body)+'</div>':'')+
    '<div class="tags">'+risk+(it.subject_type?'<span class="os-tag">'+OS.esc(it.subject_type)+'</span>':'')+'</div>'+
    '<div class="acts"><button class="yes" data-approve="'+it.id+'">Approve</button>'+
      '<button class="no" data-decline="'+it.id+'">Decline</button></div></div>';
}
document.addEventListener('click',function(e){
  var c=e.target.closest('[data-cat]'); if(c){ catFilter=c.getAttribute('data-cat'); load(); return; }
  var y=e.target.closest('[data-approve]'); if(y){ y.disabled=true; y.textContent='Approving…';
    fetch('/api/approvals/'+y.getAttribute('data-approve')+'/approve',{method:'POST'}).then(function(){load();}); return; }
  var n=e.target.closest('[data-decline]'); if(n){ n.disabled=true;
    fetch('/api/approvals/'+n.getAttribute('data-decline')+'/skip',{method:'POST'}).then(function(){load();}); return; }
});
OS.ready(function(){ load(); });
OS.onChange(load);
</script>
</body>
</html>
