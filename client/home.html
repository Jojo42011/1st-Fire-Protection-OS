<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<style>
  body{background:var(--bg)}
  .wrap{max-width:1160px;margin:0 auto;padding:26px 24px 60px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .top h1{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
  .top .ctx{font-weight:600;font-size:13px;color:var(--muted);margin-top:3px}
  .top .ctx b{color:var(--ink-2)}
  /* source freshness strip */
  .sources{display:flex;gap:8px;flex-wrap:wrap}
  .src{display:flex;align-items:center;gap:7px;font-weight:600;font-size:11.5px;color:var(--ink-2);
    border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 11px;background:var(--panel)}
  .src .d{width:7px;height:7px;border-radius:50%;flex:none}
  .src .d.fresh{background:#1f9d55}.src .d.stale{background:#e8a13a}.src .d.no_sync{background:#8892a6}.src .d.not_connected{background:#c1c6d0}
  .sec-h{font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
  /* needs attention */
  .attn{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .acard{border:1px solid var(--border);border-left-width:4px;border-radius:var(--r-card,14px);background:var(--panel);
    padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
  .acard.red{border-left-color:#e5484d}.acard.amber{border-left-color:#e8a13a}.acard.gray{border-left-color:#8892a6}
  .acard .t{font-weight:750;font-size:15px;color:var(--ink);line-height:1.3}
  .acard .why{font-weight:500;font-size:12.5px;color:var(--muted)}
  .acard .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:10px}
  .acard .meta{font-weight:600;font-size:11.5px;color:var(--ink-3)}
  .acard .go{font-weight:700;font-size:12px;color:#fff;background:var(--fp-red,#E53935);border:none;border-radius:9px;padding:8px 13px;cursor:pointer}
  .acard .go:hover{filter:brightness(1.05)}
  .allclear{border:1px dashed var(--border-strong,#c9ccd6);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .kpi{border:1px solid var(--border);border-radius:var(--r-card,14px);background:var(--panel);padding:16px 16px 15px;cursor:default}
  .kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:var(--border-strong)}
  .kpi .lab{font-weight:700;font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--ink);margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-weight:550;font-size:12px;color:var(--ink-3);margin-top:3px}
  .kpi .tag{display:inline-block;margin-top:8px;font-weight:700;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--muted);background:var(--fill);border-radius:var(--r-pill);padding:3px 8px}
  .muted-note{font-weight:500;font-size:12px;color:var(--muted);margin-top:14px}
  @media(max-width:620px){.wrap{padding:18px 14px 50px}.top h1{font-size:19px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 id="greeting">Home</h1>
        <div class="ctx" id="ctx">Loading…</div>
      </div>
      <div class="sources" id="sources"></div>
    </div>

    <div class="sec-h">Needs attention</div>
    <div id="attn"></div>

    <div class="sec-h">How it's doing</div>
    <div class="kpis" id="kpis"></div>
    <div class="muted-note" id="note"></div>
  </div>

<script>
"use strict";
var NAV='app-navigate';
function office(){try{return localStorage.getItem('fpos_office')||'all';}catch(_){return 'all';}}
function officeParam(){var o=office();return o&&o!=='all'?('?office='+encodeURIComponent(o)):'';}
function go(tab){try{parent.postMessage({type:NAV,tab:tab},'*');}catch(_){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function money(n){n=Number(n)||0;var s=n<0?'-':'';n=Math.abs(n);
  return s+'$'+(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':Math.round(n));}
function ago(iso){if(!iso)return '';var s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return 'just now';var m=s/60;if(m<90)return Math.round(m)+'m ago';var h=m/60;if(h<36)return Math.round(h)+'h ago';return Math.round(h/24)+'d ago';}

function loadSources(){
  fetch('/api/sources').then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('sources');if(!el)return;
    el.innerHTML=(d.sources||[]).map(function(s){
      var when = s.status==='fresh'&&s.lastSyncedAt ? ago(s.lastSyncedAt)
        : s.status==='stale' ? 'stale'+(s.lastSyncedAt?' · '+ago(s.lastSyncedAt):'')
        : s.status==='no_sync' ? 'no sync' : 'not connected';
      return '<span class="src" title="'+esc(s.detail||'')+'"><span class="d '+s.status+'"></span>'+esc(s.label)+' · '+esc(when)+'</span>';
    }).join('');
  }).catch(function(){});
}

function attnCard(a){
  var tone=a.tone==='red'?'red':a.tone==='amber'?'amber':'gray';
  var meta = a.amount!=null ? (a.amountProjected?'~':'')+money(a.amount)+(a.amountProjected?' projected':'')
    : (a.count!=null? a.count+' item'+(a.count===1?'':'s') : '');
  return '<div class="acard '+tone+'">'+
    '<div class="t">'+esc(a.title)+'</div>'+
    '<div class="why">'+esc(a.why)+'</div>'+
    '<div class="row"><span class="meta">'+esc(meta)+'</span>'+
      (a.screen?'<button class="go" data-tab="'+esc(a.screen)+'">View</button>':'')+'</div>'+
  '</div>';
}

function kpiCard(lab,val,sub,tab,tag){
  return '<div class="kpi'+(tab?' clickable':'')+'"'+(tab?' data-tab="'+esc(tab)+'"':'')+'>'+
    '<div class="lab">'+esc(lab)+'</div>'+
    '<div class="val">'+esc(val)+'</div>'+
    '<div class="sub">'+esc(sub||'')+'</div>'+
    (tag?'<span class="tag">'+esc(tag)+'</span>':'')+
  '</div>';
}

function load(){
  fetch('/api/home'+officeParam()).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){document.getElementById('ctx').textContent='Could not load.';return;}
    document.getElementById('greeting').textContent=d.greeting||'Home';
    var scope = d.officeName + (d.canSeeAllOffices? '' : ' (your office)');
    document.getElementById('ctx').innerHTML='Viewing <b>'+esc(scope)+'</b>. What needs attention, and how it is doing.';

    var attn=document.getElementById('attn');
    if(!d.attention||!d.attention.length){
      attn.innerHTML='<div class="allclear">Nothing needs attention in '+esc(d.officeName)+' right now.</div>';
    }else{
      attn.className='attn';
      attn.innerHTML=d.attention.map(attnCard).join('');
    }

    var k=d.kpis||{};
    var ro=k.repairOpportunity||{}, pi=k.pipeline||{}, jc=k.jobsCompleted||{}, ar=k.ar||{}, ph=k.phones||{};
    var repairTotal = (ro.quoted||0)+(ro.projected||0);
    document.getElementById('kpis').innerHTML=[
      kpiCard('Repair opportunity', money(repairTotal), (ro.sub||'')+' · '+money(ro.quoted||0)+' quoted', 'deficiencies'),
      kpiCard('Open pipeline', money(pi.value), pi.sub||'open quotes', 'pipeline'),
      kpiCard('Jobs completed', jc.value||0, jc.sub||'last 30 days', 'jobs'),
      kpiCard('Accounts receivable', money(ar.value), ar.sub||'', 'receivables', ar.companyWide?'company-wide':''),
      kpiCard('Calls today', ph.value||0, ph.sub||'', 'phones', ph.companyWide?'company-wide':'')
    ].join('');

    var note=document.getElementById('note');
    note.textContent = d.canSeeAllOffices
      ? 'AR and phones are company-wide (not yet office-attributed). Deficiencies, pipeline and jobs are scoped to the selected office.'
      : 'You are scoped to your office. Company-wide figures are labeled.';
  }).catch(function(){document.getElementById('ctx').textContent='Could not load.';});
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(b)go(b.getAttribute('data-tab'));
});
window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='fp-office'){load();}});
load();
loadSources();
</script>
</body>
</html>
