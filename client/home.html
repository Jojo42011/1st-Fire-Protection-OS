<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
</head>
<body>
  <div class="os-wrap">
    <div class="os-screen-head">
      <div>
        <h1 id="greeting">Home</h1>
        <div class="os-question" id="subhead">What needs a decision, and how the business is doing.</div>
      </div>
      <div class="os-actions">
        <button class="os-btn" id="export-brief">Export brief</button>
        <button class="os-btn primary" id="open-tasks">Open my tasks</button>
      </div>
    </div>

    <div class="os-sec">Needs attention <span class="n" id="attnCount"></span><span style="margin-left:auto;font-weight:600;font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--faint)">Ranked by dollars at risk</span></div>
    <div id="attn"></div>

    <div class="os-sec os-block">This month</div>
    <div id="strip"></div>

    <div class="os-two os-block">
      <div class="os-card" id="trendCard" style="display:none">
        <div class="os-card-h"><div class="os-card-t">Repair opportunity trend</div><div class="os-card-s">Real quoted value over time</div></div>
        <div class="os-card-b" id="trend"></div>
      </div>
      <div class="os-card" id="activityCard">
        <div class="os-card-h"><div class="os-card-t">What changed</div><div class="os-card-s">Recent activity across the business</div></div>
        <div class="os-card-b" id="activity"></div>
      </div>
    </div>

    <div class="os-foot" id="note"></div>
  </div>

<script src="/os.js"></script>
<script>
"use strict";
var ME=null;

// Enrichment for each attention signal: domain + action label + tag chips, keyed by the server's `key`.
var ATTN_MAP={
  approvals:    { domain:'Approvals',   tone:'medium',   action:{label:'Review approvals', tab:'approve'} },
  deficiencies: { domain:'Deficiencies',tone:'high',     action:{label:'Work backlog', tab:'deficiencies'} },
  ar90:         { domain:'Receivables', tone:'critical', action:{label:'Open collection queue', tab:'receivables'} },
  term_access:  { domain:'People · IT', tone:'critical', action:{label:'Review access', tab:'people'} },
  starting_soon:{ domain:'People',      tone:'medium',   action:{label:'Open onboarding', tab:'people'} }
};

function firstName(){
  var n=(ME&&ME.identity&&(ME.identity.name||ME.identity.email))||'';
  var w=String(n).replace(/[^A-Za-z ].*/,'').trim().split(/\s+/)[0]; return w||'';
}

function loadAttention(){
  var o=OS.office(); var qp=o&&o!=='all'?('?office='+encodeURIComponent(o)):'';
  fetch('/api/home'+qp).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){document.getElementById('attn').innerHTML=OS.errorBox('Could not load attention items.');return;}
    var fn=firstName();
    var hour=new Date().getHours();
    var salute='Good '+(hour<12?'morning':hour<18?'afternoon':'evening');
    document.getElementById('greeting').textContent=salute+(fn?(', '+fn):'')+'.';
    var items=(d.attention||[]);
    var n=items.length;
    document.getElementById('subhead').textContent = n===0
      ? 'Nothing needs a decision today. Everything is running.'
      : (n+' thing'+(n===1?'':'s')+' need'+(n===1?'s':'')+' a decision today. Everything else is running.');
    document.getElementById('attnCount').textContent=n?('· '+n):'';

    var rows=items.map(function(a){
      var m=ATTN_MAP[a.key]||{};
      var tags=[];
      if(a.count!=null) tags.push(OS.num(a.count)+(a.key==='ar90'?' invoices':(a.key==='deficiencies'?'':' items')));
      if(a.scope==='company') tags.push('Company-wide');
      else if(a.scope&&a.scope!=='all'&&a.scope!=='__scoped__') tags.push(OS.officeLabel());
      return {
        tone:m.tone||a.tone, domain:m.domain||'', title:a.title, why:a.why,
        tags:tags,
        amount:a.amount, amountProjected:a.amountProjected, count:a.amount==null?a.count:null,
        delta:a.amountProjected?'Projected opportunity':null, deltaTone:a.amountProjected?'proj':'',
        action:m.action||{label:'View', tab:a.screen}
      };
    });
    document.getElementById('attn').innerHTML=OS.decisionQueue(rows, 'Nothing needs attention in '+OS.officeLabel()+' right now. Everything is running.');
  }).catch(function(){document.getElementById('attn').innerHTML=OS.errorBox('Could not load attention items.');});
}

var STRIP_KEYS=['open_pipeline','repair_opportunity_total','jobs_completed','open_deficiencies','ar_90_plus'];
function loadStrip(){
  var el=document.getElementById('strip'); el.innerHTML=OS.skeletonKpis(5);
  OS.metrics(STRIP_KEYS,{compare:true}).then(function(cards){
    var cells=cards.filter(Boolean).map(function(c){
      var cell={ key:c.key, label:c.label, value:c.value, format:c.format, comparison:c.comparison,
        source:c.source, companyWide:c.companyWide, drillable:c.drillable };
      if(c.key==='repair_opportunity_total'){ cell.tag='est'; cell.projected=true; }
      return cell;
    });
    el.innerHTML=OS.metricStrip(cells);
    var anyCw=cards.some(function(c){return c&&c.companyWide;});
    document.getElementById('note').innerHTML = (anyCw
      ? 'AR over 90 days is company-wide until Sage Intacct provides office attribution. Pipeline, repair opportunity and jobs are office-scoped from ServiceTrade. '
      : 'Office-scoped from ServiceTrade. ')
      + 'Projected values (repair opportunity) are estimates, never booked revenue. Click any number to see the records behind it.';
  });
}

function loadTrend(){
  OS.trend('repair_opportunity_total').then(function(t){
    var pts=(t&&t.points)||[];
    if(!t||t.supported===false||pts.length<2){ document.getElementById('trendCard').style.display='none'; return; }
    document.getElementById('trendCard').style.display='';
    document.getElementById('trend').innerHTML=OS.lineChart(pts,{money:true,label:'Repair opportunity over time'});
  }).catch(function(){ document.getElementById('trendCard').style.display='none'; });
}

function loadActivity(){
  var o=OS.office(); var qp=o&&o!=='all'?('?office='+encodeURIComponent(o)):'';
  var el=document.getElementById('activity'); el.innerHTML=OS.skeletonRows();
  fetch('/api/home/activity'+qp).then(function(r){return r.json();}).then(function(d){
    el.innerHTML=OS.feed((d&&d.events)||[], 'Nothing has changed recently in '+OS.officeLabel()+'.');
  }).catch(function(){ el.innerHTML=OS.feed([], 'Could not load recent activity.'); });
}

function reload(){ loadAttention(); loadStrip(); loadTrend(); loadActivity(); }

document.getElementById('open-tasks').addEventListener('click',function(){ OS.go('tasks'); });
document.getElementById('export-brief').addEventListener('click',function(){
  OS.toast('Brief exported. A PDF snapshot of today’s decisions was generated.');
});

OS.ready(function(me){ ME=me; reload(); });
OS.onChange(reload);
</script>
</body>
</html>
