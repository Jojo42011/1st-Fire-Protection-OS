<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home · 1st FP OS</title>
<script src="/theme-sync.js"></script>
<link rel="stylesheet" href="/brand/brand.css" />
<link rel="stylesheet" href="/signal.css" />
<link rel="stylesheet" href="/os.css" />
</head>
<body>
  <div class="os-wrap">
    <div class="os-head">
      <div>
        <h1 id="greeting">Home</h1>
        <div class="os-q">What needs your attention, and how the business is doing.</div>
        <div class="os-ctx" style="margin-top:8px"><span class="chip" id="ctxOffice">All offices</span><span class="chip" id="ctxPeriod">This month</span></div>
      </div>
      <div class="os-sources" id="sources"></div>
    </div>

    <div class="os-sec">Needs attention <span class="n" id="attnCount"></span></div>
    <div id="attn"></div>

    <div class="os-sec">How it's doing</div>
    <div id="kpis"></div>
    <div class="os-q" id="note" style="margin-top:14px"></div>
  </div>

<script src="/os.js"></script>
<script>
"use strict";
// Role-aware KPI mix (operational fallback until Sage Intacct provides revenue/margin/cash).
var KPI_BY_ROLE={
  accounting:['ar_outstanding','ar_90_plus','open_pipeline','jobs_completed'],
  hr:['jobs_completed','open_pipeline','repair_opportunity_total','ar_90_plus'],
  _default:['open_pipeline','repair_opportunity_total','jobs_completed','open_deficiencies','ar_90_plus']
};
function kpiKeysFor(me){
  var roles=(me&&me.roles)||[];
  if(roles.indexOf('accounting')>=0) return KPI_BY_ROLE.accounting;
  if(roles.indexOf('hr')>=0&&roles.indexOf('partner')<0&&roles.indexOf('executive')<0) return KPI_BY_ROLE.hr;
  return KPI_BY_ROLE._default;
}
var ME=null;

function loadAttention(){
  var o=OS.office(); var qp=o&&o!=='all'?('?office='+encodeURIComponent(o)):'';
  fetch('/api/home'+qp).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){document.getElementById('attn').innerHTML=OS.errorBox('Could not load attention items.');return;}
    document.getElementById('greeting').textContent=d.greeting||'Home';
    var items=(d.attention||[]).map(function(a){
      return {title:a.title, why:a.why, tone:a.tone, amount:a.amount, amountProjected:a.amountProjected, count:a.count,
        tab:a.screen, office:(a.scope&&a.scope!=='company'&&a.scope!=='all'&&a.scope!=='__scoped__')?a.scope:null};
    });
    document.getElementById('attnCount').textContent=items.length?('· '+items.length):'';
    document.getElementById('attn').innerHTML=OS.attnGrid(items,'Nothing needs attention in '+OS.officeLabel()+' right now.');
  }).catch(function(){document.getElementById('attn').innerHTML=OS.errorBox('Could not load attention items.');});
}
function loadKpis(){
  var el=document.getElementById('kpis'); el.innerHTML=OS.skeletonKpis(5);
  var keys=kpiKeysFor(ME);
  OS.metrics(keys,{compare:true}).then(function(cards){
    el.innerHTML=OS.kpiRow(cards.filter(Boolean),{});
    var anyCw=cards.some(function(c){return c&&c.companyWide;});
    document.getElementById('note').textContent=anyCw
      ? 'AR is company-wide until Sage Intacct provides office attribution. Pipeline, repair opportunity and jobs are office-scoped from ServiceTrade. Projected values are estimates, never booked revenue. Click any number to see the records behind it.'
      : 'Office-scoped from ServiceTrade. Click any number to see the records behind it.';
  });
}
function paintCtx(){ document.getElementById('ctxOffice').textContent=OS.officeLabel(); document.getElementById('ctxPeriod').textContent=OS.periodLabel(); }
function reload(){ paintCtx(); loadAttention(); loadKpis(); }

OS.ready(function(me){ ME=me; OS.freshness(document.getElementById('sources')); reload(); });
OS.onChange(reload);
</script>
</body>
</html>
